      saveAlteracao(altId, fromDemandaId = '') {
        const titulo = document.getElementById('alt-titulo').value.trim();
        const comportamentoAnterior = document.getElementById('alt-antes').value.trim();
        const comportamentoNovo = document.getElementById('alt-depois').value.trim();
        const responsavel = document.getElementById('alt-resp').value.trim();

        if (!titulo || !comportamentoAnterior || !comportamentoNovo || !responsavel) {
          this.showToast('Preencha Título, Comportamento Anterior, Comportamento Novo e Responsável.', 'error');
          return;
        }

        const sgdOrigem = document.getElementById('alt-sgd').value.trim();
        const demMatch = (fromDemandaId && State.db.demandas.find(d => d.id === fromDemandaId)) || State.db.demandas.find(d => d.sgd.toLowerCase() === sgdOrigem.toLowerCase());

        const payload = {
          titulo,
          status: document.getElementById('alt-status').value,
          moduloId: document.getElementById('alt-modulo').value,
          funcionalidadeId: document.getElementById('alt-func').value,
          demandaId: demMatch ? demMatch.id : '',
          sgdOrigem,
          tipo: document.getElementById('alt-tipo').value,
          comportamentoAnterior,
          comportamentoNovo,
          beneficios: document.getElementById('alt-beneficios').value.trim(),
          impactosModulos: document.getElementById('alt-impactos').value.trim(),
          responsavel,
          versao: document.getElementById('alt-versao').value.trim(),
          dataSolicitacao: Utils.todayISO(),
          dataImplementacao: document.getElementById('alt-dtImpl').value,
          dataHomologacao: document.getElementById('alt-dtHom').value,
          dataPublicacao: document.getElementById('alt-dtPub').value,
          excluido: false
        };

        if (altId) {
          const idx = State.db.alteracoes.findIndex(x => x.id === altId);
          if (idx > -1) {
            const anterior = State.db.alteracoes[idx];
            const novaVersaoNum = (anterior.versaoRegistro || 1) + 1;
            State.db.alteracoes[idx] = { ...anterior, ...payload, versaoRegistro: novaVersaoNum };
            this.logAudit('ALTERACAO', altId, `Revisão v${novaVersaoNum} (${payload.status})`, `Alteração "${titulo}" atualizada preservando snapshot anterior na auditoria.`, anterior);
          }
        } else {
          const nova = { id: Utils.generateId('ALT'), versaoRegistro: 1, ...payload };
          State.db.alteracoes.unshift(nova);
          this.logAudit('ALTERACAO', nova.id, `Registro de ${payload.status}`, `Alteração "${titulo}" registrada para o módulo ${this.getModuleName(nova.moduloId)}.`, nova);
        }

        this.updateSidebarCounters();
        this.closeModal();
        this.renderCurrentView();
        this.showToast('Alteração registrada com trilha de versão preservada!');
      },

      saveHistoria(histId) {
        const titulo = document.getElementById('us-titulo').value.trim();
        const epico = document.getElementById('us-epico').value.trim();
        const perfilComo = document.getElementById('us-como').value.trim();
        const acaoQuero = document.getElementById('us-quero').value.trim();
        const beneficioPara = document.getElementById('us-para').value.trim();
        const responsavel = document.getElementById('us-resp').value.trim();

        if (!titulo || !epico || !perfilComo || !acaoQuero || !beneficioPara || !responsavel) {
          this.showToast('Preencha todos os campos obrigatórios (*).', 'error');
          return;
        }

        const payload = {
          titulo,
          epico,
          moduloId: document.getElementById('us-modulo').value,
          demandaId: document.getElementById('us-demanda').value,
          perfilComo,
          acaoQuero,
          beneficioPara,
          contexto: document.getElementById('us-contexto').value.trim(),
          fluxoPrincipal: document.getElementById('us-fluxo').value.trim(),
          prioridade: document.getElementById('us-prioridade').value,
          status: document.getElementById('us-status').value,
          responsavel,
          atualizadoEm: Utils.nowBR()
        };

        let targetId = histId;
        if (histId) {
          const idx = State.db.historiasUsuario.findIndex(x => x.id === histId);
          if (idx > -1) {
            const v = (parseFloat(State.db.historiasUsuario[idx].versao || '1.0') + 0.1).toFixed(1);
            State.db.historiasUsuario[idx] = { ...State.db.historiasUsuario[idx], ...payload, versao: v };
            this.logAudit('HISTORIA', histId, `Revisão de História v${v}`, `História "${titulo}" atualizada.`);
          }
        } else {
          targetId = Utils.generateId('US');
          const nova = { id: targetId, versao: '1.0', criadoEm: Utils.nowBR(), ...payload };
          State.db.historiasUsuario.unshift(nova);
          this.logAudit('HISTORIA', targetId, 'Criação de História de Usuário', `História "${titulo}" gerada.`);
        }

        // Limpa os critérios antigos e salva os novos baseados na DOM
        State.db.criteriosAceitacao = State.db.criteriosAceitacao.filter(c => c.historiaId !== targetId);
        document.querySelectorAll('.scenario-row').forEach(row => {
          const cenario = row.querySelector('.sec-cenario').value.trim();
          const dado = row.querySelector('.sec-dado').value.trim();
          const quando = row.querySelector('.sec-quando').value.trim();
          const entao = row.querySelector('.sec-entao').value.trim();

          if (cenario || dado || quando || entao) {
            State.db.criteriosAceitacao.push({
              id: Utils.generateId('CA'),
              historiaId: targetId,
              cenario: cenario || 'Cenário',
              dado,
              quando,
              entao
            });
          }
        });

        this.updateSidebarCounters();
        this.closeModal();
        this.renderCurrentView();
        this.showToast('História de usuário e cenários salvos!');
      },

      duplicateHistoria(histId) {
        if (!this.hasWritePermission()) return;
        const orig = State.db.historiasUsuario.find(x => x.id === histId);
        if (!orig) return;
        const copyId = Utils.generateId('US');
        const copy = {
          ...JSON.parse(JSON.stringify(orig)),
          id: copyId,
          titulo: `${orig.titulo} (Cópia)`,
          versao: '1.0',
          criadoEm: Utils.nowBR(),
          atualizadoEm: Utils.nowBR()
        };
        State.db.historiasUsuario.unshift(copy);
        this.logAudit('HISTORIA', copyId, 'Duplicação de História', `Duplicada a partir de ${orig.id}.`);
        this.updateSidebarCounters();
        this.renderCurrentView();
        this.showToast('História duplicada com sucesso!');
      },

      previewSelectedFile(input) {
        const metaEl = document.getElementById('doc-file-meta');
        const file = input.files?.[0];
        if (!file) {
          metaEl.textContent = '';
          return;
        }
        metaEl.innerHTML = `Arquivo: <strong>${Utils.escapeHtml(file.name)}</strong> • Tipo MIME: <code>${Utils.escapeHtml(file.type || 'application/octet-stream')}</code> • Tamanho: <strong>${Utils.formatBytes(file.size)}</strong>`;
      },

      saveDocumento() {
        const fileInput = document.getElementById('doc-file-input');
        const file = fileInput?.files?.[0];
        const descricao = document.getElementById('doc-desc').value.trim();
        const moduloId = document.getElementById('doc-modulo').value || 'GERAL';
        const entidadeTipo = document.getElementById('doc-ent-tipo').value;
        const entidadeId = document.getElementById('doc-ent-id').value.trim() || (moduloId === 'GERAL' ? 'PORTAL-RH' : moduloId);

        if (!file || !descricao) {
          this.showToast('Selecione um arquivo válido e preencha a descrição.', 'error');
          return;
        }

        const allowedExt = ['pdf', 'docx', 'xlsx', 'csv', 'txt', 'png', 'jpg', 'jpeg', 'webp'];
        const ext = file.name.split('.').pop().toLowerCase();
        if (!allowedExt.includes(ext)) {
          this.showToast(`Extensão .${ext} não permitida por política de segurança.`, 'error');
          return;
        }

        if (file.size > 15 * 1024 * 1024) {
          this.showToast('O arquivo excede o limite máximo de 15 MB.', 'error');
          return;
        }

        // Prevenção contra duplicidade de arquivo no mesmo registro e módulo
        const dup = State.db.documentos.find(d => d.situacao === 'Ativo' && d.nomeOriginal === file.name && d.entidadeId === entidadeId && (d.moduloId || 'GERAL') === moduloId);
        if (dup) {
          this.showToast('Este mesmo arquivo já está anexado ao módulo/registro informado.', 'warning');
          return;
        }

        const localBlobUrl = URL.createObjectURL(file);
        const novoDoc = {
          id: Utils.generateId('DOC'),
          nomeOriginal: file.name,
          categoria: document.getElementById('doc-categoria').value,
          moduloId,
          mimeType: file.type || `application/${ext}`,
          tamanhoBytes: file.size,
          dataEnvio: Utils.nowBR(),
          autor: State.currentUser,
          descricao,
          entidadeTipo,
          entidadeId,
          driveFileId: State.gasConfig.connected ? 'ENVIANDO_DRIVE' : 'SESSAO_LOCAL',
          driveUrl: localBlobUrl,
          situacao: 'Ativo'
        };

        State.db.documentos.unshift(novoDoc);
        this.logAudit(
          'DOCUMENTO',
          novoDoc.id,
          'Inclusão de documento/evidência',
          `Arquivo "${file.name}" (${Utils.formatBytes(file.size)}) anexado em [${this.getModuleName(moduloId)}] (${entidadeTipo}: ${entidadeId}).`,
          novoDoc
        );
        this.updateSidebarCounters();
        this.closeModal();
        this.renderCurrentView();
        this.showToast(`Anexo "${file.name}" vinculado a ${this.getModuleName(moduloId)}!`);
      },

      removeDocumentoLogico(docId) {
        if (!this.hasWritePermission()) return;
        const doc = State.db.documentos.find(d => d.id === docId);
        if (!doc) return;
        doc.situacao = 'Removido';
        this.logAudit('DOCUMENTO', doc.id, 'Exclusão lógica de anexo', `Anexo "${doc.nomeOriginal}" marcado como Removido preservando trilha histórica.`);
        this.updateSidebarCounters();
        this.renderCurrentView();
        this.showToast('Anexo marcado como removido (registro histórico preservado).', 'info');
      },

      /***********************************************************************
       * EXPORTAÇÃO DE RELATÓRIOS E DOCUMENTOS (PDF, DOCX, XLSX, CSV, HTML)
       ***********************************************************************/
      buildReportDataset(reportCode, modFilter, params = {}) {
        const filterMod = (item) => modFilter === 'TODOS' || item.moduloId === modFilter;
        const demandas = State.db.demandas.filter(d => !d.excluido && filterMod(d));
        const funcs = State.db.funcionalidades.filter(f => !f.excluido && filterMod(f));
        const alts = State.db.alteracoes.filter(a => !a.excluido && filterMod(a));
        const historias = State.db.historiasUsuario.filter(h => filterMod(h));

        const reportTitles = {
          'R01': '1. Inventário de Funcionalidades por Módulo',
          'R02': '2. Relação de Chamados por Período',
          'R03': '3. Demandas Abertas, em Atendimento e Concluídas',
          'R04': '4. Histórico de Atendimento de SGD Específico',
          'R05': '5. Relação de Alterações Implementadas',
          'R06': '6. Melhorias Publicadas por Módulo',
          'R07': '7. Histórico Evolutivo de Funcionalidade',
          'R08': '8. Relatório de Pendências e Demandas Atrasadas',
          'R09': '9. Relatório de Demandas por Responsável',
          'R10': '10. Catálogo de Regras de Negócio',
          'R11': '11. Documento de Especificação Funcional',
          'R12': '12. Documento de História de Usuário',
          'R13': '13. Relatório de Homologação',
          'R14': '14. Relatório Consolidado de Evolução do Portal RH'
        };

        let rows = [];
        switch (reportCode) {
          case 'R01':
          case 'R11':
            rows = funcs.map(f => ({
              ID: f.id,
              Modulo: this.getModuleName(f.moduloId),
              Funcionalidade: f.nome,
              Situacao: f.situacao,
              Versao: f.versao,
              Responsavel: f.responsavel || 'Não preenchido',
              Objetivo: f.objetivo || 'Não preenchido'
            }));
            break;
          case 'R02':
          case 'R03':
          case 'R08':
          case 'R09':
          case 'R13':
            rows = demandas.map(d => ({
              ID: d.id,
              SGD: d.sgd,
              Titulo: d.titulo,
              Modulo: this.getModuleName(d.moduloId),
              Status: d.status,
              Prioridade: d.prioridade,
              Solicitante: d.solicitante,
              Responsavel: d.responsavel,
              Abertura: Utils.formatDateBR(d.dataAbertura),
              Prazo: Utils.formatDateBR(d.prazo),
              Homologacao: d.resultadoHomologacao || 'Não preenchido'
            }));
            break;
          case 'R05':
          case 'R06':
            rows = alts.map(a => ({
              ID: a.id,
              Titulo: a.titulo,
              Modulo: this.getModuleName(a.moduloId),
              SGD_Origem: a.sgdOrigem || 'Não informado',
              Status: a.status,
              Versao: a.versao || '—',
              Responsavel: a.responsavel,
              Antes: a.comportamentoAnterior,
              Depois: a.comportamentoNovo
            }));
            break;
          case 'R10':
            rows = State.db.regrasNegocio.map(r => ({
              ID: r.id,
              Codigo: r.codigo,
              Titulo: r.titulo,
              Funcionalidade: this.getFuncName(r.funcionalidadeId),
              Descricao: r.descricao,
              Status: r.status
            }));
            break;
          case 'R12':
            rows = historias.map(h => ({
              ID: h.id,
              Titulo: h.titulo,
              Modulo: this.getModuleName(h.moduloId),
              Como: h.perfilComo,
              Quero: h.acaoQuero,
              Para: h.beneficioPara,
              Status: h.status,
              Responsavel: h.responsavel
            }));
            break;
          default:
            rows = State.db.historico.map(h => ({
              ID: h.id,
              DataHora: h.dataHora,
              Entidade: `${h.entidadeTipo} (${h.entidadeId})`,
              Evento: h.tipoEvento,
              Responsavel: h.usuario,
              Descricao: h.descricao
            }));
        }

        if (reportCode === 'R04') { const d = State.db.demandas.find(x => x.sgd === params.sgd); rows = d ? State.db.historico.filter(h => h.entidadeId === d.id) : []; }
        if (reportCode === 'R07') rows = params.funcId ? State.db.historico.filter(h => h.entidadeId === params.funcId) : [];
        if (reportCode === 'R08') rows = demandas.filter(d => d.prazo && new Date(d.prazo + 'T23:59:59') < new Date() && !['Concluída', 'Não atendida / Cancelada'].includes(d.status)).map(d => ({ SGD: d.sgd, Titulo: d.titulo, Status: d.status, Prazo: Utils.formatDateBR(d.prazo), Responsavel: d.responsavel }));
        if (reportCode === 'R02' && (params.start || params.end)) rows = rows.filter(r => { const date = String(r.Abertura || '').split('/').reverse().join('-'); return (!params.start || date >= params.start) && (!params.end || date <= params.end); });
        return {
          title: reportTitles[reportCode] || 'Relatório Gerencial do Portal RH',
          moduloLabel: modFilter === 'TODOS' ? 'Todos os 13 Módulos do Portal RH' : this.getModuleName(modFilter),
          generatedAt: Utils.nowBR(),
          rows
        };
      },

      previewReport() {
        const code = document.getElementById('rep-type')?.value || 'R14';
        const params = { sgd: document.getElementById('rep-sgd')?.value || '', funcId: document.getElementById('rep-func')?.value || '', start: document.getElementById('rep-start')?.value || '', end: document.getElementById('rep-end')?.value || '' };
        const data = this.buildReportDataset(code, document.getElementById('rep-modulo')?.value || 'TODOS', params);
        const target = document.getElementById('report-preview'); if (!target) return;
        if (!data.rows.length) { target.innerHTML = '<p class="rounded-lg bg-white p-4 text-sm text-slate-500">Nenhum registro corresponde aos filtros.</p>'; return; }
        const cols = Object.keys(data.rows[0]);
        target.innerHTML = `<p class="mb-2 text-sm font-semibold text-slate-700">${data.rows.length} registro(s)</p><table class="w-full bg-white text-left text-xs"><thead><tr>${cols.map(c => `<th class="border-b p-2">${Utils.escapeHtml(c)}</th>`).join('')}</tr></thead><tbody>${data.rows.slice(0, 50).map(row => `<tr>${cols.map(c => `<td class="border-b p-2">${Utils.escapeHtml(row[c] ?? '')}</td>`).join('')}</tr>`).join('')}</tbody></table>${data.rows.length > 50 ? '<p class="p-2 text-xs text-slate-500">Exibindo os primeiros 50 registros.</p>' : ''}`;
      },
      exportReport(format) {
        const code = document.getElementById('rep-type')?.value || 'R14';
        const mod = document.getElementById('rep-modulo')?.value || 'TODOS';
        const params = { sgd: document.getElementById('rep-sgd')?.value || '', funcId: document.getElementById('rep-func')?.value || '', start: document.getElementById('rep-start')?.value || '', end: document.getElementById('rep-end')?.value || '' };
        const data = this.buildReportDataset(code, mod, params);

        if (format === 'XLSX' || format === 'CSV') {
          const rowsForSheet = data.rows.length ? data.rows : [{ Aviso: 'Nenhum registro persistido para os filtros selecionados.' }];
          const ws = XLSX.utils.json_to_sheet(rowsForSheet);
          const wb = XLSX.utils.book_new();
          XLSX.utils.book_append_sheet(wb, ws, 'Relatorio_Portal_RH');
          const ext = format.toLowerCase();
          XLSX.writeFile(wb, `PortalRH_${code}_${Date.now()}.${ext}`);
          this.showToast(`Arquivo ${format} gerado e baixado com sucesso!`);
          return;
        }

        const htmlContent = this.buildPrintableReportHtml(data);

        if (format === 'HTML') {
          const blob = new Blob([htmlContent], { type: 'text/html;charset=utf-8' });
          const a = document.createElement('a');
          a.href = URL.createObjectURL(blob);
          a.download = `PortalRH_${code}_${Date.now()}.html`;
          a.click();
          this.showToast('Relatório HTML exportado para visualização e impressão!');
          return;
        }

        if (format === 'DOCX') {
          const wordDoc = `
            <html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'>
            <head><meta charset='utf-8'><title>${Utils.escapeHtml(data.title)}</title></head>
            <body>${htmlContent}</body></html>
          `;
          const blob = new Blob(['\ufeff', wordDoc], { type: 'application/msword' });
          const a = document.createElement('a');
          a.href = URL.createObjectURL(blob);
          a.download = `PortalRH_${code}_${Date.now()}.doc`;
          a.click();
          this.showToast('Documento DOCX (.doc compatível com Word) exportado!');
          return;
        }

        if (format === 'PDF') {
          const staging = document.getElementById('print-export-staging');
          staging.innerHTML = htmlContent;
          staging.classList.remove('hidden');
          html2pdf().set({
            margin: 10,
            filename: `PortalRH_${code}_${Date.now()}.pdf`,
            image: { type: 'jpeg', quality: 0.98 },
            html2canvas: { scale: 2 },
            jsPDF: { unit: 'mm', format: 'a4', orientation: 'landscape' }
          }).from(staging).save().then(() => {
            staging.classList.add('hidden');
            this.showToast('Relatório PDF com layout corporativo gerado!');
          });
        }
      },

      async refreshDevPlanningQueue(silent = false) {
        const auth = this.getAzureAuthHeader();
        if (!auth) { if (!silent) this.showToast('Entre no Azure para consultar o backlog do PO.', 'warning'); return false; }
        if (this.devPlanningLoading) return false;
        if (silent && Date.now() - (this.lastDevPlanningRefreshAt || 0) < 60000) return false;
        this.lastDevPlanningRefreshAt = Date.now();
        this.devPlanningLoading = true;
        const sessionVersion = this.devPlanningSessionVersion || 0;
        const org = 'https://dev.azure.com/cagecedev';
        const headers = { Authorization: auth, Accept: 'application/json;api-version=7.0' };
        try {
          try { this.devPlanningIdentity = JSON.parse(sessionStorage.getItem('azure_current_user') || 'null'); } catch (_) {}
          try {
            const userRes = await fetch(`${org}/_apis/connectionData?connectOptions=includeInheritedDefinitionsOnly&lastChangeId=-1&api-version=7.0`, { headers });
            if (sessionVersion !== (this.devPlanningSessionVersion || 0)) return false;
            if (userRes.ok) {
              const user = (await userRes.json()).authenticatedUser;
              if (user) {
                this.devPlanningIdentity = { displayName: user.providerDisplayName || user.customDisplayName || user.displayName || '', uniqueName: user.uniqueName || '' };
                sessionStorage.setItem('azure_current_user', JSON.stringify(this.devPlanningIdentity));
              }
            }
          } catch (err) { console.warn('Identidade Azure indisponível; usando a identidade da sessão.', err); }
          try {
            const teamProject = State.azureConfig?.project || 'Administrativo';
            const teamRes = await fetch(`${org}/_apis/projects/${encodeURIComponent(teamProject)}/teams?$top=200&api-version=7.1`, { headers });
            if (teamRes.ok) this.devPlanningTeams = ((await teamRes.json()).value || []).filter(team => !this.normalizeDemoFieldValue(team.name).includes('productbacklog'));
          } catch (err) { console.warn('Times para o filtro Dev indisponíveis.', err); }
          const linked = State.db.demandas.filter(d => !d.excluido && d.azureItemId && ['Aguardando direcionamento do Dev', 'Em atendimento'].includes(d.status));
          const projects = [...new Set(['Administrativo', State.azureConfig?.project, ...linked.map(d => d.azureProject)].filter(Boolean))];
          const ids = new Set(linked.map(d => Number(d.azureItemId)).filter(Number.isFinite));
          for (const project of projects) {
            const areas = [...new Set(linked.filter(d => d.azureProject === project && d.status === 'Aguardando direcionamento do Dev').map(d => d.azurePoAreaPath || d.azureAreaPath).filter(Boolean))];
            if (!areas.length) areas.push(`${project}\\Portal RH - Product Backlog`);
            for (const area of areas) {
              const safeProject = project.replace(/'/g, "''");
              const safeArea = area.replace(/'/g, "''");
              const query = `SELECT [System.Id] FROM WorkItems WHERE [System.TeamProject] = '${safeProject}' AND [System.WorkItemType] = 'PBI PO' AND [System.AreaPath] UNDER '${safeArea}' ORDER BY [System.ChangedDate] DESC`;
              const res = await fetch(`${org}/${encodeURIComponent(project)}/_apis/wit/wiql?api-version=7.0`, { method: 'POST', headers: { ...headers, 'Content-Type': 'application/json' }, body: JSON.stringify({ query }) });
              if (!res.ok) { console.warn(`Backlog ${area} indisponível (HTTP ${res.status}).`); continue; }
              (await res.json()).workItems?.forEach(item => ids.add(item.id));
            }
          }
          const allItems = [];
          const idList = [...ids];
          for (let i = 0; i < idList.length; i += 100) {
            const res = await fetch(`${org}/_apis/wit/workitems?ids=${idList.slice(i, i + 100).join(',')}&api-version=7.0`, { headers });
            if (!res.ok) throw new Error(`Não foi possível carregar os Work Items (HTTP ${res.status}).`);
            allItems.push(...((await res.json()).value || []));
          }
          if (sessionVersion !== (this.devPlanningSessionVersion || 0)) return false;
          this.devPlanningItems = allItems.filter(item => {
            const local = linked.find(d => String(d.azureItemId) === String(item.id));
            return local || (item.fields?.['System.WorkItemType'] === 'PBI PO' && item.fields?.['Custom.SGD']);
          }).sort((a, b) => Number(b.id) - Number(a.id));
          if (State.currentView === 'planejamento-dev') this.renderCurrentView();
          if (!silent) this.showToast(`${this.devPlanningItems.length} Work Item(s) carregado(s) do Azure.`, 'success');
          return true;
        } catch (err) {
          this.showToast(`Falha ao carregar a fila do Dev: ${err.message}`, 'error');
          return false;
        } finally {
          this.devPlanningLoading = false;
          if (State.currentView === 'planejamento-dev') this.renderCurrentView();
        }
      },

      async loadDevFilterMembers(team) {
        const filters = this.captureDevPlanningFilters();
        filters.team = team;
        filters.owner = '';
        this.devPlanningMembers = [];
        this.devPlanningTeamAreas = [];
        if (!team) { this.renderCurrentView(); return; }
        const project = State.azureConfig?.project || 'Administrativo';
        const auth = this.getAzureAuthHeader();
        if (!auth) return;
        try {
          const base = `https://dev.azure.com/cagecedev/_apis/projects/${encodeURIComponent(project)}/teams/${encodeURIComponent(team)}`;
          const areaUrl = `https://dev.azure.com/cagecedev/${encodeURIComponent(project)}/${encodeURIComponent(team)}/_apis/work/teamsettings/teamfieldvalues?api-version=7.0`;
          const [membersRes, areasRes] = await Promise.all([
            fetch(`${base}/members?$top=200&api-version=7.1`, { headers: { Authorization: auth, Accept: 'application/json' } }),
            fetch(areaUrl, { headers: { Authorization: auth, Accept: 'application/json' } })
          ]);
          if (!membersRes.ok) throw new Error(`Membros do time: HTTP ${membersRes.status}`);

          this.devPlanningMembers = members;
          this.devPlanningTeamAreas = areas;
          this.renderCurrentView();

      async searchDevPlanning() {
        const filters = this.captureDevPlanningFilters();
        const hasOwner = !!filters.owner && filters.owner !== '__unassigned__';
        const hasTitle = !!filters.title?.trim();
        const hasId = /^\d+$/.test(filters.id?.trim() || '');
        if (!hasOwner && !hasTitle && !hasId) { this.renderCurrentView(); return; }
        const auth = this.getAzureAuthHeader();
        if (!auth) { this.showToast('Entre no Azure para consultar as demandas do desenvolvedor.', 'warning'); return; }
        const projects = [...new Set(['Administrativo', State.azureConfig?.project].filter(Boolean))];
        const collected = [];
        try {
          if (hasId) {
            const idRes = await fetch(`https://dev.azure.com/cagecedev/_apis/wit/workitems/${encodeURIComponent(filters.id.trim())}?api-version=7.0`, { headers: { Authorization: auth, Accept: 'application/json' } });
            if (idRes.ok) collected.push(await idRes.json());
          }
          for (const project of projects) {
            if (!hasOwner && !hasTitle) continue;
            const safeProject = project.replace(/'/g, "''");
            const safeOwner = hasOwner ? filters.owner.replace(/'/g, "''") : '';
            const safeTitle = hasTitle ? filters.title.trim().replace(/'/g, "''") : '';
            const query = `SELECT [System.Id] FROM WorkItems WHERE [System.TeamProject] = '${safeProject}'${safeOwner ? ` AND [System.AssignedTo] = '${safeOwner}'` : ''}${safeTitle ? ` AND [System.Title] CONTAINS '${safeTitle}'` : ''} AND [System.WorkItemType] IN ('PBI PO', 'Product Backlog Item') ORDER BY [System.ChangedDate] DESC`;
            const org = 'https://dev.azure.com/cagecedev';
            const res = await fetch(`${org}/${encodeURIComponent(project)}/_apis/wit/wiql?api-version=7.0`, { method: 'POST', headers: { Authorization: auth, 'Content-Type': 'application/json' }, body: JSON.stringify({ query }) });
            if (!res.ok) throw new Error(`Consulta do responsável: HTTP ${res.status}`);
            const ids = ((await res.json()).workItems || []).map(entry => entry.id);
            for (let i = 0; i < ids.length; i += 100) {
              const cardsRes = await fetch(`${org}/_apis/wit/workitems?ids=${ids.slice(i, i + 100).join(',')}&api-version=7.0`, { headers: { Authorization: auth, Accept: 'application/json' } });
              if (!cardsRes.ok) throw new Error(`Cards do responsável: HTTP ${cardsRes.status}`);
              collected.push(...((await cardsRes.json()).value || []));
            }
          }
          const byId = new Map((this.devPlanningItems || []).map(item => [String(item.id), item]));
          collected.filter(item => item.fields?.['Custom.SGD'] && (this.normalizeDemoFieldValue(item.fields?.['Custom.Sistema']).startsWith('portalrh') || State.db.demandas.some(d => String(d.azureItemId) === String(item.id)))).forEach(item => byId.set(String(item.id), item));
          this.devPlanningItems = [...byId.values()];
          this.renderCurrentView();
        } catch (err) { this.showToast(`Não foi possível buscar as demandas do dev: ${err.message}`, 'error'); }
      },

      calculateEdsEstimate(values) {
        const { c, d, r, v } = values;
        if (![c, d, r, v].every(value => Number.isInteger(value) && value >= 1 && value <= 4)) return null;
        const score = 2 * c + 2 * d + 2 * r + v;
        const bands = [
          [8, 1, 2, 'Muito Simples'], [11, 2, 4, 'Simples'], [14, 3, 6, 'Pequeno / Médio'],
          [18, 5, 10, 'Médio'], [22, 8, 18, 'Médio / Grande'], [25, 13, 32, 'Grande'], [28, 21, 48, 'Muito Grande']
        ];
        const band = bands.find(([limit]) => score <= limit) || bands[bands.length - 1];
        return { c, d, r, v, score, effort: band[1], hours: band[2], classification: band[3] };
      },

        if (nextStep < 1 || nextStep > 3) return;
        if (nextStep > 1 && this.devPlanningStep === 1) {
          const team = document.getElementById('dev-plan-team')?.value;
          const area = document.getElementById('dev-plan-area');

            this.showToast('Escolha o time, a área, a sprint e o desenvolvedor responsável antes de avançar.', 'warning');

          this.showToast('Selecione as quatro notas da avaliação de esforço.', 'warning');

        }
