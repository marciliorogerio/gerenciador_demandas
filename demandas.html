        this.openModal('Acesso ao Azure DevOps', body, footer);
      },

      async submitAzureLogin() {
        const input = document.getElementById('azure-login-pat');
        const token = input?.value.trim() || '';
        if (!token) { this.showToast('Informe o PAT para entrar no Azure.', 'warning'); return; }
        const success = await this.loginAzurePat(token);
        if (success) {
          input.value = '';
          this.closeModal();
        }
      },

      async loginAzurePat(token) {
        const clean = String(token || '').trim();
        if (!clean) return false;
        const authHeader = `Basic ${btoa(':' + clean)}`;
        try {
          const res = await fetch('https://dev.azure.com/cagecedev/_apis/projects?$top=100&api-version=7.1', { headers: { Authorization: authHeader, Accept: 'application/json' } });
          if (!res.ok) throw new Error(`Azure respondeu HTTP ${res.status}`);
          const projects = ((await res.json()).value || []).map(item => item.name).filter(Boolean);
          if (!projects.length) throw new Error('Nenhum projeto acessível com este PAT.');
          sessionStorage.setItem('azure_pat', clean);
          State.azureConfig.cachedProjects = projects;
          if (!projects.includes(State.azureConfig.project)) State.azureConfig.project = projects[0];
          this.updateAzureSessionUi();
          this.persistLocalState();
          const fieldsLoaded = await this.loadRequesterAzureFields(State.azureConfig.project);
          this.loadAzureProjectsAndTeamsForPo();
          if (State.currentView === 'planejamento-dev') { this.lastDevPlanningRefreshAt = 0; this.refreshDevPlanningQueue(true); }
          if (fieldsLoaded) this.showToast('Azure conectado. As listas do solicitante foram consultadas.', 'success');
          else this.showToast('Azure conectado, mas as listas do Work Item não foram carregadas. Confira o projeto e o tipo PBI PO.', 'warning');
          return true;
        } catch (err) {
          const message = `Não foi possível entrar no Azure: ${err.message}`;
          const errorEl = document.getElementById('azure-login-error');
          if (errorEl) { errorEl.textContent = message; errorEl.classList.remove('hidden'); }
          this.showToast(message, 'error');
          return false;
        }
      },

      logoutAzure() {
        sessionStorage.removeItem('azure_pat');
        sessionStorage.removeItem('azure_current_user');
        this.devPlanningItems = [];
        this.devPlanningIdentity = null;
        this.devPlanningItem = null;
        this.devPlanningSessionVersion = (this.devPlanningSessionVersion || 0) + 1;
        this.updateAzureSessionUi();
        if (State.currentView === 'planejamento-dev') this.renderCurrentView();
        this.showToast('Sessão do Azure encerrada.', 'info');
      },

      async loadAzureProjectsAndTeamsForPo(targetProject = null, targetTeam = null, force = false) {
        const authHeader = this.getAzureAuthHeader();
        const projSelect = document.getElementById('dem-azure-project');
        const teamSelect = document.getElementById('dem-azure-team');
        const projLoading = document.getElementById('po-azure-proj-loading');

        const currentProj = targetProject || (projSelect ? projSelect.value : null) || State.azureConfig?.project || sessionStorage.getItem('azure_project') || 'Administrativo';
        const currentTeam = targetTeam || (teamSelect ? teamSelect.value : null) || State.azureConfig?.team || sessionStorage.getItem('azure_team_name') || 'Sustentação Administrativo';

        if (!authHeader) {
          if (force) {
            this.showToast('Configure seu Token PAT do PO para carregar os projetos do Azure.', 'warning');
            this.promptConfigurePat();
          }
          return;
        }

        try {
          if (projLoading) projLoading.classList.remove('hidden');
          const orgUrl = 'https://dev.azure.com/cagecedev';
          const endpoints = [`${orgUrl}/_apis/projects?$top=100&api-version=7.0`];

          let res = null;
          let networkError = null;
          for (const url of endpoints) {
            try {
              const r = await fetch(url, {
                headers: {
                  'Authorization': authHeader,
                  'Accept': 'application/json;api-version=7.0',
                  'Content-Type': 'application/json'
                }
              });
              res = r;
              break;
            } catch (err) { networkError = err; }
          }

          if (res && res.ok) {
            const data = await res.json();
            const projects = (data.value || []).map(p => p.name).sort((a, b) => a.localeCompare(b, 'pt-BR'));
            if (projects.length > 0) {
              State.azureConfig.cachedProjects = projects;
              try { localStorage.setItem('azure_projects_cache', JSON.stringify(projects)); } catch(_) {}
              if (projSelect) {
                const activeProj = projects.includes(currentProj) ? currentProj : projects[0];
                projSelect.innerHTML = projects.map(p =>
                  `<option value="${Utils.escapeHtml(p)}" ${p === activeProj ? 'selected' : ''}>${Utils.escapeHtml(p)}</option>`
                ).join('');
              }
              if (force) {
                this.showToast(`Azure DevOps: ${projects.length} projeto(s) carregados com sucesso!`, 'success');
              }
            }
          } else if (res && (res.status === 401 || res.status === 403)) {
            console.warn('[Azure PO] Token PAT não autorizado pelo Azure:', res.status);
            if (force) {
              this.showToast(`Token PAT recusado pelo Azure (HTTP ${res.status}). Clique em Configurar PAT para atualizar.`, 'error');
              this.promptConfigurePat();
            }
          } else if (res) {
            const detail = (await res.text().catch(() => '')).slice(0, 180);
            console.warn('[Azure PO] Azure respondeu com erro:', res.status, detail);
            if (force) this.showToast(`Azure respondeu HTTP ${res.status} ao listar projetos. ${detail || 'Verifique o acesso à organização e as permissões do PAT.'}`, 'error');
          } else {
            console.warn('[Azure PO] Falha de rede/CORS ao consultar projetos:', networkError);
            if (force) this.showToast(`O navegador não conseguiu acessar o Azure (${networkError?.message || 'erro de rede/CORS'}). Confira a conexão e tente Testar conexão.`, 'error');
          }
        } catch (err) {
          console.warn('[Azure PO] Falha ao listar projetos:', err);
          if (force) this.showToast('Erro de rede ou bloqueio ao acessar projetos do Azure DevOps.', 'error');
        } finally {
          if (projLoading) projLoading.classList.add('hidden');
        }

        const activeProj = projSelect ? projSelect.value : currentProj;
        await this.handleAzureProjectChange(currentTeam, activeProj);
      },

      async handleAzureProjectChange(targetTeam = null, explicitProj = null) {
        const authHeader = this.getAzureAuthHeader();
        const projSelect = document.getElementById('dem-azure-project');
        const teamSelect = document.getElementById('dem-azure-team');
        const teamsLoading = document.getElementById('po-azure-teams-loading');
        if (!teamSelect) return;

        const selectedProj = explicitProj || (projSelect ? projSelect.value : null) || State.azureConfig?.project || 'Administrativo';
        const currentTeam = targetTeam || teamSelect.value || State.azureConfig?.team || 'Sustentação Administrativo';

        // Pre-popula imediatamente com o fallback para resposta instantanea
        const defaultTeamsByProject = {
          'Administrativo': ['Sustentação Administrativo', 'Devs Sustentação Administrativo', 'Administrativo Team'],
          'Comercial': ['Sustentação Comercial', 'Devs Comercial', 'Comercial Team'],
          'Operacional': ['Sustentação Operacional', 'Devs Operacional', 'Operacional Team']
        };
        const fallbackTeams = defaultTeamsByProject[selectedProj] || ['Sustentação ' + selectedProj, selectedProj + ' Team'];
        const chosenInitial = fallbackTeams.includes(currentTeam) ? currentTeam : fallbackTeams[0];
        teamSelect.innerHTML = fallbackTeams.map(t =>
          `<option value="${Utils.escapeHtml(t)}" ${t === chosenInitial ? 'selected' : ''}>${Utils.escapeHtml(t)}</option>`
        ).join('');

        if (!authHeader) return;

        try {
          if (teamsLoading) teamsLoading.classList.remove('hidden');
          const orgUrl = 'https://dev.azure.com/cagecedev';
          await this.loadAzureWorkItemTypesForPo(selectedProj, document.getElementById('dem-azure-work-item-type')?.value || '');
          const endpoints = [`${orgUrl}/_apis/projects/${encodeURIComponent(selectedProj)}/teams?$top=200&api-version=7.0`];

          let res = null;
          for (const url of endpoints) {
            try {
              const r = await fetch(url, {
                headers: {
                  'Authorization': authHeader,
                  'Accept': 'application/json;api-version=7.0',
                  'Content-Type': 'application/json'
                }
              });
              if (r.ok) {
                res = r;
                break;
              }
            } catch (_) {}
          }

          if (res && res.ok) {
            const data = await res.json();
            const teams = (data.value || []).map(t => t.name).sort((a, b) => a.localeCompare(b, 'pt-BR'));
            if (teams.length > 0) {
              if (!State.azureConfig.cachedTeams) State.azureConfig.cachedTeams = {};
              State.azureConfig.cachedTeams[selectedProj] = teams;
              try { localStorage.setItem('azure_teams_cache', JSON.stringify(State.azureConfig.cachedTeams)); } catch(_) {}

              const chosenTeam = teams.includes(currentTeam) ? currentTeam : teams[0];
              teamSelect.innerHTML = teams.map(t =>
                `<option value="${Utils.escapeHtml(t)}" ${t === chosenTeam ? 'selected' : ''}>${Utils.escapeHtml(t)}</option>`
              ).join('');
            }
          }
        } catch (err) {
          console.warn('[Azure PO] Falha ao listar times:', err);
        } finally {
          if (teamsLoading) teamsLoading.classList.add('hidden');
        }
        await this.loadAzureAreaPathsForPo();
      },

      async loadAzureWorkItemTypesForPo(project, preferredType = '') {
        const select = document.getElementById('dem-azure-work-item-type');
        const authHeader = this.getAzureAuthHeader();
        if (!select || !project || !authHeader) return false;
        const orgUrl = 'https://dev.azure.com/cagecedev';
        try {
          const res = await fetch(`${orgUrl}/${encodeURIComponent(project)}/_apis/wit/workitemtypes?api-version=7.0`, {
            headers: { Authorization: authHeader, Accept: 'application/json;api-version=7.0' }
          });
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const data = await res.json();
          const types = (data.value || []).filter(item => item.name && item.isDisabled !== true).map(item => item.name);
          if (!types.length) throw new Error('O projeto não retornou tipos de Work Item disponíveis.');
          const currentDemand = State.db.demandas.find(d => d.id === this.currentEditingDemandaId);
          const selected = currentDemand?.azureItemId ? (preferredType || currentDemand.azureWorkItemType || 'PBI PO') : 'PBI PO';
          if (!types.includes(selected)) throw new Error(`O tipo "${selected}" não está disponível neste projeto.`);
          select.value = selected;
          await this.loadAzurePbiRequiredFieldsForPo(project, selected);
          return true;
        } catch (err) {
          console.warn('[Azure PO] Falha ao carregar tipos de Work Item:', err);
          this.showToast(`Não foi possível carregar os tipos de Work Item do projeto ${project}: ${err.message}`, 'error');
          return false;
        }
      },

      async loadAzurePbiRequiredFieldsForPo(project, workItemType) {
        const authHeader = this.getAzureAuthHeader();
        if (!authHeader || !project || !workItemType) return false;
        const orgUrl = 'https://dev.azure.com/cagecedev';
        const demand = State.db.demandas.find(d => d.id === this.currentEditingDemandaId);
        try {
          const res = await fetch(`${orgUrl}/${encodeURIComponent(project)}/_apis/wit/workitemtypes/${encodeURIComponent(workItemType)}/fields?$expand=all&api-version=7.0`, {
            headers: { Authorization: authHeader, Accept: 'application/json;api-version=7.0' }
          });
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const fields = (await res.json()).value || [];
          const normalizeFieldName = value => this.normalizeDemoFieldValue(value);
          if (!State.azureConfig.cachedCustomFieldOptions) State.azureConfig.cachedCustomFieldOptions = {};
          State.azureConfig.cachedCustomFieldOptions[project] = {
            sistema: (fields.find(field => normalizeFieldName(field.name) === 'sistema')?.allowedValues || []).map(String),
            activityType: (fields.find(field => normalizeFieldName(field.name) === 'tipoatividade')?.allowedValues || []).map(String),
            source: 'azure'
          };
          this.persistLocalState();
          const fillSelect = (id, fieldName, savedValue, fallbackValue = '') => {
            const select = document.getElementById(id);
            if (!select) return;
            const normalize = normalizeFieldName;
            const field = fields.find(item => normalize(item.name) === normalize(fieldName));
            const values = Array.isArray(field?.allowedValues) ? field.allowedValues.map(String) : [];
            if (savedValue && !values.some(value => normalize(value) === normalize(savedValue))) values.push(String(savedValue));
            const currentValue = select.value;
            const candidates = [savedValue, select.dataset.pendingDemoValue, currentValue, field?.defaultValue, fallbackValue].map(value => String(value || '')).filter(Boolean);
            const desired = candidates.map(candidate => values.find(value => normalize(value) === normalize(candidate)) || values.find(value => normalize(value).includes(normalize(candidate)) || normalize(candidate).includes(normalize(value)))).find(Boolean) || (candidates.find(value => !values.length) || '');
            if (!values.length && desired) values.push(desired);
            select.innerHTML = `<option value="">Selecione ${Utils.escapeHtml(fieldName)}...</option>` + values.map(value => `<option value="${Utils.escapeHtml(value)}" ${value === desired ? 'selected' : ''}>${Utils.escapeHtml(value)}</option>`).join('');
            if (desired) delete select.dataset.pendingDemoValue;
          };
          const moduleName = demand ? this.getModuleName(demand.moduloId) : '';
          fillSelect('dem-azure-system', 'Sistema', demand?.azureSystem, moduleName);
          fillSelect('dem-azure-activity-type', 'Tipo Atividade', demand?.azureActivityType, demand?.tipo);
          return true;
        } catch (err) {
          console.warn('[Azure PO] Falha ao carregar campos obrigatórios do tipo:', err);
          this.showToast(`Não foi possível carregar Sistema e Tipo Atividade para ${workItemType}: ${err.message}`, 'error');
          return false;
        }
      },

      async loadAzureAreaPathsForPo(preserveCurrent = false) {
        const project = document.getElementById('dem-azure-project')?.value;
        const team = document.getElementById('dem-azure-team')?.value;
        const select = document.getElementById('dem-azure-area-path');
        const authHeader = this.getAzureAuthHeader();
        if (!select || !project || !team || !authHeader) return false;
        const requestId = (select._azureAreaRequestId || 0) + 1;
        select._azureAreaRequestId = requestId;
        const previousArea = select.value;
        const previouslyLoadedTeam = select.dataset.azureTeam || '';
        const orgUrl = 'https://dev.azure.com/cagecedev';
        const demand = State.db.demandas.find(d => d.id === this.currentEditingDemandaId);
        try {
          const url = `${orgUrl}/${encodeURIComponent(project)}/${encodeURIComponent(team)}/_apis/work/teamsettings/teamfieldvalues?api-version=7.0`;
          const res = await fetch(url, { headers: { Authorization: authHeader, Accept: 'application/json;api-version=7.0' } });
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const data = await res.json();
          if (requestId !== select._azureAreaRequestId) return false;
          const areaValues = (data.values || []).map(item => item.value).filter(Boolean);
          const defaultArea = data.defaultValue || areaValues[0] || project;
          if (!areaValues.includes(defaultArea)) areaValues.unshift(defaultArea);
          const savedArea = demand?.azureTeam === team && areaValues.includes(demand?.azureAreaPath) ? demand.azureAreaPath : '';
          const keepCurrent = preserveCurrent && previouslyLoadedTeam === team && areaValues.includes(previousArea);
          const chosenArea = keepCurrent ? previousArea : (savedArea || defaultArea);
          select.innerHTML = areaValues.map(value => `<option value="${Utils.escapeHtml(value)}" ${value === chosenArea ? 'selected' : ''}>${Utils.escapeHtml(value)}${value === defaultArea ? ' (padrão da equipe)' : ''}</option>`).join('');
          select.dataset.azureTeam = team;
          select.dataset.azureProject = project;
          return true;
        } catch (err) {
          if (requestId !== select._azureAreaRequestId) return false;
          console.warn('[Azure PO] Falha ao carregar áreas da equipe:', err);
          const fallbackArea = demand?.azureTeam === team ? (demand.azureAreaPath || project) : project;
          select.innerHTML = `<option value="${Utils.escapeHtml(fallbackArea)}">${Utils.escapeHtml(fallbackArea)}</option>`;
          select.dataset.azureTeam = '';
          this.showToast(`Não foi possível carregar as áreas da equipe ${team}: ${err.message}. Será usada a área ${fallbackArea}.`, 'warning');
          return false;
        }
      },

      async checkExistingSgdInAzureForPo() {
        const rawSgd = document.getElementById('dem-sgd')?.value || '';
        const cleanSgd = String(rawSgd).trim().replace(/\D/g, '');
        if (!cleanSgd) {
          this.showToast('Informe primeiro o número do SGD na aba do Solicitante.', 'warning');
          return;
        }
        if (!this.getAzureAuthHeader()) {
          this.showToast('Configure o Token PAT do PO para consultar o Azure DevOps.', 'warning');
          this.promptConfigurePat();
          return;
        }
        const pTag = document.getElementById('dem-azure-badge-text');
        if (pTag) pTag.innerHTML = `<span class="text-blue-600 font-semibold">Consultando SGD #${Utils.escapeHtml(cleanSgd)} no Azure DevOps...</span>`;
        const match = await this.lookupSgdInAzureProduction(cleanSgd);
        if (match && match.azureItemId) {
          this.applySgdMetadataToModal(match);
          if (pTag) pTag.innerHTML = `✓ Localizado no Azure DevOps: Work Item <strong>#${Utils.escapeHtml(match.azureItemId)}</strong> (${Utils.escapeHtml(match.azureState || 'New')})`;
          this.showToast(`SGD #${cleanSgd} já possui o Work Item #${match.azureItemId} no Azure Boards! Campos vinculados.`, 'success');
        } else if (this.lastSgdAuthError) {
          if (pTag) pTag.innerHTML = `<span class="text-rose-600 font-semibold">Token PAT recusado pelo Azure DevOps. Use "Entrar no Azure" na barra superior.</span>`;
          this.showToast('Token PAT expirado ou inválido no Azure DevOps.', 'error');
        } else {
          if (pTag) pTag.innerHTML = `Nenhum Work Item existente para o SGD #${Utils.escapeHtml(cleanSgd)}. Clique em <strong>Enviar ao Azure Boards</strong> para criá-lo.`;
          this.showToast(`Nenhum card encontrado no Azure para o SGD #${cleanSgd}. Pronto para criar novo Work Item!`, 'info');
        }
      },

      async lookupSgdInAzureProduction(cleanSgd) {
        const sgdRegex = new RegExp(`\\b${cleanSgd}\\b`, 'i');
        const authHeader = this.getAzureAuthHeader();
        if (!authHeader) return null;

        const orgUrl = 'https://dev.azure.com/cagecedev';
        const project = State.azureConfig?.project || sessionStorage.getItem('azure_project') || 'Administrativo';
        const headers = {
          'Authorization': authHeader,
          'Accept': 'application/json;api-version=7.0',
          'Content-Type': 'application/json'
        };

        const wiqlUrls = [];
        if (project) {
          wiqlUrls.push(`${orgUrl}/${encodeURIComponent(project)}/_apis/wit/wiql?api-version=7.0`);
        }
        wiqlUrls.push(`${orgUrl}/_apis/wit/wiql?api-version=7.0`);

        const queries = [
          `SELECT [System.Id] FROM WorkItems WHERE ([Custom.SGD] = '${cleanSgd}' OR [System.Title] CONTAINS '${cleanSgd}') AND [System.WorkItemType] <> 'Feature' ORDER BY [System.Id] DESC`,
          `SELECT [System.Id] FROM WorkItems WHERE [System.Title] CONTAINS '${cleanSgd}' AND [System.WorkItemType] <> 'Feature' ORDER BY [System.Id] DESC`
        ];

        this.lastAzureDiagStatus = 'Sem resposta';

        for (const wiqlUrl of wiqlUrls) {
          for (const queryStr of queries) {
            try {
              const wiqlRes = await fetch(wiqlUrl, {
                method: 'POST',
                headers,
                body: JSON.stringify({ query: queryStr })
              });
              if (wiqlRes.status === 401 || wiqlRes.status === 403 || wiqlRes.status === 203) {
                this.lastSgdAuthError = true;
                this.lastAzureDiagStatus = `Token PAT recusado pelo Azure (HTTP ${wiqlRes.status})`;
                return null;
              }
              if (!wiqlRes.ok) {
                this.lastAzureDiagStatus = `HTTP ${wiqlRes.status}`;
                continue;
              }
              this.lastSgdAuthError = false;

              const wiqlData = await wiqlRes.json().catch(() => null);
              const workItems = (wiqlData && Array.isArray(wiqlData.workItems)) ? wiqlData.workItems : [];
              this.lastAzureDiagStatus = `Conectado (${workItems.length} card(s) com #${cleanSgd} no Azure)`;
              if (workItems.length === 0) break;

              const topIds = workItems.slice(0, 5).map(w => w.id).join(',');
              const detailsRes = await fetch(`${orgUrl}/_apis/wit/workitems?ids=${topIds}&$expand=all&api-version=7.0`, { headers });
              if (!detailsRes.ok) break;

              const detailsData = await detailsRes.json().catch(() => null);
              const items = (detailsData && Array.isArray(detailsData.value)) ? detailsData.value : [];

              for (const item of items) {
                const f = item.fields || {};
                const cardSgd = String(f['Custom.SGD'] || f['Custom.650c7366-6375-4649-a10d-6b8fb4f9b760'] || '').trim().replace(/\D/g, '');
                const cardTitle = String(f['System.Title'] || '');
                if (cardSgd === cleanSgd || cardTitle.includes(cleanSgd) || sgdRegex.test(cardTitle) || items.length === 1) {
                  const cleanTitle = this.extractCleanSgdDescription(cleanSgd, cardTitle) || this.extractCleanSgdDescription(cleanSgd, f['System.Description']) || cardTitle;
                  const cleanBody = this.extractCleanSgdDescription(cleanSgd, f['System.Description']) || cleanTitle;
                  if (cleanTitle) {
                    const assignedObj = f['System.AssignedTo'];
                    const assignedName = assignedObj ? (assignedObj.displayName || assignedObj.uniqueName || '') : '';
                    return {
                      title: cleanTitle,
                      fullDescription: cleanBody || cleanTitle,
                      sistema: f['Custom.Sistema'] || f['Custom.c80be82d-fb36-46d4-88ac-f2ca8f17761c'] || '',
                      moduloNome: f['Custom.Modulo'] || f['Custom.abfd3f8f-a516-435f-b405-e40c10be3e11'] || '',
                      tipo: f['Custom.TipoAtividade'] || f['Custom.5082a91a-9559-4a5d-a316-053e1de2eb53'] || f['System.WorkItemType'] || '',
                      azureItemId: String(item.id),
                      azureState: f['System.State'] || 'New',
                      responsavel: assignedName,
                      source: `Azure #${item.id}`
                    };
                  }
                }
              }
              break;
            } catch (err) {
              this.lastAzureDiagStatus = 'Erro de rede/CORS no Azure';
            }
          }
        }

        return null;
      },

      normalizeDemoFieldValue(value) {
        return String(value || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[^a-z0-9]/g, '');
      },

      resolveDemoSelectValue(select, desiredValue) {
        if (!select || !desiredValue) return '';
        const desired = this.normalizeDemoFieldValue(desiredValue);
        const options = Array.from(select.options || []).filter(option => option.value);
        const exact = options.find(option => this.normalizeDemoFieldValue(option.value) === desired);
        if (exact) return exact.value;
        const compatible = options.find(option => {
          const optionValue = this.normalizeDemoFieldValue(option.value);
          return optionValue.includes(desired) || desired.includes(optionValue);
        });
        return compatible?.value || '';
      },

      applyDemoAzureFields(meta = {}) {
        const systemSelect = document.getElementById('dem-azure-system');
        const activitySelect = document.getElementById('dem-azure-activity-type');
        if (meta.sistema && systemSelect) {
          const resolved = this.resolveDemoSelectValue(systemSelect, meta.sistema);
          if (resolved) systemSelect.value = resolved;
          else systemSelect.dataset.pendingDemoValue = meta.sistema;
        }
        const requestedActivity = meta.tipoAtividade || '';
        if (requestedActivity && activitySelect) {
          const resolved = this.resolveDemoSelectValue(activitySelect, requestedActivity);
          if (resolved) activitySelect.value = resolved;
          else activitySelect.dataset.pendingDemoValue = requestedActivity;
          this.setDemandTypeFromActivity(requestedActivity, meta.tipo);
        }
      },

      setDemandTypeFromActivity(activity, fallbackType = '') {
        const typeSelect = document.getElementById('dem-tipo');
        if (!typeSelect) return;
        const value = this.normalizeDemoFieldValue(activity || fallbackType);
        let mappedType = fallbackType && Array.from(typeSelect.options).some(option => option.value === fallbackType) ? fallbackType : '';
        if (!mappedType && value.includes('novafunc')) mappedType = 'Nova funcionalidade';
        else if (!mappedType && value.includes('incidente')) mappedType = 'Incidente';
        else if (!mappedType && (value.includes('correc') || value.includes('bug') || value.includes('defeito'))) mappedType = 'Correção';
        else if (!mappedType && (value.includes('melhoria') || value.includes('alteracao'))) mappedType = 'Melhoria';
        else if (!mappedType && (value.includes('duvida') || value.includes('suporte'))) mappedType = 'Dúvida';
        else if (!mappedType && (value.includes('normat') || value.includes('legisla'))) mappedType = 'Atualização normativa';
        else if (!mappedType && value.includes('regra')) mappedType = 'Ajuste de regra de negócio';
        typeSelect.value = mappedType || 'Outro';
        this.handleDemandFormChange();
      },

      handleActivityTypeChange() {
        const activity = document.getElementById('dem-azure-activity-type')?.value || '';
        this.setDemandTypeFromActivity(activity);
      },

      openDemandAttachmentDb() {
        return new Promise((resolve, reject) => {
          const request = indexedDB.open('portal-rh-demand-attachments', 1);
          request.onupgradeneeded = () => request.result.createObjectStore('files');
          request.onsuccess = () => resolve(request.result);
          request.onerror = () => reject(request.error);
        });
      },

      async demandAttachmentBlob(docId, file) {
        const db = await this.openDemandAttachmentDb();
        return new Promise((resolve, reject) => {
          const tx = db.transaction('files', file ? 'readwrite' : 'readonly');
          const request = file ? tx.objectStore('files').put(file, docId) : tx.objectStore('files').get(docId);
          request.onsuccess = () => resolve(file || request.result);
          request.onerror = () => reject(request.error);
          tx.oncomplete = () => db.close();
        });
      },

      handleDemandFilesSelected(input) {
        const allowed = ['pdf', 'docx', 'xlsx', 'csv', 'txt', 'png', 'jpg', 'jpeg', 'webp'];
        this.pendingDemandFiles ||= [];
        for (const file of input.files || []) {
          const ext = file.name.split('.').pop().toLowerCase();
          if (!allowed.includes(ext) || file.size > 15 * 1024 * 1024) {
            this.showToast(`Arquivo ${file.name}: extensão não permitida ou tamanho acima de 15 MB.`, 'error');
            continue;
          }
          if (!this.pendingDemandFiles.some(item => item.name === file.name && item.size === file.size)) this.pendingDemandFiles.push(file);
        }
        input.value = '';
        this.renderDemandAttachmentLists(this.currentEditingDemandaId);
      },

      renderDemandAttachmentLists(demandaId) {
        const saved = (State.db.documentos || []).filter(doc => doc.entidadeTipo === 'DEMANDA' && doc.entidadeId === demandaId && doc.situacao !== 'Removido');
        const pending = this.pendingDemandFiles || [];
        const lines = [
          ...saved.map(doc => `${Utils.escapeHtml(doc.nomeOriginal)} — ${doc.azureAttachmentStatus === 'Enviado' ? 'no Azure' : 'aguardando envio ao Azure'}`),
          ...pending.map(file => `${Utils.escapeHtml(file.name)} — será anexado ao salvar`)
        ];
        document.querySelectorAll('.dem-attachment-list').forEach(list => { list.innerHTML = lines.length ? lines.map(line => `<div>• ${line}</div>`).join('') : 'Nenhum anexo.'; });
      },

      async savePendingDemandFiles(demand) {
        for (const file of this.pendingDemandFiles || []) {
          const duplicate = State.db.documentos.some(doc => doc.entidadeTipo === 'DEMANDA' && doc.entidadeId === demand.id && doc.nomeOriginal === file.name && doc.tamanhoBytes === file.size && doc.situacao !== 'Removido');
          if (duplicate) continue;
          const doc = { id: Utils.generateId('DOC'), nomeOriginal: file.name, categoria: 'Anexo da demanda', moduloId: demand.moduloId, mimeType: file.type || 'application/octet-stream', tamanhoBytes: file.size, dataEnvio: Utils.nowBR(), autor: State.currentUser, descricao: '', entidadeTipo: 'DEMANDA', entidadeId: demand.id, driveFileId: '', driveUrl: '', azureAttachmentStatus: 'Pendente', situacao: 'Ativo' };
          await this.demandAttachmentBlob(doc.id, file);
          State.db.documentos.unshift(doc);
          this.logAudit('DOCUMENTO', doc.id, 'Anexo da demanda', `Arquivo "${file.name}" adicionado à demanda ${demand.sgd}.`, doc);
        }
        this.pendingDemandFiles = [];
      },

      async syncDemandAttachmentsToAzure(demand, authHeader) {
        const docs = State.db.documentos.filter(doc => doc.entidadeTipo === 'DEMANDA' && doc.entidadeId === demand.id && doc.situacao !== 'Removido' && doc.azureAttachmentStatus === 'Pendente');
        const failed = [];
        for (const doc of docs) {
          try {
            const blob = await this.demandAttachmentBlob(doc.id);
            if (!blob) throw new Error('arquivo indisponível neste navegador');
            const uploadUrl = `https://dev.azure.com/cagecedev/${encodeURIComponent(demand.azureProject)}/_apis/wit/attachments?fileName=${encodeURIComponent(doc.nomeOriginal)}&api-version=7.1`;
            const upload = await fetch(uploadUrl, { method: 'POST', headers: { Authorization: authHeader, 'Content-Type': 'application/octet-stream' }, body: blob });
            if (!upload.ok) throw new Error(`upload HTTP ${upload.status}`);
            const attachment = await upload.json();
            const relation = [{ op: 'add', path: '/relations/-', value: { rel: 'AttachedFile', url: attachment.url, attributes: { comment: `Anexo da demanda ${demand.sgd}` } } }];
            const update = await fetch(`https://dev.azure.com/cagecedev/${encodeURIComponent(demand.azureProject)}/_apis/wit/workitems/${encodeURIComponent(demand.azureItemId)}?api-version=7.1`, { method: 'PATCH', headers: { Authorization: authHeader, 'Content-Type': 'application/json-patch+json' }, body: JSON.stringify(relation) });
            if (!update.ok) throw new Error(`vínculo HTTP ${update.status}`);
            doc.azureAttachmentStatus = 'Enviado';
            doc.azureAttachmentUrl = attachment.url;
            this.persistLocalState();
          } catch (err) {
            failed.push(`${doc.nomeOriginal}: ${err.message}`);
          }
        }
        return failed;
      },

      applySgdMetadataToModal(meta) {
        if (!meta) return;

        // 1. Preenche Título e Descrição
        const titleEl = document.getElementById('dem-titulo');
        const descEl = document.getElementById('dem-descricao');
        const probEl = document.getElementById('dem-problema');
        const resEspEl = document.getElementById('dem-resultadoEsperado');

        const fullText = String(meta.fullDescription || meta.title || '').trim();
        const summarizedTitle = meta.title ? this.extractSummarizedTitleFromSgdText(meta.title) : this.extractSummarizedTitleFromSgdText(fullText);

        if (titleEl && summarizedTitle) {
          titleEl.value = String(summarizedTitle).slice(0, 255);
        }
        if (descEl && fullText) {
          descEl.value = fullText;
        }
        if (probEl && meta.problema && !probEl.value.trim()) {
          probEl.value = String(meta.problema).trim();
        }
        if (resEspEl && meta.resultadoEsperado && !resEspEl.value.trim()) {
          resEspEl.value = String(meta.resultadoEsperado).trim();
        }
        const impactoEl = document.getElementById('dem-impacto');
        if (impactoEl && meta.impacto && !impactoEl.value.trim()) {
          impactoEl.value = String(meta.impacto).trim();
        }

        // Inferência complementar a partir do texto do SGD caso a API retorne apenas a descrição textual
        const inferred = this.inferModuleAndTypeFromSgdText(`${meta.moduloNome || ''} ${meta.tipo || ''} ${fullText}`);

        // 2. Mapeia Módulo pelo ID, pelo Nome retornado do SGD ou por inferência de domínio do Portal RH
        const modSelect = document.getElementById('dem-modulo');
        if (modSelect) {
          if (meta.moduloId && State.db.modulos.some(m => m.id === meta.moduloId)) {
            modSelect.value = meta.moduloId;
            this.handleDemandFormChange();
          } else if (meta.moduloNome) {
            const rawMod = String(meta.moduloNome).toLowerCase().trim();
            const matchedMod = State.db.modulos.find(m =>
              m.nome.toLowerCase().includes(rawMod) || rawMod.includes(m.nome.toLowerCase())
            );
            if (matchedMod) {
              modSelect.value = matchedMod.id;
              this.handleDemandFormChange();
            } else if (inferred.inferredModuloId) {
              modSelect.value = inferred.inferredModuloId;
              this.handleDemandFormChange();
            }
          } else if (inferred.inferredModuloId) {
            modSelect.value = inferred.inferredModuloId;
            this.handleDemandFormChange();
          }
        }
        // 3. Mapeia Tipo de Demanda pelo retorno do SGD ou por inferência semântica
        const tipoSelect = document.getElementById('dem-tipo');
        if (tipoSelect) {
          const rawTipo = String(meta.tipo || '').toLowerCase().trim();
          let mappedTipo = '';
          if (rawTipo.includes('erro') || rawTipo.includes('bug') || rawTipo.includes('corre')) mappedTipo = 'Correção';
          else if (rawTipo.includes('incidente')) mappedTipo = 'Incidente';
          else if (rawTipo.includes('nova') || rawTipo.includes('novo') || rawTipo.includes('evolu')) mappedTipo = 'Nova funcionalidade';
          else if (rawTipo.includes('altera') || rawTipo.includes('melhoria')) mappedTipo = 'Melhoria';
          else if (rawTipo.includes('duvida') || rawTipo.includes('dúvida') || rawTipo.includes('suporte')) mappedTipo = 'Dúvida';
          else if (rawTipo.includes('normat') || rawTipo.includes('legisla')) mappedTipo = 'Atualização normativa';
          else if (rawTipo.includes('regra')) mappedTipo = 'Ajuste de regra de negócio';
          else if (inferred.inferredTipo) mappedTipo = inferred.inferredTipo;

          if (mappedTipo) {
            const hasOpt = Array.from(tipoSelect.options).some(o => o.value === mappedTipo);
            if (hasOpt) {
              tipoSelect.value = mappedTipo;
              this.handleDemandFormChange();
            }
          }
        }

        this.applyDemoAzureFields(meta);

        // 3.1 Seleciona funcionalidade vinculada se informada
        if (meta.funcionalidadeId) {
          const funcEl = document.getElementById('dem-func');
          if (funcEl && Array.from(funcEl.options).some(o => o.value === meta.funcionalidadeId)) {
            funcEl.value = meta.funcionalidadeId;
          }
        }

        // 4. Preenche metadados do Azure Boards e Responsável Técnico caso acionado na etapa do PO
        const azureIdEl = document.getElementById('dem-azureItemId');
        const azureStateEl = document.getElementById('dem-azureState');
        const respEl = document.getElementById('dem-responsavel');
        if (azureIdEl && meta.azureItemId && !azureIdEl.value.trim()) {
          azureIdEl.value = meta.azureItemId;
        }
        if (azureStateEl && meta.azureState) {
          azureStateEl.value = meta.azureState;
        }
        if (respEl && meta.responsavel && !respEl.value.trim()) {
          respEl.value = meta.responsavel;
        }

        // 5. Notificação de origem exibida no diagnóstico abaixo do campo
      },

      async fetchSgdDataForModal(rawSgd, force = false) {
        const cleanSgd = String(rawSgd || '').trim().replace(/\D/g, '');
        if (!cleanSgd) {
          this.lastFetchedSgd = '';
          return;
        }

        const titleEl = document.getElementById('dem-titulo');
        const currentTitle = titleEl ? titleEl.value.trim() : '';
        if (!force && cleanSgd === this.lastFetchedSgd && currentTitle) {
          return;
        }

        const loadingBadge = document.getElementById('loading-badge-sgd');
        const diagMsg = document.getElementById('sgd-diagnostic-msg');
        if (loadingBadge) loadingBadge.classList.remove('hidden');
        if (diagMsg) {
          diagMsg.textContent = `Buscando SGD #${cleanSgd} na Intranet Cagece...`;
          diagMsg.className = 'mt-1 text-[10px] leading-tight font-medium text-blue-600';
        }

        try {
          // 1. Tenta buscar nos endpoints REST do SGD diretamente, sem depender da ponte local.
          const sgdEndpoints = [
            `https://sistemas.int.cagece.com.br/sgd/api/v1/solicitacao/${cleanSgd}/descricao`,
            `https://dev.int.cagece.com.br/sgd/api/v1/solicitacao/${cleanSgd}/descricao`,
            `http://localhost:8080/sgd/api/v1/solicitacao/${cleanSgd}/descricao`
          ];

          let responsePayload = null;
          let matchedEndpoint = '';
          let notFoundMsg = null;
          let networkErrorMsg = '';

          for (const url of sgdEndpoints) {
            const isLocal = url.includes('localhost') || url.includes('127.0.0.1');
            const controller = new AbortController();
            // A ponte local precisa de tempo para buscar na VPN da Cagece (7 segundos)
            const timeoutId = setTimeout(() => controller.abort(), isLocal ? 7000 : 4000);
            try {
              console.log(`[SGD Lookup] Testando endpoint: ${url}`);
              const res = await fetch(url, {
                method: 'GET',
                headers: { 'Accept': 'application/json' },
                signal: controller.signal
              });
              clearTimeout(timeoutId);

              console.log(`[SGD Lookup] Resposta de ${url}: HTTP ${res.status}`);

              if (res.status === 401 || res.status === 403) {
                const errJson = await res.json().catch(() => null);
                notFoundMsg = errJson?.errorInfo?.displayMessage || `Acesso ao SGD #${cleanSgd} requer autenticação na Intranet da Cagece.`;
                break;
              }

              if (res.status === 404) {
                const errJson = await res.json().catch(() => null);
                if (errJson && errJson.errorInfo) {
                  notFoundMsg = errJson.errorInfo.displayMessage || `SGD #${cleanSgd} não encontrado no sistema SGD da Cagece.`;
                  break;
                }
                continue;
              }

              if (res.ok) {
                const contentType = res.headers.get('content-type') || '';
                let parsed = null;
                if (contentType.includes('application/json')) {
                  parsed = await res.json().catch(() => null);
                } else {
                  const rawText = await res.text();
                  try {
                    parsed = JSON.parse(rawText);
                  } catch (_) {
                    if (rawText && rawText.trim() && !rawText.trim().startsWith('<')) {
                      parsed = { hasError: false, data: rawText.trim() };
                    }
                  }
                }

                if (parsed && !parsed.hasError) {
                  responsePayload = parsed;
                  matchedEndpoint = url;
                  console.log(`[SGD Lookup] Sucesso na API SGD para #${cleanSgd} via ${url}:`, responsePayload);
                  break; // Interrompe imediatamente no primeiro endpoint que responder com sucesso!
                }
              }
            } catch (fetchErr) {
              clearTimeout(timeoutId);
              // Ignora erro de conexao local se o proxy nao estiver ligado e tenta o proximo
              if (!isLocal) {
                networkErrorMsg = fetchErr.message || String(fetchErr);
              }
              console.warn(`[SGD Lookup] Falha ao acessar ${url}:`, fetchErr);
            }
          }

          if (notFoundMsg) {
            if (diagMsg) {
              diagMsg.textContent = `⚠️ ${notFoundMsg}`;
              diagMsg.className = 'mt-1 text-[10px] leading-tight font-semibold text-amber-700';
              diagMsg.classList.remove('hidden');
            }
            this.showToast(notFoundMsg, 'warning');
            return;
          }

          // Se a API SGD retornou os dados diretamente da intranet da Cagece ou ponte local
          if (responsePayload && !responsePayload.hasError) {
            let rawDesc = '';
            if (typeof responsePayload === 'string') {
              rawDesc = responsePayload;
            } else if (responsePayload && typeof responsePayload.data === 'string') {
              rawDesc = responsePayload.data;
            } else if (responsePayload) {
              const obj = (typeof responsePayload.data === 'object' && responsePayload.data !== null) ? responsePayload.data : responsePayload;
              rawDesc = obj.solDscProblema || obj.solDscSolicitacao || obj.descricao || obj.dsProblema || obj.problema || '';
            }

            const dataObj = (responsePayload && typeof responsePayload.data === 'object' && responsePayload.data !== null) ? responsePayload.data : (typeof responsePayload === 'object' ? responsePayload : {});
            const rawTitle = dataObj.solDscTitulo || dataObj.solDscAssunto || dataObj.titulo || dataObj.assunto || '';

            const cleanDesc = this.extractCleanSgdDescription(cleanSgd, rawDesc);
            const cleanTitle = rawTitle ? this.extractCleanSgdDescription(cleanSgd, rawTitle) : (cleanDesc ? this.extractSummarizedTitleFromSgdText(cleanDesc) : `[SGD ${cleanSgd}]`);

            this.lastFetchedSgd = cleanSgd;
            const sourceLabel = matchedEndpoint.includes('8180') ? 'API SGD (Ponte Local 8180)' : 'API SGD (Intranet Cagece)';
            this.applySgdMetadataToModal({
              title: cleanTitle || `[SGD ${cleanSgd}] Demanda`,
              fullDescription: cleanDesc || cleanTitle || `[SGD ${cleanSgd}] Demanda importada`,
              sistema: dataObj?.sisDscSigla || dataObj?.sisDscSistema || '',
              moduloNome: dataObj?.modDscModulo || dataObj?.nmModulo || dataObj?.modulo || '',
              tipo: dataObj?.tisDscTipo || dataObj?.tpSolicitacao || dataObj?.tipo || '',
              source: sourceLabel
            });
            if (diagMsg) {
              diagMsg.textContent = `✓ Dados preenchidos via ${sourceLabel}`;
              diagMsg.className = 'mt-1 text-[10px] leading-tight font-semibold text-emerald-700';
              diagMsg.classList.remove('hidden');
            }
            this.showToast(`Dados do SGD #${cleanSgd} preenchidos automaticamente via ${sourceLabel}!`, 'success');
            return;
          }

          // 2. Fallback Inteligente: Se o SGD já existir no Azure DevOps (caso o usuário/PO tenha PAT configurado)
          const azureMatch = await this.lookupSgdInAzureProduction(cleanSgd);
          if (azureMatch && (azureMatch.title || azureMatch.fullDescription)) {
            this.lastFetchedSgd = cleanSgd;
            this.applySgdMetadataToModal(azureMatch);
            if (diagMsg) {
              diagMsg.textContent = `✓ Dados recuperados via ${azureMatch.source}`;
              diagMsg.className = 'mt-1 text-[10px] leading-tight font-semibold text-emerald-700';
            }
            this.showToast(`SGD #${cleanSgd} preenchido via ${azureMatch.source}!`, 'success');
            return;
          }

          // 3. Fallback: Base local do Portal RH
          if (Array.isArray(State.db.demandas) && State.db.demandas.length > 0) {
            const sgdRegex = new RegExp(`\\b${cleanSgd}\\b`, 'i');
            const localMatch = State.db.demandas.find(d => {
              if (d.excluido) return false;
              if (this.currentEditingDemandaId && d.id === this.currentEditingDemandaId) return false;
              const dSgdDigits = String(d.sgd || '').replace(/\D/g, '');
              return dSgdDigits === cleanSgd || String(d.sgd || '').toLowerCase() === String(cleanSgd).toLowerCase() || sgdRegex.test(String(d.titulo || ''));
            });
            if (localMatch) {
              this.lastFetchedSgd = cleanSgd;
              this.applySgdMetadataToModal({
                title: localMatch.titulo,
                fullDescription: localMatch.descricao || localMatch.titulo,
                problema: localMatch.problema || '',
                resultadoEsperado: localMatch.resultadoEsperado || '',
                moduloId: localMatch.moduloId || '',
                tipo: localMatch.tipo || '',
                source: `Base Local (${localMatch.sgd})`
              });
              if (diagMsg) {
                diagMsg.textContent = `✓ Carregado da base local (${localMatch.sgd})`;
                diagMsg.className = 'mt-1 text-[10px] leading-tight font-semibold text-emerald-700';
              }
              return;
            }
          }

          // 4. Modo Simulação de Chamados SGD (Homologação & Desenvolvimento do Fluxo)
          const simData = (typeof SIMULATED_SGD_CATALOG !== 'undefined') ? SIMULATED_SGD_CATALOG[cleanSgd] : null;
          if (simData) {
            this.lastFetchedSgd = cleanSgd;
            this.applySgdMetadataToModal({
              title: simData.titulo,
              fullDescription: simData.descricao,
              problema: simData.problema || '',
              resultadoEsperado: simData.resultadoEsperado || '',
              impacto: simData.impacto || '',
              sistema: simData.sistema || '',
              tipoAtividade: simData.tipoAtividade || simData.tipo || '',
              moduloId: simData.moduloId,
              funcionalidadeId: simData.funcionalidadeId || '',
              tipo: simData.tipo,
              source: `Simulação SGD #${cleanSgd}`
            });
            if (diagMsg) {
              diagMsg.textContent = `✓ Simulação SGD #${cleanSgd} (${this.getModuleName(simData.moduloId)}) carregada com sucesso`;
              diagMsg.className = 'mt-1 text-[10px] leading-tight font-semibold text-emerald-700';
              diagMsg.classList.remove('hidden');
            }
            this.showToast(`SGD #${cleanSgd} preenchido via Catálogo de Simulação!`, 'success');
            return;
          }

          // 5. Geração Dinâmica de Simulação para qualquer outro número de SGD digitado
          const activeModId = document.getElementById('dem-modulo')?.value || 'MOD-04';
          const modName = this.getModuleName(activeModId);
          this.lastFetchedSgd = cleanSgd;
          this.applySgdMetadataToModal({
            title: `[SGD ${cleanSgd}] Solicitação de ajuste no módulo ${modName}`,
            fullDescription: `Demanda SGD #${cleanSgd} carregada no modo de simulação para validação do fluxo do solicitante e do PO.`,
            problema: `Inconsistência funcional ou necessidade de nova regra de negócio reportada sob o SGD #${cleanSgd}.`,
            resultadoEsperado: `Implementação, revisão pelo PO e envio para atendimento técnico no módulo ${modName}.`,
            impacto: `Médio - Avaliar impacto operacional no módulo ${modName}.`,
            moduloId: activeModId,
            tipo: 'Melhoria',
            source: `Simulação SGD #${cleanSgd}`
          });
          if (diagMsg) {
            diagMsg.textContent = `✓ Simulação SGD #${cleanSgd} (${modName}) gerada`;
            diagMsg.className = 'mt-1 text-[10px] leading-tight font-semibold text-emerald-700';
            diagMsg.classList.remove('hidden');
          }
          this.showToast(`SGD #${cleanSgd} carregado no Modo de Simulação!`, 'info');
          return;
        } finally {
          if (loadingBadge) loadingBadge.classList.add('hidden');
        }
      },

      async pasteFromClipboardToSgd() {
        let text = '';
        if (navigator.clipboard && navigator.clipboard.readText) {
          try {
            text = await navigator.clipboard.readText();
          } catch (_) {}
        }
        if (!text || !text.trim()) {
          text = prompt('Cole aqui o texto copiado da descrição ou chamado no SGD:');
        }
        if (!text || !text.trim()) {
          this.showToast('Nenhum texto informado para preenchimento.', 'info');
          return;
        }

        const sgdInput = document.getElementById('dem-sgd');
        const cleanSgd = sgdInput ? sgdInput.value.trim().replace(/\D/g, '') : '';
        const cleanDesc = this.extractCleanSgdDescription(cleanSgd, text.trim());
        const cleanTitle = this.extractSummarizedTitleFromSgdText(cleanDesc);

        this.applySgdMetadataToModal({
          title: cleanTitle || cleanDesc,
          fullDescription: cleanDesc,
          source: 'SGD Cagece (Capturado)'
        });

        const diagMsg = document.getElementById('sgd-diagnostic-msg');
        if (diagMsg) {
          diagMsg.innerHTML = `<span class="text-emerald-700 font-semibold text-[10px]">✓ Título, Módulo, Tipo e Descrição preenchidos a partir do texto do SGD!</span>`;
          diagMsg.className = 'mt-1';
          diagMsg.classList.remove('hidden');
        }
        this.showToast('Campos preenchidos automaticamente com o texto do SGD!', 'success');
      },

      bindSgdAutoLookup() {
        const sgdInput = document.getElementById('dem-sgd');
        if (!sgdInput) return;
        this.lastFetchedSgd = '';

        sgdInput.addEventListener('input', () => {
          if (this.sgdLookupTimeout) clearTimeout(this.sgdLookupTimeout);
          const cleanVal = sgdInput.value.trim().replace(/\D/g, '');
          if (!cleanVal) {
            this.lastFetchedSgd = '';
            return;
          }
          if (cleanVal.length < 4) return;
          this.sgdLookupTimeout = setTimeout(() => {
            this.fetchSgdDataForModal(cleanVal, false);
          }, 600);
        });

        sgdInput.addEventListener('change', () => {
          if (this.sgdLookupTimeout) clearTimeout(this.sgdLookupTimeout);
          const val = sgdInput.value.trim();
          if (val) this.fetchSgdDataForModal(val, false);
        });

        sgdInput.addEventListener('blur', () => {
          if (this.sgdLookupTimeout) clearTimeout(this.sgdLookupTimeout);
          const val = sgdInput.value.trim();
          if (val) this.fetchSgdDataForModal(val, false);
        });

        sgdInput.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') {
            e.preventDefault();
            if (this.sgdLookupTimeout) clearTimeout(this.sgdLookupTimeout);
            const val = sgdInput.value.trim();
            if (val) this.fetchSgdDataForModal(val, true);
          }
        });
      },

      async saveDemanda(demandaId, forcedStatus = null, options = {}) {
        const sgd = document.getElementById('dem-sgd').value.trim();
        const titulo = document.getElementById('dem-titulo').value.trim();
        const descricao = document.getElementById('dem-descricao').value.trim();
        const responsavel = document.getElementById('dem-responsavel')?.value.trim() || '';
        const activityValue = document.getElementById('dem-azure-activity-type')?.value || '';
        const novaFuncionalidade = this.normalizeDemoFieldValue(activityValue).includes('novafunc');
        const tipoDemanda = novaFuncionalidade ? 'Nova funcionalidade' : document.getElementById('dem-tipo').value;
        const demandaAtual = demandaId ? State.db.demandas.find(item => item.id === demandaId) : null;
        const funcionalidadeAtual = demandaAtual?.tipo === 'Nova funcionalidade' ? State.db.funcionalidades.find(item => item.id === demandaAtual.funcionalidadeId) : null;
        const solicitante = demandaAtual?.solicitante || State.currentUser || 'Analista Responsável RH';
        const unidade = demandaAtual?.unidade || State.currentUnidade || 'GEPES / Portal RH';
        const dataAbertura = demandaAtual?.dataAbertura || Utils.todayISO();

        if (!sgd || !titulo || !descricao) {
          this.showToast('Preencha todos os campos obrigatórios (*) da solicitação (Nº SGD, Título e Descrição).', 'error');
          this.switchDemandaTab('solicitante');
          return;
        }

        if (!document.getElementById('dem-azure-system')?.value || !document.getElementById('dem-azure-activity-type')?.value) {
          this.showToast('Selecione Sistema e Tipo de Atividade na aba do solicitante antes de salvar a demanda.', 'error');
          this.switchDemandaTab('solicitante');
          return;
        }

        const funcInline = novaFuncionalidade ? {
          nome: document.getElementById('dem-func-nome').value.trim() || titulo,
          responsavel: document.getElementById('dem-func-responsavel').value.trim() || solicitante,
          objetivo: document.getElementById('dem-func-objetivo').value.trim() || document.getElementById('dem-resultadoEsperado').value.trim() || descricao,
          descricaoFuncional: document.getElementById('dem-func-descricao').value.trim() || descricao
        } : null;
        if (novaFuncionalidade && options.syncAzure && (!funcInline.nome || !funcInline.responsavel || !funcInline.objetivo || !funcInline.descricaoFuncional)) {
          this.showToast('Preencha nome, responsável, objetivo e descrição da nova funcionalidade na aba do PO antes de enviar ao Azure.', 'error');
          this.switchDemandaTab('po');
          return;
        }
        const moduloSelecionado = document.getElementById('dem-modulo').value;
        if (!moduloSelecionado || !State.db.modulos.some(item => item.id === moduloSelecionado)) {
          this.showToast('Selecione um módulo válido do catálogo antes de salvar.', 'error');
          this.switchDemandaTab('solicitante');
          return;
        }
        const funcSelecionada = document.getElementById('dem-func')?.value || '';
        const historiaSelecionada = document.getElementById('dem-historia')?.value || '';
        if (!novaFuncionalidade && funcSelecionada && !State.db.funcionalidades.some(item => item.id === funcSelecionada && item.moduloId === moduloSelecionado)) { this.showToast('A funcionalidade relacionada precisa pertencer ao modulo selecionado.', 'error'); return; }
        if (!novaFuncionalidade && historiaSelecionada && !State.db.historiasUsuario.some(item => item.id === historiaSelecionada && item.moduloId === moduloSelecionado)) { this.showToast('A historia relacionada precisa pertencer ao modulo selecionado.', 'error'); return; }
        const selectedStatus = options.syncAzure ? (demandaAtual?.status || 'Aguardando análise do PO') : (forcedStatus || demandaAtual?.status || 'Aguardando análise do PO');
        const conclusionDate = document.getElementById('dem-dataConclusao').value;
        const azureItemId = document.getElementById('dem-azureItemId')?.value.trim() || '';
        if (!options.syncAzure && demandaAtual?.status === 'Em atendimento' && ['Em homologação', 'Concluída'].includes(selectedStatus)) {
          this.showToast('A homologação começa quando o card chegar à coluna Done no Azure.', 'warning');
          return;
        }
        if (!options.syncAzure && demandaAtual && ['Aberta', 'Aguardando análise do PO', 'Aguardando direcionamento do Dev'].includes(demandaAtual.status) && ['Aguardando direcionamento do Dev', 'Em atendimento', 'Em homologação', 'Concluída'].includes(selectedStatus)) {
          this.showToast('Use a aprovação do PO ou a atualização do Azure para avançar esta demanda.', 'warning');
          return;
        }
        const azureState = document.getElementById('dem-azureState')?.value.trim() || '';
        const repoBranch = document.getElementById('dem-repoBranch')?.value.trim() || '';

        const payload = {
          sgd,
          titulo,
          tipo: tipoDemanda,
          moduloId: moduloSelecionado,
          funcionalidadeId: novaFuncionalidade ? (funcionalidadeAtual?.id || '') : funcSelecionada,
          historiaUsuarioId: novaFuncionalidade ? '' : historiaSelecionada,
          solicitante,
          unidade,
          dataAbertura,
          canal: demandaAtual?.canal || 'SGD',
          descricao,
          problema: document.getElementById('dem-problema').value.trim(),
          resultadoEsperado: document.getElementById('dem-resultadoEsperado').value.trim(),
          prioridade: document.getElementById('dem-prioridade').value,
          impacto: document.getElementById('dem-impacto').value.trim(),
          responsavel: responsavel || 'Não atribuído',
          equipe: document.getElementById('dem-equipe').value.trim(),
          status: selectedStatus,
          prazo: document.getElementById('dem-prazo').value,
          solucao: document.getElementById('dem-solucao').value.trim(),
          pendencias: document.getElementById('dem-pendencias').value.trim(),
          versaoEntrega: document.getElementById('dem-versaoEntrega').value.trim(),
          responsavelHomologacao: document.getElementById('dem-respHomolog').value.trim(),
          resultadoHomologacao: document.getElementById('dem-resHomolog').value,
          dataConclusao: selectedStatus === 'Conclu\u00edda' ? (conclusionDate || Utils.todayISO()) : conclusionDate,
          azureItemId,
          azureState,
          azureProject: document.getElementById('dem-azure-project')?.value || demandaAtual?.azureProject || 'Administrativo',
          azureTeam: document.getElementById('dem-azure-team')?.value || demandaAtual?.azureTeam || 'Sustentação Administrativo',
          azureWorkItemType: document.getElementById('dem-azure-work-item-type')?.value || demandaAtual?.azureWorkItemType || 'PBI PO',
          azureAreaPath: document.getElementById('dem-azure-area-path')?.value || demandaAtual?.azureAreaPath || document.getElementById('dem-azure-project')?.value || 'Administrativo',
          azureIterationPath: demandaAtual?.azureIterationPath || '',
          azureSystem: document.getElementById('dem-azure-system')?.value || demandaAtual?.azureSystem || '',
          azureActivityType: document.getElementById('dem-azure-activity-type')?.value || demandaAtual?.azureActivityType || '',
          azureBlocked: demandaAtual?.azureBlocked ?? 'false',
          repoBranch,
          atualizadoEm: Utils.nowBR(),
          excluido: false
        };

        let savedDemand = null;
        if (demandaId) {
          const idx = State.db.demandas.findIndex(x => x.id === demandaId);
          if (idx > -1) {
            const old = State.db.demandas[idx];
            const changes = [];
            if (old.status !== payload.status) changes.push(`Status alterado de "${old.status}" para "${payload.status}"`);
            if (old.responsavel !== payload.responsavel) changes.push(`Responsável alterado de "${old.responsavel}" para "${payload.responsavel}"`);
            if (old.prazo !== payload.prazo) changes.push(`Prazo atualizado para "${Utils.formatDateBR(payload.prazo)}"`);
            State.db.demandas[idx] = { ...old, ...payload };
            savedDemand = State.db.demandas[idx];
            this.logAudit(
              'DEMANDA',
              demandaId,
              changes.length ? 'Atualização de Status/Atendimento' : 'Edição de Demanda',
              `${sgd}: ${changes.length ? changes.join('; ') : 'Dados da ficha atualizados.'}`,
              State.db.demandas[idx]
            );
          }
        } else {
          // Prevenção contra duplicidade acidental de mesmo SGD aberto
          const dup = State.db.demandas.find(x => !x.excluido && x.sgd.toLowerCase() === sgd.toLowerCase() && x.titulo.toLowerCase() === titulo.toLowerCase());
          if (dup) {
            this.showToast(`Já existe uma demanda ativa com o SGD ${sgd} e mesmo título.`, 'warning');
            return;
          }
          const nova = { id: Utils.generateId('DEM'), ...payload };
          State.db.demandas.unshift(nova);
          savedDemand = nova;
          this.logAudit('DEMANDA', nova.id, 'Abertura do chamado', `Demanda ${sgd} ("${titulo}") registrada para o módulo ${this.getModuleName(nova.moduloId)}.`, nova);
        }

        if (!savedDemand) { this.showToast('A demanda nao foi encontrada para atualizacao.', 'error'); return; }
        try {
          await this.savePendingDemandFiles(savedDemand);
        } catch (err) {
          this.showToast('Demanda salva, mas não foi possível guardar um anexo: ' + err.message, 'error');
          return;
        }
        if (novaFuncionalidade) {
          const featureId = funcionalidadeAtual?.id || Utils.generateId('FUNC');
          const featureData = {
            nome: funcInline.nome, moduloId: savedDemand.moduloId, situacao: funcionalidadeAtual?.situacao || 'Documentada',
            versao: funcionalidadeAtual?.versao || '1.0', responsavel: funcInline.responsavel,
            perfis: funcionalidadeAtual?.perfis || '', objetivo: funcInline.objetivo,
            descricaoFuncional: funcInline.descricaoFuncional, preCondicoes: funcionalidadeAtual?.preCondicoes || '',
            dadosEntrada: funcionalidadeAtual?.dadosEntrada || '', processamento: funcionalidadeAtual?.processamento || '',
            dadosSaida: funcionalidadeAtual?.dadosSaida || '', excecoes: funcionalidadeAtual?.excecoes || '',
            dependencias: funcionalidadeAtual?.dependencias || '', atualizadoEm: Utils.nowBR(), excluido: false
          };
          if (funcionalidadeAtual) {
            const featureIndex = State.db.funcionalidades.findIndex(item => item.id === featureId);
            State.db.funcionalidades[featureIndex] = { ...funcionalidadeAtual, ...featureData };
            this.logAudit('FUNCIONALIDADE', featureId, 'Atualizacao via demanda SGD', savedDemand.sgd + ': especificacao funcional atualizada.', State.db.funcionalidades[featureIndex]);
          } else {
            const novaFeature = { id: featureId, criadoEm: Utils.nowBR(), ...featureData };
            State.db.funcionalidades.unshift(novaFeature);
            this.logAudit('FUNCIONALIDADE', featureId, 'Criacao via demanda SGD', savedDemand.sgd + ': nova funcionalidade cadastrada.', novaFeature);
          }
          savedDemand.funcionalidadeId = featureId;
        }
        // Persiste os critérios de aceite definidos pelo PO para esta demanda
        if (!State.db.criteriosAceitacao) State.db.criteriosAceitacao = [];
        State.db.criteriosAceitacao = State.db.criteriosAceitacao.filter(c => c.demandaId !== savedDemand.id);
        document.querySelectorAll('.dem-criterio-row').forEach(row => {
          const cenario = row.querySelector('.dem-ca-cenario')?.value.trim() || '';
          const dado = row.querySelector('.dem-ca-dado')?.value.trim() || '';
          const quando = row.querySelector('.dem-ca-quando')?.value.trim() || '';
          const entao = row.querySelector('.dem-ca-entao')?.value.trim() || '';

          if (cenario || dado || quando || entao) {
            State.db.criteriosAceitacao.push({
              id: Utils.generateId('CA'),
              demandaId: savedDemand.id,
              cenario,
              dado,
              quando,
              entao,
              criadoEm: Utils.nowBR()
            });
          }
        });

        this.syncWithGasBackend('UPSERT_DEMANDA', savedDemand);
        if (savedDemand.azureItemId && !options.syncAzure && this.getAzureAuthHeader()) {
          const failedAttachments = await this.syncDemandAttachmentsToAzure(savedDemand, this.getAzureAuthHeader());
          if (failedAttachments.length) this.showToast('Anexos ainda não enviados: ' + failedAttachments.join('; ').slice(0, 180), 'warning');
        }
        this.updateSidebarCounters();
        this.closeModal();
        this.renderCurrentView();

        if (options.sendToPo) {
          this.showToast(`Demanda ${sgd} enviada com sucesso para a Análise e Triagem do PO!`, 'success');
        } else if (options.syncAzure) {
          // Aciona sincronização com o Azure DevOps usando o PAT do PO
          if (this.getAzureAuthHeader()) {
            const statusBeforeAzure = savedDemand.status;
            const sent = await this.syncDemandaToAzure(savedDemand.id);
            if (sent) {
              savedDemand.status = ['Aberta', 'Aguardando análise do PO', 'Aguardando direcionamento do Dev'].includes(statusBeforeAzure) ? 'Aguardando direcionamento do Dev' : statusBeforeAzure;
              savedDemand.atualizadoEm = Utils.nowBR();
              this.syncWithGasBackend('UPSERT_DEMANDA', savedDemand);
              this.persistLocalState();
              const hasPendingAttachment = State.db.documentos.some(doc => doc.entidadeId === savedDemand.id && doc.azureAttachmentStatus === 'Pendente' && doc.situacao !== 'Removido');
              this.showToast(hasPendingAttachment ? `Work Item #${savedDemand.azureItemId} salvo, mas há anexos pendentes.` : `Demanda ${sgd} aprovada e criada/atualizada no Azure Boards.`, hasPendingAttachment ? 'warning' : 'success');
              this.renderCurrentView();
            }
          } else {
            this.showToast(`Demanda salva no fluxo. Entre no Azure pela barra superior para enviar o Work Item.`, 'info');
          }
        } else {
          this.showToast(`Demanda ${sgd} salva e auditada com sucesso!`);
        }
      },

      /***********************************************************************
       * CONTROLE DO KANBAN DE DEMANDAS (DRAG & DROP + TRANSIÇÃO DE ETAPAS)
       ***********************************************************************/
      draggedDemandaId: null,

      handleKanbanDragStart(event, demandaId) {
        if (!this.hasWritePermission()) {
          event.preventDefault();
          this.showToast('Perfil de Consulta não possui permissão para mover demandas no Kanban.', 'warning');
          return false;
        }
        this.draggedDemandaId = demandaId;
        event.dataTransfer.setData('text/plain', demandaId);
        event.dataTransfer.effectAllowed = 'move';
        setTimeout(() => {
          if (event.target) event.target.classList.add('dragging');
        }, 0);
      },

      handleKanbanDragEnd(event) {
        if (event.target) event.target.classList.remove('dragging');
        document.querySelectorAll('.kanban-column').forEach(col => col.classList.remove('drag-over'));
        this.draggedDemandaId = null;
      },

      handleKanbanDragOver(event) {
        event.preventDefault();
        event.dataTransfer.dropEffect = 'move';
        const col = event.currentTarget;
        if (col && !col.classList.contains('drag-over')) {
          col.classList.add('drag-over');
        }
      },

      handleKanbanDragLeave(event) {
        const col = event.currentTarget;
        if (col) col.classList.remove('drag-over');
      },

      handleKanbanDrop(event, novoStatus) {
        event.preventDefault();
        const col = event.currentTarget;
        if (col) col.classList.remove('drag-over');
        const demandaId = event.dataTransfer.getData('text/plain') || this.draggedDemandaId;
        if (!demandaId) return;
        this.moveDemandaKanbanStatus(demandaId, novoStatus);
      },

      moveDemandaKanbanStatus(demandaId, novoStatus) {
        if (!this.hasWritePermission()) {
          this.showToast('Perfil de Consulta não possui permissão para alterar o fluxo da demanda.', 'warning');
          return;
        }
        const d = State.db.demandas.find(x => x.id === demandaId);
        if (!d || d.status === novoStatus) return;
        if (['Aberta', 'Aguardando análise do PO'].includes(d.status) && novoStatus === 'Aguardando direcionamento do Dev') {
          this.showToast('O PO precisa aprovar e enviar ao Azure antes desta etapa.', 'warning');
          return;
        }
        if (['Aberta', 'Aguardando análise do PO', 'Aguardando direcionamento do Dev'].includes(d.status) && ['Em atendimento', 'Em homologação', 'Concluída'].includes(novoStatus)) {
          this.showToast('Atualize o Azure para confirmar o time e a Sprint antes de avançar no Kanban.', 'warning');
          return;
        }
        if (d.status === 'Em atendimento' && ['Em homologação', 'Concluída'].includes(novoStatus)) {
          this.showToast('A homologação começa quando o card chegar à coluna Done no Azure.', 'warning');
          return;
        }

        const statusAnterior = d.status;
        d.status = novoStatus;
        d.atualizadoEm = Utils.nowBR();

        if (novoStatus === 'Em atendimento' && !d.dataInicio) {
          d.dataInicio = Utils.todayISO();
        }
        if (novoStatus === 'Em homologação' && (!d.resultadoHomologacao || d.resultadoHomologacao === 'Pendente')) {
          d.resultadoHomologacao = 'Em validação';
        }
        if (novoStatus === 'Concluída' && !d.dataConclusao) {
          d.dataConclusao = Utils.todayISO();
        }

        this.logAudit(
          'DEMANDA',
          d.id,
          'Movimentação no Fluxo Kanban',
          `Demanda ${d.sgd} movida da etapa "${statusAnterior}" para "${novoStatus}".`,
          d
        );
        this.syncWithGasBackend('UPSERT_DEMANDA', d);
        this.updateSidebarCounters();
        this.renderCurrentView();
        this.showToast(`${d.sgd} avançou para "${novoStatus}"!`);
      },

      editRegraNegocio(ruleId, funcId) {
        if (!this.hasWritePermission()) return;
        const rule = State.db.regrasNegocio.find(r => r.id === ruleId); if (!rule) return;
        const body = `<div class="space-y-3"><label class="block text-sm font-semibold">Codigo<input id="edit-rn-code" value="${Utils.escapeHtml(rule.codigo)}" class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2"></label><label class="block text-sm font-semibold">Titulo<input id="edit-rn-title" value="${Utils.escapeHtml(rule.titulo)}" class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2"></label><label class="block text-sm font-semibold">Descricao<textarea id="edit-rn-desc" rows="4" class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2">${Utils.escapeHtml(rule.descricao)}</textarea></label></div>`;
        this.openModal('Editar regra de neg\u00f3cio', body, `<button onclick="App.closeModal()" class="rounded-lg bg-slate-100 px-4 py-2 font-semibold">Cancelar</button><button onclick="App.saveEditedRegraNegocio('${ruleId}','${funcId}')" class="rounded-lg bg-blue-600 px-4 py-2 font-semibold text-white">Salvar altera\u00e7\u00f5es</button>`);
      },

      saveEditedRegraNegocio(ruleId, funcId) {
        const rule = State.db.regrasNegocio.find(r => r.id === ruleId); if (!rule) return;
        const codigo = document.getElementById('edit-rn-code').value.trim(), titulo = document.getElementById('edit-rn-title').value.trim(), descricao = document.getElementById('edit-rn-desc').value.trim();
        if (!codigo || !titulo || !descricao) { this.showToast('Preencha todos os campos da regra.', 'error'); return; }
        const before = { ...rule }; Object.assign(rule, { codigo, titulo, descricao }); this.logAudit('FUNCIONALIDADE', funcId, 'Edicao de regra de negocio', `Regra ${codigo} atualizada.`, before); this.openFuncionalidadeDetailModal(funcId);
      },
      removeRegraNegocio(ruleId, funcId) {
        if (!this.hasWritePermission()) return;
        const rule = State.db.regrasNegocio.find(r => r.id === ruleId); if (!rule) return;
        rule.excluido = true; this.logAudit('FUNCIONALIDADE', funcId, 'Exclusao logica de regra', `Regra ${rule.codigo} marcada como removida.`, rule); this.openFuncionalidadeDetailModal(funcId);
      },
      addRegraNegocio(funcId) {
        const codigo = document.getElementById('rn-codigo').value.trim();
        const titulo = document.getElementById('rn-titulo').value.trim();
        const descricao = document.getElementById('rn-desc').value.trim();
        if (!codigo || !titulo || !descricao) {
          this.showToast('Preencha código, título e descrição da regra de negócio.', 'error');
          return;
        }
        const rn = {
          id: Utils.generateId('RN'),
          funcionalidadeId: funcId,
          codigo,
          titulo,
          descricao,
          versao: '1.0',
          status: 'Vigente',
          criadoEm: Utils.nowBR()
        };
        State.db.regrasNegocio.push(rn);
        this.logAudit('FUNCIONALIDADE', funcId, 'Inclusão de Regra de Negócio', `Regra ${codigo} ("${titulo}") adicionada.`, rn);
        this.openFuncionalidadeDetailModal(funcId);
        this.showToast(`Regra de negócio ${codigo} registrada!`);
      },

                <div>
                  <p class="font-bold text-slate-800">Deseja reativar a funcionalidade?</p>

      setJustificativaPreset(text) {
        const el = document.getElementById('justificativa-desativacao');
        if (el) {
          el.value = text;
          el.focus();
        }
      },

      confirmDeactivateFuncionalidade(funcId) {
        const justEl = document.getElementById('justificativa-desativacao');
        const justificativa = justEl ? justEl.value.trim() : '';
        if (!justificativa || justificativa.length < 5) {
          this.showToast('É obrigatório informar uma justificativa clara (mínimo de 5 caracteres) para desativar a funcionalidade.', 'error');
          if (justEl) justEl.focus();
          return;
        }

        const f = State.db.funcionalidades.find(x => x.id === funcId);
        if (!f) return;

        const before = { ...f };
        f.ativo = false;
        f.situacaoAnterior = f.situacao && f.situacao !== 'Desativada' ? f.situacao : 'Homologada';
        f.situacao = 'Desativada';
        f.justificativaDesativacao = justificativa;
        f.desativadoEm = Utils.nowBR();
        f.desativadoPor = State.currentUser || 'Usuário';
        f.atualizadoEm = Utils.nowBR();

        this.logAudit('FUNCIONALIDADE', f.id, 'Desativação de Funcionalidade', `Funcionalidade "${f.nome}" desativada. Justificativa: ${justificativa}`, before);
        this.persistLocalState();
        this.closeModal();
        this.renderCurrentView();
        this.showToast(`Funcionalidade "${f.nome}" desativada com sucesso.`, 'info');
      },

      confirmActivateFuncionalidade(funcId) {
        const f = State.db.funcionalidades.find(x => x.id === funcId);
        if (!f) return;

        const justAtivEl = document.getElementById('justificativa-ativacao');
        const obs = justAtivEl ? justAtivEl.value.trim() : '';

        const before = { ...f };
        f.ativo = true;
        f.situacao = f.situacaoAnterior && f.situacaoAnterior !== 'Desativada' ? f.situacaoAnterior : 'Disponível';
        f.reativadoEm = Utils.nowBR();
        f.reativadoPor = State.currentUser || 'Usuário';
        f.obsReativacao = obs;
        f.atualizadoEm = Utils.nowBR();

        this.logAudit('FUNCIONALIDADE', f.id, 'Reativação de Funcionalidade', `Funcionalidade "${f.nome}" reativada por ${f.reativadoPor}.${obs ? ' Observação: ' + obs : ''}`, before);
        this.persistLocalState();
        this.closeModal();
        this.renderCurrentView();
        this.showToast(`Funcionalidade "${f.nome}" ativada com sucesso!`);
      },
