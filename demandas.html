  <style>
    body {

      color: #2c3e50;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;

    /* Títulos de Seção/Cards com detalhe lateral azul conforme Design System */
    .ds-section-title {
      border-left: 4px solid #2196f3;
      padding-left: 0.75rem;
      font-weight: 700;
      color: #1e293b;
    }

    /* Sombras padronizadas do Design System (escuras, puxando para o lado inferior esquerdo) */
    .shadow-rh-card,
    .shadow-rh-quadrant {
      box-shadow: -4px 5px 12px -1px rgba(15, 23, 42, 0.22), -2px 3px 6px -1px rgba(15, 23, 42, 0.14) !important;

    .shadow-rh-item {
      box-shadow: -3px 4px 8px -1px rgba(15, 23, 42, 0.18), -1px 2px 4px -1px rgba(15, 23, 42, 0.12) !important;

    /* Cards de Módulos seguindo o Design System (Radius 12px, Shadow padrão e Secondary #00bcd4) */
    .rh-module-card {
      background: #ffffff;
      border-radius: 12px;
      box-shadow: -4px 5px 12px -1px rgba(15, 23, 42, 0.22), -2px 3px 6px -1px rgba(15, 23, 42, 0.14);
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
      overflow: hidden;
      border: 1px solid #e2e8f0;
    }

    .rh-module-card:hover {
      transform: translateY(-3px);
      box-shadow: -6px 8px 16px -2px rgba(15, 23, 42, 0.28), -3px 4px 8px -2px rgba(15, 23, 42, 0.16);
      border-color: #64b5f6;
    }

    .rh-module-card::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 3px;
      background-color: #00bcd4;
      border-radius: 3px 3px 0 0;
      transition: width 0.25s ease;
    }

    .rh-module-card:hover::after,
    .rh-module-card.active-card::after {
      width: 40px;
    }

    /* Tabelas Listradas (p-datatable-striped do Design System) */
    .p-datatable-striped tbody tr:nth-child(even) {
      background-color: #f8fafc;
    }

    .p-datatable-striped tbody tr:hover {
      background-color: #E7F3FF !important;
    }

    /* Estilos do Quadro Kanban de Fluxo de Demandas */
    .kanban-column {
      min-height: 460px;
      border-radius: 12px;
      transition: background-color 0.2s ease, border-color 0.2s ease;
    }

    .kanban-column.drag-over {
      border-color: #2196f3 !important;
    }

    .kanban-column.drag-over .kanban-dropzone {
      background-color: #E7F3FF !important;
      border-color: #2196f3 !important;
    }

    .kanban-card {
      cursor: grab;
      border-radius: 12px;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .kanban-card:active {
      cursor: grabbing;
    }

    .kanban-card.dragging {
      opacity: 0.45;
      transform: scale(0.97);
    }

    /* Scrollbars discretas */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    ::-webkit-scrollbar-track {
      background: #eff2f5;
    }

    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 9999px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }

    @media print {

        display: none !important;
      }

      }
    }

    *:focus-visible {
      outline: 3px solid #1976d2;

    }

    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
    }

    .custom-scrollbar::-webkit-scrollbar-track {

    }

    .custom-scrollbar::-webkit-scrollbar-thumb {

  <!-- SCRIPT PRINCIPAL DA APLICAÇÃO -->
  <script>
    /*************************************************************************
     * 1. UTILITÁRIOS DE SEGURANÇA, FORMATAÇÃO BRASILEIRA E IDs
     *************************************************************************/
    const Utils = {
      escapeHtml(str) {
        if (str === null || str === undefined) return '';
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      },
      generateId(prefix = 'REG') {
        const ts = Date.now().toString(36).toUpperCase().slice(-4);
        const rnd = Math.random().toString(36).substring(2, 6).toUpperCase();
        return `${prefix}-${ts}${rnd}`;
      },
      todayISO() {
        const d = new Date();
        const yyyy = d.getFullYear();
        const mm = String(d.getMonth() + 1).padStart(2, '0');
        const dd = String(d.getDate()).padStart(2, '0');

      },

        const d = new Date();

      },
      formatDateBR(dateStr) {
        if (!dateStr) return '—';
        if (/^\d{2}\/\d{2}\/\d{4}/.test(dateStr)) return dateStr;
        const parts = String(dateStr).split('T')[0].split('-');
        if (parts.length === 3) return `${parts[2]}/${parts[1]}/${parts[0]}`;
        return dateStr;
      },
      formatBytes(bytes) {
        if (!bytes || isNaN(bytes)) return '0 KB';
        const kb = bytes / 1024;
        if (kb < 1024) return `${kb.toFixed(1)} KB`;
        return `${(kb / 1024).toFixed(2)} MB`;
      }

      setTableSort(viewKey, col) {
        if (!State.tableSorts) State.tableSorts = {};
        if (!State.tableSorts[viewKey]) State.tableSorts[viewKey] = { col: 'id', dir: 'asc' };
        const s = State.tableSorts[viewKey];
        if (s.col === col) {
          s.dir = s.dir === 'asc' ? 'desc' : 'asc';
        } else {
          s.col = col;
          s.dir = 'asc';
        }
        this.renderCurrentView();
      },
      sortItems(items, viewKey) {
        if (!State.tableSorts || !State.tableSorts[viewKey]) return items;
        const { col, dir } = State.tableSorts[viewKey];
        if (!col) return items;
        return [...items].sort((a, b) => {
          let valA = a[col] ?? '';
          let valB = b[col] ?? '';
          if (typeof valA === 'number' && typeof valB === 'number') {
            return dir === 'asc' ? valA - valB : valB - valA;
          }
          valA = String(valA).toLowerCase();
          valB = String(valB).toLowerCase();
          if (valA < valB) return dir === 'asc' ? -1 : 1;
          if (valA > valB) return dir === 'asc' ? 1 : -1;
          return 0;
        });
      },
      getSortIndicator(viewKey, col) {
        const s = State.tableSorts && State.tableSorts[viewKey];
        if (!s || s.col !== col) return '<span class="text-slate-300 ml-1 inline-block text-[11px] font-mono">↕</span>';
        return s.dir === 'asc'
          ? '<span class="text-[#2196f3] ml-1 inline-block font-bold text-[11px]">↑</span>'

      applyUserIdentityString(displayName) {
        if (!displayName || typeof displayName !== 'string') return;
        const clean = displayName.trim();
        if (!clean || clean === 'Colaborador Cagece' || clean === 'cagecedev') return;
        // Padrão oficial Cagece: "NOME COMPLETO - MATRICULA - UNIDADE" (ex: "TALES COSTA PAIVA - 217612 - GETIC")
        const parts = clean.split(' - ').map(p => p.trim()).filter(Boolean);
        if (parts.length >= 3) {
          State.currentUser = `${parts[0]} (${parts[1]})`;
          State.currentUnidade = parts[parts.length - 1];
        } else if (parts.length === 2) {
          State.currentUser = parts[0];
          State.currentUnidade = parts[1];
        } else {
          State.currentUser = clean;
        }
      },

      async syncLoggedUserIdentity() {
        try {
          const cached = JSON.parse(sessionStorage.getItem('azure_current_user') || 'null');
          if (cached && cached.displayName) {
            this.applyUserIdentityString(cached.displayName);
          }
          const authHeader = this.getAzureAuthHeader ? this.getAzureAuthHeader() : '';
          if (!authHeader) return;
          const orgUrl = 'https://dev.azure.com/cagecedev';
          const res = await fetch(`${orgUrl}/_apis/connectionData?connectOptions=includeInheritedDefinitionsOnly&lastChangeId=-1&api-version=7.0`, {
            headers: { 'Authorization': authHeader, 'Accept': 'application/json;api-version=7.0' }
          });
          if (res.status === 200 && res.headers.get('content-type')?.includes('json')) {
            const data = await res.json();
            const u = data?.authenticatedUser;
            const displayName = u?.providerDisplayName || u?.customDisplayName || u?.displayName || '';
            if (displayName && displayName !== 'cagecedev') {
              this.applyUserIdentityString(displayName);
              sessionStorage.setItem('azure_current_user', JSON.stringify({ displayName, uniqueName: u?.uniqueName || '' }));
            }
          }
        } catch (_) {
          // Silencioso caso fora da rede ou bloqueado por CORS
        }
      },

      persistLocalState() {
        try { localStorage.setItem(State.storageKey, JSON.stringify({ db: State.db, gasConfig: State.gasConfig, azureConfig: State.azureConfig, demoModeLoaded: State.demoModeLoaded, demoModeDismissed: State.demoModeDismissed })); }
        catch (err) { console.warn('Local save failed:', err); this.showToast('Nao foi possivel salvar localmente. Exporte um backup para evitar perda de dados.', 'warning'); }
      },

      restoreLocalState() {
        try {
          localStorage.removeItem('azure_pat');
          const saved = JSON.parse(localStorage.getItem(State.storageKey) || 'null');
          if (!saved || !saved.db) return false;
          State.db = { ...State.db, ...saved.db };
          State.gasConfig = { ...State.gasConfig, ...(saved.gasConfig || {}) };
          if (saved.azureConfig) {
            State.azureConfig = { ...State.azureConfig, ...saved.azureConfig };
            State.azureConfig.patToken = '';
            localStorage.setItem(State.storageKey, JSON.stringify({ ...saved, azureConfig: State.azureConfig }));
          }
          State.demoModeLoaded = !!saved.demoModeLoaded;
          State.demoModeDismissed = !!saved.demoModeDismissed;
          return true;
        } catch (err) { console.warn('Local restore failed:', err); return false; }
      },

      exportBackup() {
        const blob = new Blob([JSON.stringify({ exportedAt: Utils.nowBR(), db: State.db }, null, 2)], { type: 'application/json' });
        const link = document.createElement('a'); link.href = URL.createObjectURL(blob); link.download = `PortalRH_backup_${Date.now()}.json`; link.click(); URL.revokeObjectURL(link.href);
      },

      importBackup(input) {
        const file = input.files && input.files[0]; if (!file) return;
        const reader = new FileReader(); reader.onload = () => { try { const parsed = JSON.parse(reader.result); if (!parsed.db || !Array.isArray(parsed.db.modulos)) throw new Error('Formato invalido'); State.db = { ...State.db, ...parsed.db }; this.persistLocalState(); this.updateSidebarCounters(); this.renderCurrentView(); this.showToast('Backup importado com sucesso.'); } catch (err) { this.showToast('Nao foi possivel importar: ' + err.message, 'error'); } }; reader.readAsText(file);
      },

      async loadAllFromGas() {
        try {
          const response = await fetch(State.gasConfig.webAppUrl, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action: 'READ_ALL', role: State.activeRole, user: State.currentUser }) });
          const result = await response.json();
          if (!result.ok || !result.db) throw new Error(result.error || 'Resposta inv\u00e1lida');
          const hasRemoteData = Object.values(result.db).some(value => Array.isArray(value) && value.length > 0);
          State.gasConfig.connected = true;
          if (!hasRemoteData) { this.persistLocalState(); this.showToast('Google conectado; base remota vazia. Use Sincronizar com Google para enviar os registros locais.', 'info'); return; }
          const aliases = { modulos: 'modulos', funcionalidades: 'funcionalidades', regrasNegocio: 'regrasNegocio', demandas: 'demandas', alteracoes: 'alteracoes', historiasUsuario: 'historiasUsuario', criteriosAceitacao: 'criteriosAceitacao', documentos: 'documentos', historico: 'historico' };
          Object.entries(aliases).forEach(([local, remote]) => { if (Array.isArray(result.db[remote])) State.db[local] = result.db[remote]; });
          State.gasConfig.connected = true; this.persistLocalState(); this.updateSidebarCounters(); this.renderCurrentView();
        } catch (err) { console.warn('GAS load failed:', err); }
      },

      async saveAllToGas() {
        if (!State.gasConfig.webAppUrl) return;
        try { const response = await fetch(State.gasConfig.webAppUrl, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action: 'SAVE_ALL', role: State.activeRole, user: State.currentUser, db: State.db }) }); const result = await response.json(); if (!result.ok) throw new Error(result.error || 'Falha ao sincronizar'); State.gasConfig.lastSync = Utils.nowBR(); State.gasConfig.connected = true; this.persistLocalState(); this.showToast('Dados sincronizados com o Google Apps Script.'); } catch (err) { this.showToast('Falha na sincroniza\u00e7\u00e3o: ' + err.message, 'error'); }
      },

      loadDemoData() {
        const demoKeys = ['funcionalidades', 'regrasNegocio', 'demandas', 'alteracoes', 'historiasUsuario', 'criteriosAceitacao', 'documentos', 'historico'];
        demoKeys.forEach(key => {
          const ids = new Set(DEMO_DATASET[key].map(item => item.id));
          State.db[key] = [...State.db[key].filter(item => !ids.has(item.id)), ...JSON.parse(JSON.stringify(DEMO_DATASET[key]))];
        });
        State.demoModeLoaded = true;
        State.demoModeDismissed = false;

      toggleDemoData() {
        if (!State.demoModeLoaded) {
          this.loadDemoData();
          this.showToast('Dados de demonstra??o carregados com identifica??o [DEMO].', 'success');
        } else {
          const demoKeys = ['funcionalidades', 'regrasNegocio', 'demandas', 'alteracoes', 'historiasUsuario', 'criteriosAceitacao', 'documentos', 'historico'];
          demoKeys.forEach(key => { const ids = new Set(DEMO_DATASET[key].map(item => item.id)); State.db[key] = State.db[key].filter(item => !ids.has(item.id)); });
          State.demoModeLoaded = false;
          State.demoModeDismissed = true;
          this.showToast('Dados de demonstra??o removidos.', 'info');
        }
        this.persistLocalState();
        this.updateSidebarCounters();
        this.renderCurrentView();

      logAudit(entidadeTipo, entidadeId, tipoEvento, descricao, snapshotObj = null) {
        const entry = {
          id: Utils.generateId('HIST'),
          entidadeTipo,
          entidadeId,
          dataHora: Utils.nowBR(),
          usuario: `${State.currentUser} (${State.activeRole})`,
          tipoEvento,
          descricao,
          snapshotJson: snapshotObj ? JSON.stringify(snapshotObj) : ''
        };
        State.db.historico.unshift(entry);
        this.persistLocalState();
        this.syncWithGasBackend('APPEND_AUDIT', entry);
        this.updateSidebarCounters();
      },

      async syncWithGasBackend(action, payload) {
        if (!State.gasConfig.webAppUrl) return;
        try {
          const res = await fetch(State.gasConfig.webAppUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({
              action,
              role: State.activeRole,
              user: State.currentUser,
              payload
            })
          });
          const data = await res.json();
          if (data && data.ok) {
            State.gasConfig.lastSync = Utils.nowBR();
            this.persistLocalState();
          }
        } catch (err) {
          console.warn('Falha na comunicação com o Google Apps Script:', err);
        }
      },

      updateSidebarCounters() {
        const setCount = (id, val) => {
          const el = document.getElementById(id);
          if (el) el.textContent = val;
        };
        setCount('nav-count-demandas', State.db.demandas.filter(d => !d.excluido).length);
        setCount('nav-count-funcionalidades', State.db.funcionalidades.filter(f => !f.excluido).length);
        setCount('nav-count-historias', State.db.historiasUsuario.length);
        setCount('nav-count-documentos', State.db.documentos.filter(d => d.situacao !== 'Removido').length);
        setCount('nav-count-auditoria', State.db.historico.length);
      },

      navigate(view, param = null) {
        State.currentView = view;
        if (view === 'modulo-detalhe' && param) {
          State.selectedModuleId = param;
        }
        document.querySelectorAll('.nav-btn').forEach(btn => {
          const isMatch = btn.dataset.nav === view || (view === 'modulo-detalhe' && btn.dataset.nav === 'dashboard');
          if (isMatch) {
            btn.className = 'nav-btn w-full flex items-center justify-between px-3 py-2.5 rounded-[8px] text-[13px] font-semibold bg-[#2196f3] text-white shadow-xs transition';
          } else {
            btn.className = 'nav-btn w-full flex items-center justify-between px-3 py-2.5 rounded-[8px] text-[13px] font-medium text-slate-600 hover:bg-slate-100 transition';
          }
        });
        this.renderCurrentView();
        // Fecha o menu mobile automaticamente ao navegar
        if (window.innerWidth < 1024) {
          const mobileNav = document.getElementById('mobile-nav');
          if (mobileNav) mobileNav.classList.add('hidden');
        }
        window.scrollTo({ top: 0, behavior: 'smooth' });
      },

      navigateToModuleSection(section, moduleId) {
        const modScope = moduleId && moduleId !== 'TODOS' ? moduleId : 'TODOS';
        if (section === 'funcionalidades') {
          State.listFilters['funcionalidades'] = { ...(State.listFilters['funcionalidades'] || {}), module: modScope };
          this.navigate('funcionalidades');
        } else if (section === 'demandas') {
          State.filters.moduloId = modScope;
          this.navigate('demandas');
        } else if (section === 'historias') {
          State.listFilters['historias'] = { ...(State.listFilters['historias'] || {}), module: modScope };
          this.navigate('historias');
        } else if (section === 'alteracoes' || section === 'auditoria') {
          const mod = modScope !== 'TODOS' ? State.db.modulos.find(m => m.id === modScope) : null;
          State.auditoriaFilters = {
            entidade: 'TODAS',

      initResizer() {
        const leftPanel = document.getElementById("left-panel");
        const dragHandle = document.getElementById("drag-handle");
        const container = document.getElementById("master-detail-container");
        if (!dragHandle || !leftPanel || !container) return;

        if (State.leftPanelWidth) {
          leftPanel.style.width = `${State.leftPanelWidth}px`;
        }

        let isDragging = false;
        dragHandle.onmousedown = (e) => {
          isDragging = true;
          document.body.style.cursor = "col-resize";
          document.body.style.userSelect = "none";
          e.preventDefault();
        };

        const onMouseMove = (e) => {
          if (!isDragging) return;
          const containerRect = container.getBoundingClientRect();
          let newWidth = e.clientX - containerRect.left;
          const minWidth = 260;
          const maxWidth = 550;
          if (newWidth >= minWidth && newWidth <= maxWidth) {
            leftPanel.style.width = `${newWidth}px`;
            State.leftPanelWidth = newWidth;
          }
        };

        const onMouseUp = () => {
          if (isDragging) {
            isDragging = false;
            document.body.style.cursor = "default";
            document.body.style.userSelect = "auto";
          }
        };

        if (window.__resizerMove) document.removeEventListener("mousemove", window.__resizerMove);
        if (window.__resizerUp) document.removeEventListener("mouseup", window.__resizerUp);
        window.__resizerMove = onMouseMove;
        window.__resizerUp = onMouseUp;
        document.addEventListener("mousemove", onMouseMove);
        document.addEventListener("mouseup", onMouseUp);
      },

      renderCurrentView() {
        const active = document.activeElement;
        const focusId = active && active.id;
        let selectionStart = null, selectionEnd = null;
        try { if (active && typeof active.selectionStart === 'number') { selectionStart = active.selectionStart; selectionEnd = active.selectionEnd; } } catch (_) { }
        const container = document.getElementById('main-view-container');
        if (!container) return;

        try {
          switch (State.currentView) {
            case 'dashboard':
              container.innerHTML = Views.renderDashboard();
              break;
            case 'modulo-detalhe':
              container.innerHTML = Views.renderModuloDetalhe(State.selectedModuleId);
              break;
            case 'demandas':
              container.innerHTML = Views.renderDemandas();
              if (this.getAzureAuthHeader()) setTimeout(() => this.refreshAzureRouting(true), 0);
              if (!this.azureRoutingTimer) this.azureRoutingTimer = setInterval(() => {
                if (State.currentView === 'demandas') this.refreshAzureRouting(true);
              }, 60000);
              break;
            case 'planejamento-dev':
              container.innerHTML = Views.renderDevPlanning();
              if (this.getAzureAuthHeader() && !this.devPlanningFilter?.owner && !this.devPlanningFilter?.title && !this.devPlanningFilter?.id) setTimeout(() => this.refreshDevPlanningQueue(true), 0);
              break;
            case 'funcionalidades':
              container.innerHTML = Views.renderFuncionalidades();
              break;
            case 'alteracoes':
              container.innerHTML = Views.renderAuditoria();
              break;
            case 'historias':
              container.innerHTML = Views.renderHistorias();
              break;
            case 'documentos':
              container.innerHTML = Views.renderDocumentos();
              break;
            case 'auditoria':
              container.innerHTML = Views.renderAuditoria();
              break;
            case 'relatorios':
              container.innerHTML = Views.renderRelatorios();
              break;
            case 'integracao':
              container.innerHTML = Views.renderIntegracao();
              break;

              container.innerHTML = Views.renderRoteiroAceite();

          container.innerHTML = `
            <div class="p-6 bg-rose-50 border border-rose-200 rounded-xl text-rose-800 text-xs space-y-2">
              <h3 class="font-bold text-sm">Falha ao carregar visão</h3>
              <p>${Utils.escapeHtml(renderErr.message || String(renderErr))}</p>

            </div>
          `;
        }
        if (focusId) { const replacement = document.getElementById(focusId); if (replacement) { replacement.focus({ preventScroll: true }); if (selectionStart !== null && replacement.setSelectionRange) replacement.setSelectionRange(selectionStart, selectionEnd); } }
        try { if (typeof lucide !== 'undefined') lucide.createIcons(); } catch (_) {}
        this.applyRoleVisibility();
      },

      handleGlobalSearch(query) {
        const box = document.getElementById('global-search-results');
        const clearBtn = document.getElementById('clear-global-search');
        const q = (query || '').trim().toLowerCase();

        if (!q) {
          box.classList.add('hidden');
          clearBtn.classList.add('hidden');
          return;
        }
        clearBtn.classList.remove('hidden');

        const results = [];

        // 1. Módulos
        State.db.modulos.forEach(m => {
          if (m.nome.toLowerCase().includes(q) || (m.descricao || '').toLowerCase().includes(q)) {
            results.push({
              tipo: 'Módulo do Portal RH',
              badge: 'bg-cyan-100 text-rh-cyan',
              id: m.id,
              titulo: m.nome,
              sub: m.descricao,
              action: `Views.selectDashboardModule('${m.id}')`
            });
          }
        });

        // 2. Demandas / SGD
        State.db.demandas.filter(d => !d.excluido).forEach(d => {
          if (
            d.sgd.toLowerCase().includes(q) ||
            d.titulo.toLowerCase().includes(q) ||
            (d.descricao || '').toLowerCase().includes(q) ||
            (d.solicitante || '').toLowerCase().includes(q) ||
            (d.responsavel || '').toLowerCase().includes(q)
          ) {
            results.push({
              tipo: `Chamado / ${d.sgd}`,
              badge: 'bg-amber-100 text-amber-800',
              id: d.id,
              titulo: d.titulo,
              sub: `${this.getModuleName(d.moduloId)} • Status: ${d.status} • Resp: ${d.responsavel || 'Não atribuído'}`,
              action: `App.openDemandaDetailModal('${d.id}')`
            });
          }
        });

        // 3. Funcionalidades e Regras de Negócio
        State.db.funcionalidades.filter(f => !f.excluido).forEach(f => {
          if (
            f.nome.toLowerCase().includes(q) ||
            (f.descricaoFuncional || '').toLowerCase().includes(q) ||
            (f.objetivo || '').toLowerCase().includes(q)
          ) {
            results.push({
              tipo: 'Funcionalidade',
              badge: 'bg-emerald-100 text-emerald-800',
              id: f.id,
              titulo: f.nome,
              sub: `${this.getModuleName(f.moduloId)} • Situação: ${f.situacao}`,
              action: `App.openFuncionalidadeDetailModal('${f.id}')`
            });
          }
        });

        State.db.regrasNegocio.forEach(rn => {
          if (rn.codigo.toLowerCase().includes(q) || rn.titulo.toLowerCase().includes(q) || rn.descricao.toLowerCase().includes(q)) {
            results.push({
              tipo: `Regra de Negócio (${rn.codigo})`,
              badge: 'bg-purple-100 text-purple-800',
              id: rn.id,
              titulo: rn.titulo,
              sub: rn.descricao,
              action: `App.openFuncionalidadeDetailModal('${rn.funcionalidadeId}')`
            });
          }
        });

        // 4. Alterações
        State.db.alteracoes.filter(a => !a.excluido).forEach(a => {
          if (a.titulo.toLowerCase().includes(q) || (a.sgdOrigem || '').toLowerCase().includes(q) || (a.comportamentoNovo || '').toLowerCase().includes(q)) {
            results.push({
              tipo: 'Alteração / Evolução',
              badge: 'bg-blue-100 text-blue-800',
              id: a.id,
              titulo: a.titulo,
              sub: `${this.getModuleName(a.moduloId)} • ${a.status} • Origem: ${a.sgdOrigem || '—'}`,
              action: `App.openAlteracaoDetailModal('${a.id}')`
            });
          }
        });

        // 5. Histórias de Usuários
        State.db.historiasUsuario.forEach(h => {
          if (h.titulo.toLowerCase().includes(q) || h.acaoQuero.toLowerCase().includes(q)) {
            results.push({
              tipo: 'História de Usuário',
              badge: 'bg-indigo-100 text-indigo-800',
              id: h.id,
              titulo: h.titulo,
              sub: `Como ${h.perfilComo}, quero ${h.acaoQuero}...`,
              action: `App.openHistoriaDetailModal('${h.id}')`
            });
          }
        });

        // 6. Documentos e Histórico
        State.db.documentos.filter(doc => doc.situacao !== 'Removido').forEach(doc => {
          if (doc.nomeOriginal.toLowerCase().includes(q) || (doc.descricao || '').toLowerCase().includes(q)) {
            results.push({
              tipo: `Documento (${doc.categoria})`,
              badge: 'bg-slate-200 text-slate-700',
              id: doc.id,
              titulo: doc.nomeOriginal,
              sub: doc.descricao,
              action: `App.navigate('documentos')`
            });
          }
        });

        if (results.length === 0) {
          box.innerHTML = `<div class="p-4 text-center text-xs text-slate-500">Nenhum registro encontrado para "<strong>${Utils.escapeHtml(query)}</strong>".</div>`;
        } else {
          box.innerHTML = `
            <div class="text-[11px] font-semibold text-slate-400 px-2 pb-2 border-b border-slate-100">
              ${results.length} resultado(s) localizado(s) na base de conhecimento
            </div>
            <div class="divide-y divide-slate-100 mt-1">
              ${results.map(r => `
                <button onclick="${r.action}; App.clearGlobalSearch();" class="w-full text-left p-2.5 hover:bg-slate-50 rounded-xl transition flex items-start justify-between gap-3">
                  <div>
                    <div class="flex items-center gap-2 mb-0.5">
                      <span class="px-2 py-0.5 rounded text-[10px] font-bold ${r.badge}">${Utils.escapeHtml(r.tipo)}</span>
                      <span class="text-[11px] font-mono text-slate-400">${Utils.escapeHtml(r.id)}</span>
                    </div>
                    <div class="text-xs font-semibold text-slate-800">${Utils.escapeHtml(r.titulo)}</div>
                    <div class="text-[11px] text-slate-500 line-clamp-1">${Utils.escapeHtml(r.sub || '')}</div>
                  </div>
                  <i data-lucide="arrow-up-right" class="w-4 h-4 text-slate-400 shrink-0 mt-1"></i>
                </button>
              `).join('')}
            </div>
          `;
        }
        box.classList.remove('hidden');
        lucide.createIcons();
      },

      refreshDemandLinkOptions() {
        const moduleId = document.getElementById('dem-modulo')?.value;
        const fill = (select, items, emptyLabel) => {
          if (!select) return;
          const current = select.value;
          select.innerHTML = '';
          select.add(new Option(emptyLabel, ''));
          items.forEach(item => select.add(new Option(item.titulo || item.nome, item.id)));
          select.value = items.some(item => item.id === current) ? current : '';
        };
        fill(document.getElementById('dem-func'), State.db.funcionalidades.filter(item => !item.excluido && item.moduloId === moduleId), 'Sem funcionalidade vinculada');

      getRequesterFieldOptions(project, field, savedValue = '') {
        const cached = State.azureConfig?.cachedCustomFieldOptions?.[project]?.[field] || [];
        const live = !!this.getAzureAuthHeader() && State.azureConfig?.cachedCustomFieldOptions?.[project]?.source === 'azure';
        const fallback = REQUESTER_FIELD_CATALOG[field] || [];
        return [...new Set([...(live && cached.length ? cached : fallback), savedValue].map(value => String(value || '').trim()).filter(Boolean))];
      },

      applyRequesterAzureFields(project) {
        const data = State.azureConfig?.cachedCustomFieldOptions?.[project];
        if (!data || data.source !== 'azure') return;
        const fill = (id, values, preferred) => {
          const select = document.getElementById(id);
          if (!select) return;
          const previous = select.value || preferred || '';
          select.innerHTML = '<option value="">Selecione...</option>' + values.map(value => `<option value="${Utils.escapeHtml(value)}">${Utils.escapeHtml(value)}</option>`).join('');
          if (values.includes(previous)) select.value = previous;
        };
        const demand = State.db.demandas.find(item => item.id === this.currentEditingDemandaId);
        fill('dem-azure-system', data.sistema, demand?.azureSystem);
        fill('dem-azure-activity-type', data.activityType, demand?.azureActivityType);
        this.handleActivityTypeChange();
        const note = document.getElementById('dem-azure-field-source');
        if (note) note.textContent = `Sistema e Tipo de Atividade consultados no PBI PO do Azure: ${project}. O módulo vem do catálogo do Portal RH.`;
      },

      async loadRequesterAzureFields(project) {
        const authHeader = this.getAzureAuthHeader();
        if (!authHeader || !project) return false;
        const orgUrl = 'https://dev.azure.com/cagecedev';
        for (const type of ['PBI PO']) {
          try {
            const res = await fetch(`${orgUrl}/${encodeURIComponent(project)}/_apis/wit/workitemtypes/${encodeURIComponent(type)}/fields?$expand=all&api-version=7.1`, { headers: { Authorization: authHeader, Accept: 'application/json' } });
            if (!res.ok) continue;
            const fields = (await res.json()).value || [];
            const findValues = name => (fields.find(field => this.normalizeDemoFieldValue(field.name) === this.normalizeDemoFieldValue(name))?.allowedValues || []).map(String);
            const data = { sistema: findValues('Sistema'), activityType: findValues('Tipo Atividade'), source: 'azure', workItemType: type };
            if (!data.sistema.length || !data.activityType.length) continue;

      excludeDemanda(demandaId) {
        if (!this.hasWritePermission()) {
          this.showToast('Seu perfil não tem permissão para excluir demandas.', 'warning');
          return false;
        }
        const demand = State.db.demandas.find(item => item.id === demandaId && !item.excluido);
        if (!demand) {
          this.showToast('A demanda não foi encontrada ou já foi excluída.', 'warning');
          return false;
        }
        const confirmed = confirm(`Excluir a demanda SGD ${demand.sgd} — ${demand.titulo}?\n\nEla será arquivada no Portal RH e deixará de aparecer nas listas. O Work Item existente no Azure não será excluído.`);
        if (!confirmed) return false;

        const before = { ...demand };
        demand.excluido = true;
        demand.atualizadoEm = Utils.nowBR();
        this.logAudit('DEMANDA', demand.id, 'Exclusão lógica da demanda', `Demanda SGD ${demand.sgd} arquivada no Portal RH. O Work Item Azure ${demand.azureItemId ? `#${demand.azureItemId} foi mantido` : 'não se aplica'}.`, before);
        this.syncWithGasBackend('UPSERT_DEMANDA', demand);
        this.persistLocalState();
        this.updateSidebarCounters();
        this.closeModal();
        this.renderCurrentView();
        this.showToast(`Demanda SGD ${demand.sgd} excluída do Portal RH.`, 'success');
        return true;
      },

      sgdLookupTimeout: null,
      lastFetchedSgd: '',

      extractCleanSgdDescription(cleanSgd, rawText) {
        if (!rawText) return '';
        let text = String(rawText)
          .replace(/<[^>]*>?/gm, ' ')
          .replace(/&nbsp;/gi, ' ')
          .replace(/\s+/g, ' ')
          .trim();
        const prefixRegex = new RegExp(`^(?:\\[?\\s*SGD\\s*[-#]?\\s*(?:20\\d{2}[-/])?\\s*${cleanSgd}\\s*\\]?|\\[\\s*${cleanSgd}\\s*\\])\\s*[-:–—]?\\s*`, 'i');
        text = text.replace(prefixRegex, '').trim();
        return text;
      },

      extractSummarizedTitleFromSgdText(cleanText) {
        if (!cleanText) return '';
        const text = String(cleanText).trim();
        const firstSentenceMatch = text.match(/^([^.!?\n\r]{10,130})[.!?\n\r]/);
        if (firstSentenceMatch && firstSentenceMatch[1]) {
          return firstSentenceMatch[1].trim();
        }
        if (text.length <= 120) return text;
        const truncated = text.slice(0, 120);
        const lastSpace = truncated.lastIndexOf(' ');
        return (lastSpace > 50 ? truncated.slice(0, lastSpace) : truncated).trim();
      },

      inferModuleAndTypeFromSgdText(rawText) {
        const text = String(rawText || '').toLowerCase();
        let inferredModuloId = '';
        let inferredTipo = '';

        // 1. Inferência inteligente de Módulo entre os 13 Módulos do Portal RH
        const moduleKeywords = [
          { id: 'MOD-04', keywords: ['férias', 'ferias', 'abono pecuniário', 'período aquisitivo', 'periodo aquisitivo', 'período concessivo', 'programação de férias', 'gozo de férias', 'cancelamento de férias'] },
          { id: 'MOD-06', keywords: ['frequência', 'frequencia', 'ponto', 'espelho de ponto', 'banco de horas', 'hora extra', 'batida', 'jornada', 'abono de falta', 'ocorrência de ponto', 'fechamento de frequência'] },
          { id: 'MOD-08', keywords: ['demonstrativo', 'contracheque', 'holerite', 'informe de rendimentos', 'rendimento', 'envelope de pagamento', 'ficha financeira'] },
          { id: 'MOD-05', keywords: ['vale', 'vales', 'vale-transporte', 'vale transporte', 'vale-alimentação', 'vale alimentação', 'vale-refeição', 'benefício', 'beneficio', 'auxílio'] },
          { id: 'MOD-07', keywords: ['desempenho', 'avaliação de desempenho', 'avaliacao de desempenho', 'metas', 'calibragem', 'ciclo avaliativo', 'competências'] },
          { id: 'MOD-02', keywords: ['feedback', 'feedbacks', 'retorno contínuo', 'elogio'] },
          { id: 'MOD-03', keywords: ['desenvolvimento de pessoas', 'pdi', 'plano de desenvolvimento', 'trilha de aprendizagem'] },
          { id: 'MOD-13', keywords: ['t&d', 'treinamento', 'capacitação', 'capacitacao', 'curso', 'certificado', 'inscrição em curso', 'portal t&d'] },
          { id: 'MOD-10', keywords: ['plano de cargos', 'cargo', 'carreira', 'progressão', 'promoção', 'enquadramento', 'tabela salarial', 'pccs'] },
          { id: 'MOD-11', keywords: ['banco de talentos', 'talento', 'currículo', 'curriculo', 'certificação', 'recrutamento interno', 'seleção interna'] },
          { id: 'MOD-01', keywords: ['eleição', 'eleicoes', 'eleições', 'votação', 'votacao', 'cipa', 'comissão eleitoral', 'apuração de votos'] },
          { id: 'MOD-09', keywords: ['manual', 'manuais', 'política', 'politica', 'regulamento', 'act', 'acordo coletivo', 'normativo', 'norma interna'] },
          { id: 'MOD-12', keywords: ['prsp', 'programa de desligamento', 'aposentadoria', 'sucessão'] }
        ];

        for (const entry of moduleKeywords) {
          if (entry.keywords.some(kw => text.includes(kw))) {
            inferredModuloId = entry.id;
            break;
          }
        }

        // Fallback pelo nome do módulo cadastrado em State.db.modulos
        if (!inferredModuloId && Array.isArray(State.db.modulos)) {
          const directMod = State.db.modulos.find(m => text.includes(m.nome.toLowerCase()));
          if (directMod) inferredModuloId = directMod.id;
        }

        // 2. Inferência inteligente do Tipo de Demanda
        if (/(erro|falha|bug|exception|travando|não funciona|nao funciona|não carrega|nao carrega|problema ao|corrigir|correção|correcao|inconsistência|inconsistencia)/i.test(text)) {
          inferredTipo = /(indisponível|fora do ar|crítico|urgente|parou|bloqueio total)/i.test(text) ? 'Incidente' : 'Correção';
        } else if (/(criar novo|criar nova|nova funcionalidade|novo módulo|nova tela|novo relatório|implementar novo|desenvolver novo)/i.test(text)) {
          inferredTipo = 'Nova funcionalidade';
        } else if (/(lei|decreto|norma|act|acordo coletivo|esocial|legislação|legislacao|portaria)/i.test(text)) {
          inferredTipo = 'Atualização normativa';
        } else if (/(regra de negócio|regra de negocio|cálculo|calculo|fórmula|formula|validação de saldo|validacao)/i.test(text)) {
          inferredTipo = 'Ajuste de regra de negócio';
        } else if (/(dúvida|duvida|como fazer|orientação|orientacao|esclarecimento|consulta)/i.test(text)) {
          inferredTipo = 'Dúvida';
        } else if (/(melhoria|melhorar|ajustar|ajuste|alterar|alteração|alteracao|incluir campo|adicionar coluna|otimizar|atualizar)/i.test(text)) {
          inferredTipo = 'Melhoria';
        }

        return { inferredModuloId, inferredTipo };
      },

      getAzureAuthHeader() {
        const rawPat = sessionStorage.getItem('azure_pat') || '';
        const clean = String(rawPat)
          .replace(/[\u200B-\u200D\uFEFF]/g, '')
          .replace(/["']/g, '')
          .replace(/Bearer\s+/i, '')
          .replace(/Basic\s+/i, '')
          .trim();
        if (!clean) return '';
        if (clean.startsWith('eyJ')) return `Bearer ${clean}`;
        return `Basic ${btoa(':' + clean)}`;
      },

        const input = window.prompt('Cole o PAT do Azure DevOps para esta sessão:', '');
        if (input?.trim()) this.loginAzurePat(input.trim());

        const poBadge = document.getElementById('po-pat-status-badge');
        if (poBadge) poBadge.textContent = connected ? '🔑 Azure conectado' : '⚠️ Azure desconectado';

      openAzureLoginModal() {
        const body = `<div class="space-y-3 text-sm text-slate-700">
          <p>Use seu PAT do Azure DevOps para consultar as listas reais do piloto. O token fica apenas nesta sessão do navegador.</p>

        </div>`;
