          if (filters.title && !String(f['System.Title'] || '').toLowerCase().includes(filters.title.trim().toLowerCase())) return false;
          if (filters.owner === '__unassigned__' && ownerName) return false;
          if (filters.owner && filters.owner !== '__unassigned__' && App.normalizeDemoFieldValue(ownerKey) !== App.normalizeDemoFieldValue(filters.owner) && App.normalizeDemoFieldValue(ownerName) !== App.normalizeDemoFieldValue(filters.owner) && (!selectedMember || App.normalizeDemoFieldValue(ownerName) !== App.normalizeDemoFieldValue(selectedMember.displayName))) return false;
          if (filters.team && f['System.WorkItemType'] !== 'PBI PO' && (App.devPlanningTeamAreas || []).length && !(App.devPlanningTeamAreas || []).some(area => String(f['System.AreaPath'] || '').startsWith(area))) return false;
          if (filters.status && App.normalizeDemoFieldValue(f['System.BoardColumn'] || f['System.State']) !== App.normalizeDemoFieldValue(filters.status)) return false;
          return true;
        });
        return `<div class="space-y-5">
          <div class="flex flex-wrap items-start justify-between gap-3">
            <div><h1 class="text-2xl font-bold text-slate-900">Planejamento do Dev</h1><p class="text-sm text-slate-600 mt-1">Busque as demandas de um desenvolvedor e abra a avaliação de esforço pela coluna Ações.</p></div>
            <button type="button" onclick="App.refreshDevPlanningQueue()" class="rounded-lg bg-blue-600 px-4 py-2 text-xs font-semibold text-white hover:bg-blue-700">Atualizar do Azure</button>
          </div>
          <div class="rounded-xl border border-slate-200 bg-white p-4 space-y-3 text-xs">
            <h2 class="font-bold text-sm text-slate-900">Parâmetros de consulta</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-5 gap-3">
              <label class="font-semibold text-slate-700">ID do card<input id="dev-filter-id" value="${Utils.escapeHtml(filters.id || '')}" placeholder="Ex.: 42166" class="mt-1 w-full rounded-lg border border-slate-300 p-2" /></label>
              <label class="font-semibold text-slate-700">Título ou palavra-chave<input id="dev-filter-title" value="${Utils.escapeHtml(filters.title || '')}" placeholder="Buscar no título" class="mt-1 w-full rounded-lg border border-slate-300 p-2" /></label>
              <label class="font-semibold text-slate-700">Time / Board<select id="dev-filter-team" onchange="App.loadDevFilterMembers(this.value)" class="mt-1 w-full rounded-lg border border-slate-300 bg-white p-2"><option value="">Todos os times</option>${(App.devPlanningTeams || []).map(team => `<option value="${Utils.escapeHtml(team.name)}" ${filters.team === team.name ? 'selected' : ''}>${Utils.escapeHtml(team.name)}</option>`).join('')}</select></label>
              <label class="font-semibold text-slate-700">Responsável<select id="dev-filter-owner" class="mt-1 w-full rounded-lg border border-slate-300 bg-white p-2"><option value="">Todos os responsáveis</option><option value="__unassigned__" ${filters.owner === '__unassigned__' ? 'selected' : ''}>Não atribuídas</option>${owners.map(person => `<option value="${Utils.escapeHtml(person.uniqueName || person.displayName)}" ${filters.owner === (person.uniqueName || person.displayName) ? 'selected' : ''}>${Utils.escapeHtml(person.displayName)}</option>`).join('')}</select></label>
              <label class="font-semibold text-slate-700">Status<select id="dev-filter-status" class="mt-1 w-full rounded-lg border border-slate-300 bg-white p-2"><option value="">Todos os status</option>${['New', 'Em atendimento', 'In Progress', 'Active', 'Done'].map(status => `<option value="${status}" ${filters.status === status ? 'selected' : ''}>${status}</option>`).join('')}</select></label>
            </div>
            <div class="flex flex-wrap justify-end gap-2"><button type="button" onclick="App.clearDevPlanningFilters()" class="rounded-lg border border-slate-300 bg-slate-50 px-3 py-2 font-semibold text-slate-700">Limpar filtros</button><button type="button" onclick="App.searchDevPlanning()" class="rounded-lg bg-slate-800 px-4 py-2 font-semibold text-white">Buscar</button></div>
          </div>
          <div class="overflow-x-auto rounded-xl border border-slate-200 bg-white"><div class="border-b border-slate-200 px-4 py-3 font-bold text-xs text-slate-800">Cards listados (${visible.length})</div><table class="min-w-full text-xs"><thead class="bg-slate-50 text-left text-slate-600"><tr><th class="px-4 py-3">ID</th><th class="px-4 py-3">Título</th><th class="px-4 py-3">Responsável</th><th class="px-4 py-3">Status</th><th class="px-4 py-3">Effort</th><th class="px-4 py-3">Horas</th><th class="px-4 py-3 text-right">Ações</th></tr></thead><tbody class="divide-y divide-slate-100">
            ${visible.length ? visible.map(item => {
              const f = item.fields || {};
              const owner = f['System.AssignedTo'];
              const ownerName = owner?.displayName || (typeof owner === 'string' ? owner : 'Não atribuída');
              const type = f['System.WorkItemType'] || '';
              return `<tr><td class="px-4 py-3 font-bold text-blue-700">#${Utils.escapeHtml(item.id)}</td><td class="px-4 py-3 min-w-[280px]"><span class="font-semibold text-slate-800">${Utils.escapeHtml(f['System.Title'] || 'Sem título')}</span><span class="mt-1 block text-[10px] text-slate-500">${Utils.escapeHtml(type)} · SGD ${Utils.escapeHtml(f['Custom.SGD'] || '')}</span></td><td class="px-4 py-3">${Utils.escapeHtml(ownerName)}</td><td class="px-4 py-3">${Utils.escapeHtml(f['System.BoardColumn'] || f['System.State'] || '')}</td><td class="px-4 py-3">${Utils.escapeHtml(f['Microsoft.VSTS.Scheduling.Effort'] ?? '—')}</td><td class="px-4 py-3">${Utils.escapeHtml(f['Microsoft.VSTS.Scheduling.OriginalEstimate'] ?? '—')}</td><td class="px-4 py-3 text-right whitespace-nowrap"><button type="button" onclick="App.openPortalDemandByAzureItem('${Utils.escapeHtml(item.id)}', '${Utils.escapeHtml(f['Custom.SGD'] || '')}')" class="rounded-lg border border-slate-300 px-2.5 py-1.5 text-slate-600 hover:bg-slate-50" title="Abrir demanda do solicitante no Portal">Consultar demanda</button> <button type="button" onclick="App.openDevPlanning('${Utils.escapeHtml(item.id)}')" class="rounded-lg bg-indigo-600 px-2.5 py-1.5 font-semibold text-white hover:bg-indigo-700" title="Análise Dev: atribuir desenvolvedor e avaliar esforço">&lt;/&gt; Análise Dev</button></td></tr>`;
            }).join('') : `<tr><td colspan="7" class="p-8 text-center text-slate-500">${App.devPlanningLoading ? 'Consultando o Azure...' : 'Nenhuma demanda encontrada para os filtros escolhidos.'}</td></tr>`}
          </tbody></table></div>
        </div>`;
      },
      // 6.3 MÓDULO DE GESTÃO DE CHAMADOS E DEMANDAS (KANBAN, TABELA E CARTÕES + FILTROS COMBINADOS)
      renderDemandas() {
        const f = State.filters;
        if (f.status === 'Aberta') f.status = 'Aguardando análise do PO';
        const list = State.db.demandas.filter(d => {
          if (d.excluido) return false;
          if (f.moduloId !== 'TODOS' && d.moduloId !== f.moduloId) return false;
          if (f.status !== 'TODOS' && d.status !== f.status && !(f.status === 'Aguardando análise do PO' && d.status === 'Aberta')) return false;
          if (f.prioridade !== 'TODOS' && d.prioridade !== f.prioridade) return false;
          if (f.buscaTexto) {
            const q = f.buscaTexto.toLowerCase();
            const match = d.sgd.toLowerCase().includes(q) || d.titulo.toLowerCase().includes(q) || d.solicitante.toLowerCase().includes(q) || d.responsavel.toLowerCase().includes(q);
            if (!match) return false;
          }
          return true;
        });

        const canceladasCount = list.filter(d => d.status === 'Não atendida / Cancelada').length;

        const kanbanStages = [
          {
            status: 'Aguardando análise do PO',
            titulo: '1. Aguardando atendimento',
            subtitulo: 'Análise do PO e Azure New',
            icon: 'inbox',
            headerBg: 'bg-slate-100 border-slate-300 text-slate-800',
            dotColor: 'bg-slate-500'
          },
          {
            status: 'Em atendimento',
            titulo: '2. Em Atendimento',
            subtitulo: 'Especificação e execução (Dev)',
            icon: 'wrench',
            headerBg: 'bg-cyan-50 border-cyan-300 text-rh-cyanDark',
            dotColor: 'bg-rh-cyan'
          },
          {
            status: 'Em homologação',
            titulo: '3. Em Homologação',
            subtitulo: 'Validação e testes de aceite',
            icon: 'flask-conical',
            headerBg: 'bg-indigo-50 border-indigo-300 text-indigo-900',
            dotColor: 'bg-indigo-500'
          },
          {
            status: 'Concluída',
            titulo: '4. Concluídas / Entregues',
            subtitulo: 'Publicadas e documentadas',
            icon: 'check-circle-2',
            headerBg: 'bg-emerald-50 border-emerald-300 text-emerald-900',
            dotColor: 'bg-emerald-500'
          }
        ];

        const priorityBadge = (p) => {
          if (p === 'Crítica') return 'bg-rose-100 text-rose-800 border-rose-200';
          if (p === 'Alta') return 'bg-amber-100 text-amber-800 border-amber-200';
          if (p === 'Média') return 'bg-cyan-50 text-rh-cyanDark border-cyan-200';
          return 'bg-slate-100 text-slate-600 border-slate-200';
        };

        return `
          <div class="space-y-5">
            <div class="flex flex-wrap items-center justify-between gap-4">

                    <i data-lucide="kanban" class="w-3.5 h-3.5"></i> Quadro Kanban
                  </button>
                  <button onclick="State.filters.demandaViewMode = 'table'; App.renderCurrentView();" class="px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-1.5 transition ${f.demandaViewMode === 'table' ? 'bg-rh-cyan text-white shadow-xs' : 'text-slate-600 hover:bg-slate-100'}">
                    <i data-lucide="table-2" class="w-3.5 h-3.5"></i> Tabela
                  </button>
                  <button onclick="State.filters.demandaViewMode = 'cards'; App.renderCurrentView();" class="px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-1.5 transition ${f.demandaViewMode === 'cards' ? 'bg-rh-cyan text-white shadow-xs' : 'text-slate-600 hover:bg-slate-100'}">
                    <i data-lucide="layout-grid" class="w-3.5 h-3.5"></i> Cartões
                  </button>
                </div>
                <button onclick="App.openDemandaModal()" class="require-write px-4 py-2 rounded-xl bg-rh-cyan hover:bg-rh-cyanDark text-white text-xs font-semibold flex items-center gap-1.5 shadow-xs">
                  <i data-lucide="plus-circle" class="w-4 h-4"></i> Nova Demanda

                <button onclick="App.refreshAzureRouting()" class="px-3 py-2 rounded-xl bg-blue-50 hover:bg-blue-100 text-blue-700 border border-blue-200 text-xs font-semibold">Atualizar do Azure</button>

            <!-- Barra de Filtros Combinados -->
            <div class="bg-white p-4 rounded-xl shadow-rh-quadrant border border-slate-200/90 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3 text-xs">
              <input type="text" value="${Utils.escapeHtml(f.buscaTexto)}" oninput="State.filters.buscaTexto = this.value; App.renderCurrentView();" placeholder="Filtrar por SGD, título, solicitante ou responsável..." class="px-3 py-2 rounded-lg border border-slate-300" />
              <select onchange="State.filters.moduloId = this.value; App.renderCurrentView();" class="px-3 py-2 rounded-lg border border-slate-300">
                <option value="TODOS">Todos os 13 Módulos</option>
                ${State.db.modulos.map(m => `<option value="${m.id}" ${f.moduloId === m.id ? 'selected' : ''}>${Utils.escapeHtml(m.nome)}</option>`).join('')}
              </select>
              <select onchange="State.filters.status = this.value; App.renderCurrentView();" class="px-3 py-2 rounded-lg border border-slate-300">
                <option value="TODOS">Todas as Etapas do Fluxo (Status)</option>
                ${['Aguardando análise do PO', 'Aguardando direcionamento do Dev', 'Em atendimento', 'Em homologação', 'Concluída', 'Não atendida / Cancelada'].map(s => `<option value="${s}" ${f.status === s ? 'selected' : ''}>${s}</option>`).join('')}
              </select>
              <select onchange="State.filters.prioridade = this.value; App.renderCurrentView();" class="px-3 py-2 rounded-lg border border-slate-300">
                <option value="TODOS">Todas as Prioridades</option>
                ${['Baixa', 'Média', 'Alta', 'Crítica'].map(p => `<option value="${p}" ${f.prioridade === p ? 'selected' : ''}>${p}</option>`).join('')}
              </select>
            </div>

            ${f.demandaViewMode === 'kanban' && canceladasCount > 0 ? `
              <div class="px-4 py-2.5 rounded-xl bg-rose-50/80 border border-rose-200 text-xs text-rose-900 flex flex-wrap items-center justify-between gap-2">
                <span class="flex items-center gap-2 font-medium">
                  <i data-lucide="archive" class="w-4 h-4 text-rose-600"></i>
                  Existem <strong>${canceladasCount}</strong> demanda(s) com status <strong>Não atendida / Cancelada</strong> arquivadas fora do quadro operacional.

                <button onclick="State.filters.demandaViewMode = 'table'; State.filters.status = 'Não atendida / Cancelada'; App.renderCurrentView();" class="px-2.5 py-1 rounded-lg bg-white border border-rose-300 text-rose-800 hover:bg-rose-100 font-semibold text-[11px] transition">

            ${list.length === 0 && f.status === 'TODOS' && !f.buscaTexto && f.moduloId === 'TODOS' && f.prioridade === 'TODOS' ? `

              </div>
            ` : f.demandaViewMode === 'kanban' ? `
              <!-- VISÃO 1: QUADRO KANBAN DE CRIAÇÃO E ATENDIMENTO (4 COLUNAS DO FLUXO DE VALOR) -->
              <div class="overflow-x-auto pb-3">
                <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-4 gap-5">
                  ${kanbanStages.map((stage, stageIdx) => {
          const colItems = list.filter(d => {
            if (stage.status === 'Aguardando análise do PO') return ['Aguardando análise do PO', 'Aguardando direcionamento do Dev', 'Aberta'].includes(d.status);
            if (stage.status === 'Em atendimento') {
              return d.status === 'Em atendimento' || d.status === 'Aguardando informações';
            }
            return d.status === stage.status;
          });
          const prevStage = stageIdx > 0 ? kanbanStages[stageIdx - 1].status : null;
          const nextStage = stageIdx < kanbanStages.length - 1 ? kanbanStages[stageIdx + 1].status : null;

          return `
                      <div
                        ondragover="App.handleKanbanDragOver(event)"
                        ondragleave="App.handleKanbanDragLeave(event)"

                        class="kanban-column bg-white rounded-xl border border-slate-200/95 shadow-rh-quadrant flex flex-col p-3.5 space-y-3"

                          <div>

                              <i data-lucide="${stage.icon}" class="w-4 h-4 shrink-0"></i>

                            </div>
                            <p class="text-[10px] opacity-80 mt-0.5">${stage.subtitulo}</p>

                          <span class="px-2 py-0.5 rounded-full bg-white text-slate-800 font-bold text-xs shadow-2xs border border-slate-200/70">
                            ${colItems.length}
                          </span>

                        <!-- Lista de Cartões da Coluna + Slot Compacto de Drag & Drop -->
                        <div class="flex-1 space-y-2.5">

                            <div class="kanban-dropzone h-32 rounded-xl bg-[#f1f5f9] border border-dashed border-slate-300 flex flex-col items-center justify-center p-4 text-center text-[11px] text-slate-500 transition-colors">
                              <i data-lucide="move" class="w-4 h-4 mb-1.5 text-[#2196f3]/80"></i>
                              <span>Arraste uma demanda para <strong>${stage.status}</strong></span>
                            </div>
                          ` : colItems.map(d => {
            const hasUS = State.db.historiasUsuario.some(u => u.demandaId === d.id);
            const hasAlt = State.db.alteracoes.some(a => !a.excluido && (a.demandaId === d.id || a.sgdOrigem === d.sgd));
            const anexosCount = State.db.documentos.filter(doc => doc.entidadeId === d.id && doc.situacao !== 'Removido').length;

            let roleBadge = '';
            let roleActionBtn = '';

            if (d.status === 'Aberta' || d.status === 'Aguardando análise do PO') {

              roleActionBtn = `<button onclick="App.openDemandaModal('${d.id}', null, null, 'po')" title="Análise PO" class="require-write px-2 py-1 text-amber-900 hover:bg-amber-100 bg-amber-50 rounded-lg border border-amber-300 font-semibold text-[11px] flex items-center gap-1 transition shadow-2xs">
                                <i data-lucide="shield-check" class="w-3.5 h-3.5 text-amber-600"></i>
                                <span>Análise PO</span>
                              </button>`;
            } else if (d.status === 'Aguardando direcionamento do Dev') {
              roleBadge = `<span class="px-2 py-0.5 rounded-full bg-amber-100 text-amber-900 border border-amber-300 font-bold text-[10px]">No Azure: aguardando início</span>`;
              roleActionBtn = d.azureItemId ? `<button type="button" onclick="App.openKanbanDevAction('${d.id}')" class="px-2.5 py-1.5 rounded-lg bg-indigo-600 text-white border border-indigo-600 hover:bg-indigo-700 text-[11px] font-semibold" title="Análise Dev: atribuir desenvolvedor e avaliar esforço">&lt;/&gt; Análise Dev</button>` : '';
            } else if (d.status === 'Em atendimento' || d.status === 'Aguardando informações') {
              roleBadge = `<span class="px-2 py-0.5 rounded-full bg-purple-100 text-purple-900 border border-purple-300 font-bold text-[10px] flex items-center gap-1 shrink-0" title="Execução acompanhada pelo Azure Boards"><i data-lucide="code-2" class="w-3 h-3 text-purple-600"></i> Em atendimento no Azure</span>`;
              roleActionBtn = '';
            } else if (d.status === 'Em homologação') {
              roleBadge = `<span class="px-2 py-0.5 rounded-full bg-sky-100 text-sky-900 border border-sky-300 font-bold text-[10px] flex items-center gap-1 shrink-0" title="Aguardando homologação pelo usuário solicitante"><i data-lucide="check-circle-2" class="w-3 h-3 text-sky-600"></i> Aguardando Homologação</span>`;
              roleActionBtn = `<button onclick="App.openDemandaModal('${d.id}', null, null, 'homologacao')" title="Homologar (Usuário)" class="require-write px-2 py-1 text-sky-900 hover:bg-sky-100 bg-sky-50 rounded-lg border border-sky-300 font-semibold text-[11px] flex items-center gap-1 transition shadow-2xs">
                                <i data-lucide="check-circle-2" class="w-3.5 h-3.5 text-sky-600"></i>
                                <span>Homologar</span>

            } else if (d.status === 'Concluída') {
              roleBadge = `<span class="px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-900 border border-emerald-300 font-bold text-[10px] flex items-center gap-1 shrink-0"><i data-lucide="check" class="w-3 h-3 text-emerald-600"></i> Concluída</span>`;
              roleActionBtn = `<button onclick="App.openDemandaModal('${d.id}')" title="Editar Registro da Demanda" class="require-write px-2 py-1 text-emerald-900 hover:bg-emerald-100 bg-emerald-50 rounded-lg border border-emerald-300 font-semibold text-[11px] flex items-center gap-1 transition shadow-2xs">
                                <i data-lucide="edit" class="w-3.5 h-3.5 text-emerald-600"></i>
                                <span>Editar</span>
                              </button>`;
            } else {
              roleBadge = `<span class="px-2 py-0.5 rounded-full bg-rose-100 text-rose-900 border border-rose-300 font-bold text-[10px] flex items-center gap-1 shrink-0"><i data-lucide="x-circle" class="w-3 h-3 text-rose-600"></i> Cancelada</span>`;
              roleActionBtn = `<button onclick="App.openDemandaModal('${d.id}')" title="Editar Registro da Demanda" class="require-write px-2 py-1 text-rose-900 hover:bg-rose-100 bg-rose-50 rounded-lg border border-rose-300 font-semibold text-[11px] flex items-center gap-1 transition shadow-2xs">
                                <i data-lucide="edit" class="w-3.5 h-3.5 text-rose-600"></i>
                                <span>Editar</span>
                              </button>`;
            }

            return `
                              <div
                                draggable="true"
                                ondragstart="App.handleKanbanDragStart(event, '${d.id}')"
                                ondragend="App.handleKanbanDragEnd(event)"

                              >
                                <div class="space-y-2">
                                  <!-- Topo do Cartão: SGD + Prioridade do Lado Esquerdo; Status de Responsabilidade no Lado Direito -->
                                  <div class="flex items-center justify-between gap-1">
                                    <div class="flex items-center gap-1.5 min-w-0">
                                      <button onclick="App.openDemandaDetailModal('${d.id}')" class="px-2 py-0.5 rounded bg-rh-cyanLight text-rh-cyan font-bold text-[11px] hover:underline shrink-0">

                        </span>
                      </th>
                      <th class="py-3 px-3.5 font-semibold text-xs text-white whitespace-nowrap">
                        <span class="inline-flex items-center gap-1">

                          <svg class="w-3.5 h-3.5 inline-block ml-1 opacity-90 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M7 16V4m0 0L3 8m4-4l4 4m6 4v12m0 0l4-4m-4 4l-4-4"/></svg>

                          </td>
                          <td class="py-3.5 px-3.5 whitespace-nowrap text-slate-600 font-mono text-xs">

                          <td class="py-3.5 px-3.5 text-right whitespace-nowrap space-x-1.5">

                              <svg class="w-4 h-4 inline" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                            </button>
                            <a href="${doc.driveUrl || '#'}" target="_blank" title="Baixar / Abrir Arquivo" class="p-1 text-[#0284c7] hover:text-[#0369a1] hover:bg-sky-50 rounded transition inline-block">
                              <svg class="w-4 h-4 inline" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>

      // 6.8 TRILHA DE AUDITORIA PERSISTENTE
      renderAuditoria() {
        const filters = State.auditoriaFilters || { entidade: 'TODAS', tipoEvento: 'TODOS', buscaTexto: '' };
        const rawList = State.db.historico || [];

        const filtered = rawList.filter(item => {
          if (filters.entidade !== 'TODAS' && item.entidadeTipo !== filters.entidade) return false;
          if (filters.tipoEvento !== 'TODOS' && item.tipoEvento !== filters.tipoEvento) return false;
          if (filters.buscaTexto) {
            const q = filters.buscaTexto.toLowerCase();
            const match = (item.descricao && item.descricao.toLowerCase().includes(q)) ||
              (item.usuario && item.usuario.toLowerCase().includes(q)) ||
              (item.entidadeId && item.entidadeId.toLowerCase().includes(q)) ||
              (item.tipoEvento && item.tipoEvento.toLowerCase().includes(q));
            if (!match) return false;
          }
          return true;
        });

        // Statistics counts
        const totalEventos = rawList.length;
        const totalDemandas = rawList.filter(h => h.entidadeTipo === 'DEMANDA').length;
        const totalRegras = rawList.filter(h => h.entidadeTipo === 'REGRA_NEGOCIO' || h.entidadeTipo === 'FUNCIONALIDADE').length;
        const usuariosUnicos = [...new Set(rawList.map(h => h.usuario).filter(Boolean))].length;

        // Distinct action types
        const actionTypes = [...new Set(rawList.map(h => h.tipoEvento).filter(Boolean))];

        const getEntityBadge = (tipo) => {
          switch (tipo) {
            case 'DEMANDA':
              return { label: 'Demanda SGD', bg: 'bg-[#E7F3FF]', text: 'text-[#1976d2]', icon: 'ticket' };
            case 'FUNCIONALIDADE':
              return { label: 'Funcionalidade', bg: 'bg-emerald-50', text: 'text-emerald-700', icon: 'book-open' };
            case 'REGRA_NEGOCIO':
              return { label: 'Regra de Negócio', bg: 'bg-purple-50', text: 'text-purple-700', icon: 'shield-check' };
            case 'DOCUMENTO':
              return { label: 'Documento / Anexo', bg: 'bg-amber-50', text: 'text-amber-800', icon: 'paperclip' };
            case 'HISTORIA_USUARIO':
              return { label: 'História BDD', bg: 'bg-indigo-50', text: 'text-indigo-700', icon: 'file-text' };
            default:
              return { label: tipo, bg: 'bg-slate-100', text: 'text-slate-700', icon: 'history' };
          }
        };

        return `
          <div class="space-y-6">
            <!-- Header da Linha do Tempo de Auditoria -->
            <div class="flex flex-wrap items-center justify-between gap-4">
              <div>
                <h2 class="text-lg font-bold text-slate-800">Linha do Tempo e Trilha de Auditoria Imutável</h2>
                <p class="text-xs text-slate-500">Rastreabilidade cronológica completa de eventos de governança, alterações de status e evolução do Portal RH.</p>
              </div>
              <div class="flex items-center gap-2">
                <button onclick="App.exportBackup()" class="px-3.5 py-2 rounded-xl bg-white border border-slate-200 text-slate-700 hover:bg-slate-50 text-xs font-semibold flex items-center gap-1.5 shadow-2xs transition">
                  <i data-lucide="download" class="w-3.5 h-3.5"></i> Exportar Auditoria (JSON)
                </button>
              </div>
            </div>

            <!-- KPIs de Auditoria -->
            <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 text-xs">
              <div class="p-3.5 rounded-xl bg-white border border-slate-200 shadow-2xs">
                <span class="text-slate-400 font-medium block">Total de Eventos</span>
                <span class="text-xl font-bold text-slate-800 font-mono tabular-nums mt-0.5 block">${totalEventos}</span>
              </div>
              <div class="p-3.5 rounded-xl bg-white border border-slate-200 shadow-2xs">
                <span class="text-slate-400 font-medium block">Demandas Rastreadas</span>
                <span class="text-xl font-bold text-[#1976d2] font-mono tabular-nums mt-0.5 block">${totalDemandas}</span>
              </div>
              <div class="p-3.5 rounded-xl bg-white border border-slate-200 shadow-2xs">
                <span class="text-slate-400 font-medium block">Regras & Specs</span>
                <span class="text-xl font-bold text-purple-700 font-mono tabular-nums mt-0.5 block">${totalRegras}</span>
              </div>
              <div class="p-3.5 rounded-xl bg-white border border-slate-200 shadow-2xs">
                <span class="text-slate-400 font-medium block">Atores / Usuários</span>
                <span class="text-xl font-bold text-emerald-600 font-mono tabular-nums mt-0.5 block">${usuariosUnicos}</span>
              </div>
            </div>

            <!-- Barra de Filtros da Auditoria -->
            <div class="bg-white p-3.5 rounded-xl border border-slate-200 shadow-2xs grid grid-cols-1 sm:grid-cols-3 gap-3 text-xs">
              <div class="relative">
                <input
                  type="text"
                  value="${Utils.escapeHtml(filters.buscaTexto || '')}"
                  oninput="App.setAuditoriaFilter('buscaTexto', this.value)"
                  placeholder="Buscar por termo, usuário ou código..."
                  class="w-full pl-9 pr-3 py-2 rounded-lg border border-slate-300 text-xs focus:outline-none focus:ring-1 focus:ring-[#2196f3]"
                />
                <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-2.5 top-2.5"></i>
              </div>
              <select
                onchange="App.setAuditoriaFilter('entidade', this.value)"
                class="px-3 py-2 rounded-lg border border-slate-300 text-xs font-medium text-slate-700 focus:outline-none focus:ring-1 focus:ring-[#2196f3]"
              >
                <option value="TODAS">Todas as Entidades</option>
                <option value="DEMANDA" ${filters.entidade === 'DEMANDA' ? 'selected' : ''}>Demandas SGD</option>
                <option value="FUNCIONALIDADE" ${filters.entidade === 'FUNCIONALIDADE' ? 'selected' : ''}>Funcionalidades</option>
                <option value="REGRA_NEGOCIO" ${filters.entidade === 'REGRA_NEGOCIO' ? 'selected' : ''}>Regras de Negócio</option>
                <option value="DOCUMENTO" ${filters.entidade === 'DOCUMENTO' ? 'selected' : ''}>Documentos e Anexos</option>
                <option value="HISTORIA_USUARIO" ${filters.entidade === 'HISTORIA_USUARIO' ? 'selected' : ''}>Histórias de Usuário</option>
              </select>
              <select
                onchange="App.setAuditoriaFilter('tipoEvento', this.value)"
                class="px-3 py-2 rounded-lg border border-slate-300 text-xs font-medium text-slate-700 focus:outline-none focus:ring-1 focus:ring-[#2196f3]"
              >
                <option value="TODOS">Todos os Tipos de Ação</option>
                ${actionTypes.map(at => `<option value="${Utils.escapeHtml(at)}" ${filters.tipoEvento === at ? 'selected' : ''}>${Utils.escapeHtml(at)}</option>`).join('')}
              </select>
            </div>

            <!-- LINHA DO TEMPO CRONOLÓGICA VERTICAL -->
            ${filtered.length === 0 ? `
              <div class="bg-white rounded-xl p-10 text-center border border-slate-200/80 space-y-2">
                <div class="w-10 h-10 rounded-full bg-slate-100 text-slate-400 flex items-center justify-center mx-auto">
                  <i data-lucide="history" class="w-5 h-5"></i>
                </div>
                <h3 class="font-bold text-slate-800 text-sm">Nenhum evento corresponde aos filtros selecionados</h3>
                <p class="text-xs text-slate-500">Tente limpar a busca textual ou selecionar "Todas as Entidades" para visualizar a linha completa.</p>
              </div>
            ` : `
              <div class="relative pl-6 sm:pl-8 border-l-2 border-slate-200 ml-4 sm:ml-6 space-y-6 py-2">
                ${filtered.map((h, idx) => {
          const badge = getEntityBadge(h.entidadeTipo);
          let snapshot = null;
          try {
            if (h.snapshotJson) snapshot = JSON.parse(h.snapshotJson);
          } catch (_) { }

          return `
                    <div class="relative group">
                      <!-- Marcador do nó na linha -->
                      <div class="absolute -left-[33px] sm:-left-[41px] top-1.5 w-6 h-6 rounded-full ${badge.bg} border-2 border-white shadow-2xs flex items-center justify-center text-xs">
                        <i data-lucide="${badge.icon}" class="w-3 h-3 ${badge.text}"></i>
                      </div>

                      <!-- Cartão do Evento -->
                      <div class="bg-white rounded-xl border border-slate-200 p-4 shadow-2xs hover:border-[#2196f3]/50 transition space-y-2.5">
                        <div class="flex flex-wrap items-center justify-between gap-2 border-b border-slate-100 pb-2.5">
                          <div class="flex items-center gap-2">
                            <span class="px-2 py-0.5 rounded-[6px] ${badge.bg} ${badge.text} font-bold text-[11px] flex items-center gap-1">
                              <i data-lucide="${badge.icon}" class="w-3 h-3"></i> ${badge.label}
                            </span>
                            <span class="font-mono text-xs font-semibold text-slate-700 bg-slate-100 px-2 py-0.5 rounded">
                              ${Utils.escapeHtml(h.entidadeId)}
                            </span>
                          </div>
                          <div class="flex items-center gap-3 text-[11px] text-slate-500 font-mono tabular-nums">
                            <span>${Utils.escapeHtml(h.dataHora)}</span>
                            <span class="inline-flex items-center gap-1 text-slate-600 bg-slate-50 px-2 py-0.5 rounded border border-slate-100 font-sans">
                              <i data-lucide="user" class="w-3 h-3 text-slate-400"></i> ${Utils.escapeHtml(h.usuario)}
                            </span>
                          </div>
                        </div>

                        <div>
                          <h4 class="font-bold text-slate-800 text-[13px] flex items-center gap-1.5">
                            <span class="text-[#1976d2]">${Utils.escapeHtml(h.tipoEvento)}</span>
                          </h4>
                          <p class="text-xs text-slate-600 mt-1 leading-relaxed">
                            ${Utils.escapeHtml(h.descricao)}
                          </p>
                        </div>

                        <!-- Diff Visual de Alteração de Estado (se houver de/para) -->
                        ${snapshot && (snapshot.de || snapshot.para) ? `
                          <div class="p-2.5 rounded-lg bg-slate-50 border border-slate-200 text-xs flex flex-wrap items-center gap-2">
                            <span class="text-slate-500 font-semibold text-[11px]">Transição:</span>
                            <span class="px-2 py-0.5 rounded bg-rose-50 text-rose-700 border border-rose-200 line-through text-[11px]">
                              ${Utils.escapeHtml(snapshot.de || '')}
                            </span>
                            <i data-lucide="arrow-right" class="w-3.5 h-3.5 text-slate-400"></i>
                            <span class="px-2 py-0.5 rounded bg-emerald-50 text-emerald-700 border border-emerald-200 font-semibold text-[11px]">
                              ${Utils.escapeHtml(snapshot.para || '')}
                            </span>
                          </div>
                        ` : snapshot && snapshot.versaoAnterior ? `
                          <div class="p-2 rounded bg-slate-50 border border-slate-200 text-[11px] text-slate-600 flex items-center gap-2 font-mono">
                            <span>Versão: <strike class="text-slate-400">v${snapshot.versaoAnterior}</strike> → <strong class="text-emerald-700">v${snapshot.versaoNova}</strong></span>
                          </div>
                        ` : ''}

                        <!-- Ações Rápidas de Navegação -->
                        <div class="pt-2 flex items-center justify-between text-xs">
                          <span class="text-[10px] text-slate-400 font-mono">ID: ${Utils.escapeHtml(h.id)}</span>
                          <div class="flex items-center gap-2">
                            ${h.entidadeTipo === 'DEMANDA' ? `
                              <button onclick="App.openDemandaDetailModal('${h.entidadeId}')" class="px-2.5 py-1 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-medium transition">
                                Abrir SGD
                              </button>
                            ` : h.entidadeTipo === 'FUNCIONALIDADE' ? `
                              <button onclick="App.openFuncionalidadeDetailModal('${h.entidadeId}')" class="px-2.5 py-1 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-medium transition">
                                Abrir Funcionalidade
                              </button>
                            ` : ''}
                          </div>
                        </div>
                      </div>
                    </div>
                  `;
        }).join('')}
              </div>
            `}
          </div>
        `;
      },

      // 6.9 CENTRAL DE EXPORTAÇÃO DOS 14 RELATÓRIOS
      renderRelatorios() {
        return `
          <div class="space-y-6">
            <div>
              <h2 class="text-lg font-bold text-slate-800">Central de Exportação de Relatórios e Documentos Padronizados</h2>
              <p class="text-xs text-slate-500">Selecione o relatório gerencial ou técnico e exporte em PDF, DOCX, XLSX, CSV ou HTML com os dados reais cadastrados.</p>
            </div>

            <div class="bg-white rounded-2xl p-6 shadow-rh-card border border-slate-200/80 space-y-5 text-xs">
              <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                  <label class="block font-semibold text-slate-700 mb-1">Tipo de Relatório Oficial (1 a 14) *</label>
                  <select id="rep-type" class="w-full px-3 py-2.5 rounded-xl border border-slate-300 font-medium">
                    <option value="R01">1. Inventário de funcionalidades por módulo</option>
                    <option value="R02">2. Relação de chamados por período</option>
                    <option value="R03">3. Demandas abertas, em atendimento e concluídas</option>
                    <option value="R04">4. Histórico de atendimento de um SGD específico</option>
                    <option value="R05">5. Relação de alterações implementadas</option>
                    <option value="R06">6. Melhorias publicadas por módulo</option>
                    <option value="R07">7. Histórico evolutivo de uma funcionalidade</option>
                    <option value="R08">8. Relatório de pendências e demandas atrasadas</option>
                    <option value="R09">9. Relatório de demandas por responsável</option>
                    <option value="R10">10. Catálogo de regras de negócio</option>
                    <option value="R11">11. Documento de especificação funcional</option>
                    <option value="R12">12. Documento de história de usuário</option>
                    <option value="R13">13. Relatório de homologação</option>
                    <option value="R14">14. Relatório consolidado de evolução do Portal RH</option>
                  </select>
                </div>
                <div>
                  <label class="block font-semibold text-slate-700 mb-1">Filtrar por Módulo do Portal RH</label>
                  <select id="rep-modulo" class="w-full px-3 py-2.5 rounded-xl border border-slate-300">
                    <option value="TODOS">Todos os 13 Módulos do Portal RH</option>
                    ${State.db.modulos.map(m => `<option value="${m.id}">${Utils.escapeHtml(m.nome)}</option>`).join('')}
                  </select>
                </div>
              </div>

              <section class="rounded-xl border border-slate-200 bg-slate-50 p-4 space-y-3">
                <p class="text-slate-600">Filtros especificos: escolha um SGD para R04, uma funcionalidade para R07, ou o periodo para R02. A pre-visualizacao aparece antes da exportacao.</p>
                <div class="grid grid-cols-1 md:grid-cols-4 gap-3">
                  <select id="rep-sgd" aria-label="Filtrar por SGD" class="rounded-lg border border-slate-300 bg-white px-3 py-2"><option value="">Todos os SGD</option>${State.db.demandas.map(d => `<option value="${Utils.escapeHtml(d.sgd)}">${Utils.escapeHtml(d.sgd)} - ${Utils.escapeHtml(d.titulo)}</option>`).join('')}</select>
                  <select id="rep-func" aria-label="Filtrar por funcionalidade" class="rounded-lg border border-slate-300 bg-white px-3 py-2"><option value="">Todas as funcionalidades</option>${State.db.funcionalidades.map(f => `<option value="${f.id}">${Utils.escapeHtml(f.nome)}</option>`).join('')}</select>

 * BACKEND OFICIAL — CENTRAL DE DOCUMENTAÇÃO E EVOLUÇÃO DO PORTAL RH
 * Google Apps Script (Code.gs) — Integração Google Planilhas + Google Drive
 */

const CONFIG = {
  SPREADSHEET_ID: 'COLE_AQUI_O_ID_DA_SUA_PLANILHA',
  DRIVE_FOLDER_ID: 'COLE_AQUI_O_ID_DA_PASTA_DO_GOOGLE_DRIVE'
};

const SHEETS_SCHEMA = {
  Modulos: ['id','nome','icone','descricao','ativo','atualizadoEm'],
  Funcionalidades: ['id','moduloId','nome','situacao','versao','responsavel','perfis','objetivo','descricaoFuncional','preCondicoes','dadosEntrada','processamento','dadosSaida','excecoes','dependencias','criadoEm','atualizadoEm','excluido'],

  Demandas: ['id','sgd','titulo','tipo','moduloId','funcionalidadeId','solicitante','unidade','dataAbertura','canal','descricao','problema','resultadoEsperado','prioridade','impacto','responsavel','equipe','status','prazo','solucao','pendencias','versaoEntrega','responsavelHomologacao','resultadoHomologacao','dataConclusao','atualizadoEm','excluido','historiaUsuarioId','azureItemId','azureProject','azureTeam','azureWorkItemType','azureAreaPath','azureIterationPath','azurePoAreaPath','azurePoIterationPath','azureState','azureBoardColumn','azureSystem','azureActivityType','devEffort','devEstimatedHours','devEdsScore','devPlanned'],
  Altera\u00e7\u00f5es: ['id','titulo','status','moduloId','funcionalidadeId','demandaId','sgdOrigem','tipo','comportamentoAnterior','comportamentoNovo','beneficios','impactosModulos','responsavel','versao','dataSolicitacao','dataImplementacao','dataHomologacao','dataPublicacao','versaoRegistro','excluido'],
  Historico: ['id','entidadeTipo','entidadeId','dataHora','usuario','tipoEvento','descricao','snapshotJson'],
  HistoriasUsuario: ['id','titulo','moduloId','demandaId','perfilComo','acaoQuero','beneficioPara','contexto','fluxoPrincipal','prioridade','status','responsavel','versao','criadoEm','atualizadoEm'],
  CriteriosAceitacao: ['id','historiaId','cenario','dado','quando','entao','excluido'],
  Documentos: ['id','nomeOriginal','categoria','moduloId','mimeType','tamanhoBytes','dataEnvio','autor','descricao','entidadeTipo','entidadeId','driveFileId','driveUrl','situacao'],
  Usuarios: ['id','email','nome','perfil','ativo'],
  Configuracoes: ['chave','valor','atualizadoEm']
};

function setupDatabaseSheets() {
  const ss = SpreadsheetApp.openById(CONFIG.SPREADSHEET_ID);
  Object.keys(SHEETS_SCHEMA).forEach(sheetName => {
    let sheet = ss.getSheetByName(sheetName);
    if (!sheet) {
      sheet = ss.insertSheet(sheetName);
      sheet.appendRow(SHEETS_SCHEMA[sheetName]);
      sheet.getRange(1, 1, 1, SHEETS_SCHEMA[sheetName].length).setFontWeight('bold').setBackground('#e0f4f9');
      sheet.setFrozenRows(1);
    } else {
      const current = sheet.getRange(1, 1, 1, Math.max(1, sheet.getLastColumn())).getValues()[0].map(String);
      const missing = SHEETS_SCHEMA[sheetName].filter(header => !current.includes(header));
      if (missing.length) sheet.getRange(1, sheet.getLastColumn() + 1, 1, missing.length).setValues([missing]);
    }
  });
  return { ok: true, message: 'Todas as 11 abas foram criadas e configuradas com sucesso.' };
}

function doPost(e) {
  const lock = LockService.getScriptLock();
  lock.waitLock(15000);
  try {
    const req = JSON.parse(e.postData.contents);
    const email = Session.getActiveUser().getEmail() || req.user || 'usuario_autenticado';
    
    // Controle de permissão no backend
    if (req.role === 'VIEWER' && req.action !== 'READ_ALL') {
      return jsonResponse({ ok: false, error: 'Acesso negado no backend: Perfil de Consulta.' });
    }

    if (req.action === 'SETUP') {
      return jsonResponse(setupDatabaseSheets());
    }
    if (req.action === 'READ_ALL') {
      return jsonResponse({ ok: true, db: readAllSheets() });
    }
    if (req.action === 'SAVE_ALL') {
      saveAllSheets(req.db || {});
      return jsonResponse({ ok: true });
    }
    if (req.action === 'APPEND_AUDIT') {
      appendRowBySchema('Historico', req.payload);
      return jsonResponse({ ok: true });
    }
    if (req.action === 'UPSERT_DEMANDA') {
      upsertRowBySchema('Demandas', req.payload);
      return jsonResponse({ ok: true });
    }
    if (req.action === 'UPLOAD_FILE') {
      const folder = DriveApp.getFolderById(CONFIG.DRIVE_FOLDER_ID);
      const bytes = Utilities.base64Decode(req.payload.base64Data);
      const blob = Utilities.newBlob(bytes, req.payload.mimeType, req.payload.fileName);
      const file = folder.createFile(blob);
      file.setSharing(DriveApp.Access.DOMAIN_WITH_LINK, DriveApp.Permission.VIEW);
      return jsonResponse({ ok: true, driveFileId: file.getId(), driveUrl: file.getUrl() });
    }
    return jsonResponse({ ok: true, user: email });
  } catch (err) {
    return jsonResponse({ ok: false, error: err.toString() });
  } finally {
    lock.releaseLock();
  }
}

function readAllSheets() {
  const ss = SpreadsheetApp.openById(CONFIG.SPREADSHEET_ID);
  const mapping = { Modulos: 'modulos', Funcionalidades: 'funcionalidades', RegrasNegocio: 'regrasNegocio', Demandas: 'demandas', Altera\u00e7\u00f5es: 'alteracoes', Historico: 'historico', HistoriasUsuario: 'historiasUsuario', CriteriosAceitacao: 'criteriosAceitacao', Documentos: 'documentos' };
  const db = {};
  Object.keys(mapping).forEach(name => {
    const sheet = ss.getSheetByName(name);
    if (!sheet || sheet.getLastRow() < 2) { db[mapping[name]] = []; return; }
    const values = sheet.getDataRange().getValues();
    const headers = values.shift().map(String);
    db[mapping[name]] = values.filter(row => row.some(value => value !== '')).map(row => Object.fromEntries(headers.map((header, i) => [header, row[i]])));
  });
  return db;
}

function saveAllSheets(db) {
  setupDatabaseSheets();
  const ss = SpreadsheetApp.openById(CONFIG.SPREADSHEET_ID);
  const mapping = { Modulos: 'modulos', Funcionalidades: 'funcionalidades', RegrasNegocio: 'regrasNegocio', Demandas: 'demandas', Altera\u00e7\u00f5es: 'alteracoes', Historico: 'historico', HistoriasUsuario: 'historiasUsuario', CriteriosAceitacao: 'criteriosAceitacao', Documentos: 'documentos' };
  Object.keys(mapping).forEach(name => {
    const sheet = ss.getSheetByName(name);
    if (!sheet) return;
    const headers = SHEETS_SCHEMA[name];
    const rows = (db[mapping[name]] || []).map(record => headers.map(header => record[header] === undefined ? '' : record[header]));
    sheet.clearContents();
    sheet.getRange(1, 1, 1, headers.length).setValues([headers]);
    if (rows.length) sheet.getRange(2, 1, rows.length, headers.length).setValues(rows);
    sheet.setFrozenRows(1);
  });
}
function appendRowBySchema(sheetName, obj) {
  const ss = SpreadsheetApp.openById(CONFIG.SPREADSHEET_ID);
  const sheet = ss.getSheetByName(sheetName);
  const headers = SHEETS_SCHEMA[sheetName];
  const row = headers.map(h => obj[h] !== undefined ? obj[h] : '');
  sheet.appendRow(row);
}

function upsertRowBySchema(sheetName, obj) {
  const ss = SpreadsheetApp.openById(CONFIG.SPREADSHEET_ID);
  const sheet = ss.getSheetByName(sheetName);
  const headers = SHEETS_SCHEMA[sheetName];
  const data = sheet.getDataRange().getValues();
  const row = headers.map(h => obj[h] !== undefined ? obj[h] : '');
  for (let i = 1; i < data.length; i++) {
    if (data[i][0] === obj.id || (sheetName === 'Demandas' && data[i][1] === obj.sgd)) {
      sheet.getRange(i + 1, 1, 1, headers.length).setValues([row]);
      return;
    }
  }
  sheet.appendRow(row);
}

function jsonResponse(obj) {
  return ContentService.createTextOutput(JSON.stringify(obj)).setMimeType(ContentService.MimeType.JSON);
}`;

              <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div>
                  <label class="block font-semibold text-slate-700 mb-1">URL do Web App (Google Apps Script)</label>
                  <input type="url" id="gas-webapp-url" value="${Utils.escapeHtml(State.gasConfig.webAppUrl)}" placeholder="https://script.google.com/macros/s/.../exec" class="w-full px-3 py-2 rounded-xl border border-slate-300" />
                </div>
                <div>
                  <label class="block font-semibold text-slate-700 mb-1">ID da Planilha Google (Referência)</label>
                  <input type="text" id="gas-sheet-id" value="${Utils.escapeHtml(State.gasConfig.spreadsheetId)}" placeholder="ID contido na URL da planilha" class="w-full px-3 py-2 rounded-xl border border-slate-300" />
                </div>
                <div>
                  <label class="block font-semibold text-slate-700 mb-1">ID da Pasta no Google Drive (Referência)</label>
                  <input type="text" id="gas-folder-id" value="${Utils.escapeHtml(State.gasConfig.driveFolderId)}" placeholder="ID da pasta de anexos" class="w-full px-3 py-2 rounded-xl border border-slate-300" />
                </div>
              </div>
              <button onclick="App.saveGasConnection()" class="px-4 py-2 rounded-xl bg-rh-cyan hover:bg-rh-cyanDark text-white font-semibold">Salvar e Conectar Endpoint</button>
            </div>

            <!-- Código Completo do Google Apps Script -->
            <div class="bg-white rounded-2xl p-6 shadow-rh-card border border-slate-200/80 space-y-3">
              <div class="flex items-center justify-between">
                <h3 class="font-bold text-sm text-slate-800">Código Completo do Backend Google Apps Script (<code>Code.gs</code>)</h3>
                <button onclick="App.copyGasScript()" class="px-3 py-1.5 rounded-xl bg-slate-800 text-white font-semibold flex items-center gap-1.5">
                  <i data-lucide="copy" class="w-3.5 h-3.5"></i> Copiar Código Code.gs
                </button>
              </div>
              <textarea id="gas-code-textarea" readonly rows="14" class="w-full p-4 rounded-xl bg-slate-900 text-cyan-300 font-mono text-[11px] focus:outline-none">${Utils.escapeHtml(gasCode)}</textarea>
            </div>

            <!-- Instruções Passo a Passo (1 a 10) e Limitações Conhecidas -->
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
              <div class="bg-white rounded-2xl p-6 shadow-rh-card border border-slate-200/80 space-y-2">
                <h3 class="font-bold text-sm text-slate-800 mb-2">Guia de Instalação, Publicação e Backup (10 Passos)</h3>
                <ol class="list-decimal list-inside space-y-1.5 text-slate-600 leading-relaxed">
                  <li><strong>Criar a Planilha:</strong> Acesse <code>sheets.new</code> no Google Workspace da organização e nomeie como <em>BD_Portal_RH_Evolucao</em>.</li>
                  <li><strong>Configurar Abas e Cabeçalhos:</strong> A função <code>setupDatabaseSheets()</code> do código acima cria automaticamente as 11 abas padronizadas (<code>Modulos</code>, <code>Funcionalidades</code>, <code>Demandas</code>, <code>Altera\u00e7\u00f5es</code>, <code>Historico</code>, <code>HistoriasUsuario</code>, <code>CriteriosAceitacao</code>, <code>Documentos</code>, <code>RegrasNegocio</code>, <code>Usuarios</code> e <code>Configuracoes</code>).</li>
                  <li><strong>Criar Pasta no Google Drive:</strong> Crie uma pasta restrita à equipe de RH e copie o ID final da URL.</li>
                  <li><strong>Configurar o Google Apps Script:</strong> Na planilha, clique em <em>Extensões &gt; Apps Script</em>, cole o código <code>Code.gs</code> acima e preencha <code>SPREADSHEET_ID</code> e <code>DRIVE_FOLDER_ID</code>.</li>
                  <li><strong>Implantar como Aplicativo da Web:</strong> Clique em <em>Implantar &gt; Nova implantação &gt; App da Web</em>.</li>
                  <li><strong>Configurar Autorização e Permissões:</strong> Defina "Quem pode acessar" como <em>Somente usuários da mesma organização/domínio</em>.</li>
                  <li><strong>Conectar Frontend ao Backend:</strong> Cole a URL <code>/exec</code> gerada no campo acima e clique em "Salvar e Conectar Endpoint".</li>
                  <li><strong>Testar a Integração:</strong> Execute a função <code>setupDatabaseSheets</code> uma vez no editor do Apps Script e cadastre uma demanda de teste.</li>
                  <li><strong>Publicar a Aplicação:</strong> Hospede este arquivo <code>index.html</code> em servidor interno da organização ou diretamente via <code>HtmlService</code> do Apps Script.</li>
                  <li><strong>Cópias de Segurança e Recuperação:</strong> Ative o histórico de versões do Google Planilhas e agende um gatilho semanal (Trigger Time-driven) para gerar cópia da planilha na pasta de backup.</li>
                </ol>
              </div>

              <div class="bg-white rounded-2xl p-6 shadow-rh-card border border-slate-200/80 space-y-3">
                <h3 class="font-bold text-sm text-slate-800">Limitações Conhecidas e Evoluções Futuras</h3>
                <ul class="list-disc list-inside space-y-2 text-slate-600 leading-relaxed">
                  <li><strong>Quotas do Google Apps Script:</strong> O tempo máximo por execução do GAS é de 6 minutos e o payload de upload via POST é recomendado até 15 MB por arquivo.</li>
                  <li><strong>Concorrência em Planilhas:</strong> O script utiliza <code>LockService.getScriptLock()</code> para enfileirar gravações simultâneas, mas para volumes superiores a 50.000 registros recomenda-se migrar o adaptador do <code>DataRepository</code> para PostgreSQL ou Cloud SQL sem necessidade de alterar a interface.</li>
                  <li><strong>LGPD e Privacidade:</strong> Evite anexar espelhos de ponto ou contracheques reais contendo CPF/dados bancários sem tarja de anonimização nas evidências de homologação.</li>
                </ul>
              </div>
            </div>
          </div>
        `;
      },

      // 6.11 ROTEIRO DE TESTES FUNCIONAIS E VERIFICAÇÃO DOS 14 CRITÉRIOS DE ACEITE
      renderRoteiroAceite() {
        const criterios = [
          '1. Visualizar e navegar pelos 13 módulos oficiais do Portal RH (Eleições a Portal T&D).',
          '2. Cadastrar uma demanda com número do SGD, solicitante, data, descrição e responsável.',
          '3. Consultar, filtrar (por módulo, status, prioridade, texto) e editar demandas em Tabela ou Cartões.',
          '4. Registrar alterações de status e preservar o histórico na linha do tempo.',
          '5. Documentar funcionalidades e adicionar suas regras de negócio.',
          '6. Relacionar chamados, funcionalidades, alterações e histórias de usuários.',
          '7. Anexar documentos e evidências com validação de tipo/tamanho e vínculo ao Google Drive.',
          '8. Persistir e recuperar dados no Google Planilhas via Google Apps Script.',
          '9. Gerar histórias de usuários editáveis no padrão Como/Quero/Para e Dado/Quando/Então.',
          '10. Exportar os 14 relatórios nos formatos PDF, DOCX, XLSX, CSV e HTML.',
          '11. Consultar o histórico evolutivo completo de uma funcionalidade.',
          '12. Utilizar a interface responsiva em computador, tablet e celular.',
          '13. Identificar claramente erros, pendências, modo de demonstração e configurações ausentes.',
          '14. Restringir o acesso conforme o perfil ativo (Administrador, Analista/Editor, Consulta).'
        ];

        return `
          <div class="space-y-6 text-xs">
            <div class="bg-white rounded-2xl p-6 shadow-rh-card border border-slate-200/80 space-y-4">
              <h2 class="text-lg font-bold text-slate-800">Roteiro de Testes Funcionais e Checklist dos 14 Critérios de Aceite</h2>
              <p class="text-slate-600">Utilize este roteiro interativo para validar cada entrega obrigatória do sistema.</p>
              <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                ${criterios.map(c => `
                  <label class="p-3 rounded-xl bg-slate-50 border border-slate-200 flex items-start gap-2.5 cursor-pointer hover:bg-rh-cyanLight/30 transition">
                    <input type="checkbox" checked class="mt-0.5 rounded text-rh-cyan focus:ring-rh-cyan" />
                    <span class="text-slate-700 font-medium">${Utils.escapeHtml(c)}</span>
                  </label>
                `).join('')}
              </div>
            </div>
          </div>
        `;
      }
    };

    // Inicializa a aplicação após o carregamento da janela
    function bootApp() {
      try {
        if (window.__app_initialized__) return;
        window.__app_initialized__ = true;
        App.init();
      } catch (err) {
        console.error('Erro na inicialização do App:', err);
      }
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', bootApp);
    } else {
      bootApp();
    }
    window.addEventListener('load', bootApp);
  </script>
</body>

</html>
