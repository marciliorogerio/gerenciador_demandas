              <div class="space-y-3">${criteria.map((entry, i) => `<div class="rounded-xl border border-slate-200 bg-slate-50 p-3"><div class="mb-2 flex flex-wrap items-center justify-between gap-2"><h5 class="font-bold text-slate-800">${i + 1}. ${Utils.escapeHtml(entry[1])} · peso ${i === 3 ? '1' : '2'}</h5><span id="dev-eds-status-${entry[0]}" class="rounded bg-amber-50 px-2 py-1 text-amber-700">Não selecionado</span></div><select id="dev-eds-${entry[0]}" class="sr-only" aria-label="${Utils.escapeHtml(entry[1])}"><option value="">Selecione...</option>${entry.slice(2).map((name, n) => `<option value="${n + 1}" ${Number(f[refs[i]]) === n + 1 ? 'selected' : ''}>${n + 1} · ${Utils.escapeHtml(name)}</option>`).join('')}</select><div class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-4 gap-2">${entry.slice(2).map((name, n) => `<button type="button" data-eds-group="${entry[0]}" data-eds-value="${n + 1}" onclick="App.chooseDevEdsOption('${entry[0]}', ${n + 1})" class="rounded-lg border border-slate-200 bg-white p-3 text-left hover:border-indigo-400"><strong class="block text-slate-900">${n + 1} · ${Utils.escapeHtml(name.split(':')[0])}</strong><span class="mt-1 block text-[11px] leading-relaxed text-slate-600">${Utils.escapeHtml(name.split(':').slice(1).join(':').trim())}</span></button>`).join('')}</div></div>`).join('')}</div>
            </section></div>
            <div id="dev-plan-step-3" class="hidden space-y-3"><section class="space-y-3">
              <h4 class="text-sm font-bold text-slate-900">3. Resumo e memória de cálculo</h4><div id="dev-eds-breakdown" class="grid grid-cols-1 sm:grid-cols-2 gap-2"></div>
              <div id="dev-plan-review" class="rounded-xl border border-slate-200 bg-white p-3 text-slate-700"></div>
              <div id="dev-eds-scale" class="grid grid-cols-2 sm:grid-cols-4 xl:grid-cols-7 gap-1.5"></div>
              <p id="dev-eds-split-alert" class="hidden rounded-lg border border-amber-300 bg-amber-50 p-3 font-semibold text-amber-900">Demanda estimada em 8h ou mais. Avalie se faz sentido dividi-la ou abrir uma análise prévia.</p>
              <div class="rounded-xl border border-slate-200 bg-slate-50 p-3"><p id="dev-eds-result" class="font-semibold text-slate-800">Selecione os quatro critérios.</p><div class="mt-3 grid grid-cols-1 md:grid-cols-3 gap-3"><label class="font-semibold text-slate-700">Effort (SP)<input id="dev-eds-effort" type="number" min="1" max="100" value="${Utils.escapeHtml(f['Microsoft.VSTS.Scheduling.Effort'] ?? '')}" oninput="App.updateDevEstimatePreview()" class="mt-1 w-full rounded-lg border border-slate-300 p-2" /></label><label class="font-semibold text-slate-700">Horas estimadas<input id="dev-eds-hours" type="number" min="1" max="240" value="${Utils.escapeHtml(f['Microsoft.VSTS.Scheduling.OriginalEstimate'] ?? '')}" oninput="App.updateDevEstimatePreview()" class="mt-1 w-full rounded-lg border border-slate-300 p-2" /></label><label class="font-semibold text-slate-700">Capacidade da sprint (horas)<input id="dev-eds-capacity" type="number" min="1" value="${Utils.escapeHtml(sessionStorage.getItem('azure_sprint_total_hours') || '80')}" oninput="App.updateDevEstimatePreview()" class="mt-1 w-full rounded-lg border border-slate-300 p-2" /></label></div><p id="dev-eds-capacity-note" class="mt-2 text-slate-600">Selecione uma sprint para consultar as horas já planejadas.</p></div>
              <div class="rounded-xl border border-amber-200 bg-amber-50 p-3"><label class="flex items-center gap-2 font-semibold text-amber-900"><input id="dev-eds-extra" type="checkbox" onchange="document.getElementById('dev-eds-extra-box').classList.toggle('hidden', !this.checked)" /> Demanda com esforço extra?</label><div id="dev-eds-extra-box" class="hidden pt-2"><label class="font-semibold text-amber-900">Justificativa do esforço extra<textarea id="dev-eds-extra-reason" rows="2" class="mt-1 w-full rounded-lg border border-amber-300 bg-white p-2"></textarea></label></div></div>
              <div class="grid grid-cols-1 md:grid-cols-2 gap-3"><label class="font-semibold text-slate-700">Classificação na sprint<select id="dev-eds-planned" onchange="App.updateDevEstimatePreview()" class="mt-1 w-full rounded-lg border border-slate-300 bg-white p-2"><option value="Sim" ${f['Custom.Planejada'] !== 'Não' ? 'selected' : ''}>Planejada</option><option value="Não" ${f['Custom.Planejada'] === 'Não' ? 'selected' : ''}>Não planejada</option></select></label><label class="flex items-center gap-2 pt-5 font-semibold text-slate-700"><input id="dev-eds-version" type="checkbox" onchange="document.getElementById('dev-eds-feature-box').classList.toggle('hidden', !this.checked)" ${f['Custom.91d044b6-5011-4264-9412-4c91612f2474'] || this.devPlanningFeatureId ? 'checked' : ''} /> Gera versão</label></div>
              <label id="dev-eds-feature-box" class="${f['Custom.91d044b6-5011-4264-9412-4c91612f2474'] || this.devPlanningFeatureId ? '' : 'hidden'} block font-semibold text-slate-700">Feature da versão<select id="dev-eds-feature" class="mt-1 w-full rounded-lg border border-slate-300 bg-white p-2"><option value="">Carregando Features...</option></select></label>
              <label class="block font-semibold text-slate-700">Justificativa da demanda não planejada<textarea id="dev-eds-justification" rows="2" class="mt-1 w-full rounded-lg border border-slate-300 p-2">${Utils.escapeHtml(f['Custom.2a6b832b-d935-4216-9e71-72cc910f1e7e'] || '')}</textarea></label>
            </section><p class="rounded-lg border border-amber-200 bg-amber-50 p-3 text-amber-900">Ao salvar, o mesmo Work Item será convertido para Product Backlog Item, direcionado ao time e à sprint e receberá a estimativa. A coluna do board continuará controlada pelo Azure.</p></div>
          </div>`;
          const footer = `<button type="button" onclick="App.closeModal()" class="rounded-lg border border-slate-300 px-4 py-2 font-semibold">Cancelar</button><button id="dev-plan-prev" type="button" onclick="App.setDevPlanningStep(App.devPlanningStep - 1)" class="hidden rounded-lg border border-slate-300 px-4 py-2 font-semibold">Voltar</button><button id="dev-plan-assign" type="button" onclick="App.saveDevAssignment()" class="rounded-lg border border-indigo-300 bg-indigo-50 px-4 py-2 font-semibold text-indigo-800">Salvar atribuição</button><button id="dev-plan-next" type="button" onclick="App.setDevPlanningStep(App.devPlanningStep + 1)" class="rounded-lg bg-indigo-600 px-4 py-2 font-semibold text-white">Próximo passo</button><button id="dev-plan-save" type="button" onclick="App.saveDevPlanning()" class="hidden rounded-lg bg-indigo-600 px-4 py-2 font-semibold text-white">Salvar planejamento no Azure</button>`;
          this.openModal(`Planejamento Dev · Work Item #${Utils.escapeHtml(item.id)}`, body, footer);
          this.devPlanningStep = 1;
          await Promise.all([this.loadDevPlanningTeams(), this.loadDevPlanningFeatures()]);
          this.updateDevEdsCards();
          this.updateDevEstimatePreview();
          const selectedTeam = document.getElementById('dev-plan-team')?.value;
          if (selectedTeam && document.getElementById('dev-plan-area')?.value && document.getElementById('dev-plan-sprint')?.value && document.getElementById('dev-plan-owner')?.value) this.setDevPlanningStep(2);
        } catch (err) { this.showToast(`Não foi possível abrir o planejamento: ${err.message}`, 'error'); }
      },

      async loadDevPlanningFeatures() {
        const item = this.devPlanningItem;
        const select = document.getElementById('dev-eds-feature');
        const auth = this.getAzureAuthHeader();
        if (!item || !select || !auth) return;
        const project = item.fields?.['System.TeamProject'];
        const org = 'https://dev.azure.com/cagecedev';
        try {
          const query = `SELECT [System.Id] FROM WorkItems WHERE [System.TeamProject] = '${project.replace(/'/g, "''")}' AND [System.WorkItemType] = 'Feature' ORDER BY [System.Id] DESC`;
          const res = await fetch(`${org}/${encodeURIComponent(project)}/_apis/wit/wiql?api-version=7.0`, { method: 'POST', headers: { Authorization: auth, 'Content-Type': 'application/json' }, body: JSON.stringify({ query }) });
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const ids = ((await res.json()).workItems || []).slice(0, 100).map(entry => entry.id);
          if (this.devPlanningFeatureId && !ids.includes(Number(this.devPlanningFeatureId))) ids.push(Number(this.devPlanningFeatureId));
          const features = [];
          for (let i = 0; i < ids.length; i += 100) {
            const itemsRes = await fetch(`${org}/_apis/wit/workitems?ids=${ids.slice(i, i + 100).join(',')}&api-version=7.0`, { headers: { Authorization: auth, Accept: 'application/json' } });
            if (!itemsRes.ok) throw new Error(`HTTP ${itemsRes.status}`);
            features.push(...((await itemsRes.json()).value || []));
          }
          if (item.id !== this.devPlanningItem?.id) return;
          select.innerHTML = '<option value="">Selecione a Feature...</option>' + features.filter(feature => feature.fields?.['System.WorkItemType'] === 'Feature').map(feature => `<option value="${Utils.escapeHtml(feature.id)}" ${String(feature.id) === this.devPlanningFeatureId ? 'selected' : ''}>#${Utils.escapeHtml(feature.id)} · ${Utils.escapeHtml(feature.fields?.['System.Title'] || '')}</option>`).join('');
        } catch (err) {
          select.innerHTML = '<option value="">Features indisponíveis</option>';
          this.showToast(`Não foi possível listar Features: ${err.message}`, 'warning');
        }
      },

      async loadDevPlanningTeams() {
        const item = this.devPlanningItem;
        if (!item) return;
        const project = item.fields?.['System.TeamProject'];
        const select = document.getElementById('dev-plan-team');
        const auth = this.getAzureAuthHeader();
        if (!select || !project || !auth) return;
        try {
          const res = await fetch(`https://dev.azure.com/cagecedev/_apis/projects/${encodeURIComponent(project)}/teams?$top=200&api-version=7.0`, { headers: { Authorization: auth, Accept: 'application/json' } });
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const teams = ((await res.json()).value || []).filter(team => !this.normalizeDemoFieldValue(team.name).includes('productbacklog'));
          if (!teams.length) throw new Error('Nenhum time de desenvolvimento foi encontrado neste projeto.');
          const local = State.db.demandas.find(d => String(d.azureItemId) === String(item.id));
          const preferred = (item.fields?.['System.WorkItemType'] === 'Product Backlog Item' ? teams.find(team => team.name === local?.azureTeam) : null) || teams.find(team => team.name === this.devPlanningFilter?.team) || null;
          select.innerHTML = '<option value="">Selecione o time...</option>' + teams.map(team => `<option value="${Utils.escapeHtml(team.name)}" ${team.name === preferred?.name ? 'selected' : ''}>${Utils.escapeHtml(team.name)}</option>`).join('');
          if (preferred) await this.loadDevPlanningDestinations();
          else {
            const note = document.getElementById('dev-plan-destination-note');
            if (note) note.textContent = 'Escolha o time de desenvolvimento para carregar as áreas e sprints dele.';
          }
        } catch (err) {
          select.innerHTML = '<option value="">Times indisponíveis</option>';
          this.showToast(`Não foi possível carregar os times: ${err.message}`, 'error');
        }
      },

      async loadDevPlanningTeamMembers(project, team) {
        const select = document.getElementById('dev-plan-owner');
        const auth = this.getAzureAuthHeader();
        if (!select || !auth || !project || !team) return;
        select.innerHTML = '<option value="">Carregando desenvolvedores...</option>';
        select.dataset.team = '';
        try {
          const url = `https://dev.azure.com/cagecedev/_apis/projects/${encodeURIComponent(project)}/teams/${encodeURIComponent(team)}/members?$top=200&api-version=7.1`;
          const res = await fetch(url, { headers: { Authorization: auth, Accept: 'application/json' } });
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const members = ((await res.json()).value || []).map(member => member.identity).filter(identity => identity?.displayName);
          if (document.getElementById('dev-plan-team')?.value !== team) return;
          if (!members.length) throw new Error('O time não retornou desenvolvedores.');
          this.devPlanningModalMembers = members;
          const currentOwner = this.devPlanningItem?.fields?.['System.AssignedTo'];
          const currentKey = currentOwner?.uniqueName || currentOwner?.displayName || (typeof currentOwner === 'string' ? currentOwner : '');
          const filterKey = this.devPlanningFilter?.owner || '';
          const preferred = members.find(member => member.uniqueName === currentKey || member.displayName === currentKey) || members.find(member => member.uniqueName === filterKey || member.displayName === filterKey);
          select.innerHTML = '<option value="">Selecione o desenvolvedor...</option>' + members.map(member => `<option value="${Utils.escapeHtml(member.uniqueName || member.displayName)}" ${member === preferred ? 'selected' : ''}>${Utils.escapeHtml(member.displayName)}</option>`).join('');
          select.dataset.team = team;
        } catch (err) {
          this.devPlanningModalMembers = [];
          select.innerHTML = '<option value="">Desenvolvedores indisponíveis</option>';
          this.showToast(`Não foi possível carregar os desenvolvedores: ${err.message}`, 'error');
        }
      },

      async loadDevPlanningDestinations() {
        const item = this.devPlanningItem;
        const project = item?.fields?.['System.TeamProject'];
        const team = document.getElementById('dev-plan-team')?.value;
        const areaSelect = document.getElementById('dev-plan-area');
        const sprintSelect = document.getElementById('dev-plan-sprint');
        const note = document.getElementById('dev-plan-destination-note');
        const ownerSelect = document.getElementById('dev-plan-owner');
        const auth = this.getAzureAuthHeader();
        if (!item || !team || !areaSelect || !sprintSelect || !auth) return;
        const requestId = (this.devDestinationRequestId || 0) + 1;
        this.devDestinationRequestId = requestId;
        areaSelect.innerHTML = '<option value="">Carregando áreas...</option>';
        sprintSelect.innerHTML = '<option value="">Carregando sprints...</option>';
        if (ownerSelect) { ownerSelect.innerHTML = '<option value="">Carregando desenvolvedores...</option>'; ownerSelect.dataset.team = ''; }
        try {
          const base = `https://dev.azure.com/cagecedev/${encodeURIComponent(project)}/${encodeURIComponent(team)}/_apis/work/teamsettings`;
          const headers = { Authorization: auth, Accept: 'application/json' };
          const [areaRes, sprintRes] = await Promise.all([
            fetch(`${base}/teamfieldvalues?api-version=7.0`, { headers }),
            fetch(`${base}/iterations?api-version=7.0`, { headers })
          ]);
          if (!areaRes.ok || !sprintRes.ok) throw new Error(`Áreas HTTP ${areaRes.status}; sprints HTTP ${sprintRes.status}`);
          const areasData = await areaRes.json();
          const sprintData = await sprintRes.json();
          if (requestId !== this.devDestinationRequestId || item.id !== this.devPlanningItem?.id) return;
          const areas = [...new Set((areasData.values || []).map(entry => entry.value).filter(Boolean))];
          const defaultArea = typeof areasData.defaultValue === 'string' ? areasData.defaultValue : areasData.defaultValue?.value;
          if (defaultArea && !areas.includes(defaultArea)) areas.unshift(defaultArea);
          if (!areas.length) throw new Error('O time não tem Área configurada no Azure.');
          const currentArea = item.fields?.['System.AreaPath'];
          const selectedArea = item.fields?.['System.WorkItemType'] === 'Product Backlog Item' && areas.includes(currentArea) ? currentArea : (defaultArea || areas[0]);
          areaSelect.innerHTML = areas.map(area => `<option value="${Utils.escapeHtml(area)}" ${area === selectedArea ? 'selected' : ''}>${Utils.escapeHtml(area)}</option>`).join('');
          areaSelect.dataset.team = team;
          const now = Date.now();
          const currentSprint = item.fields?.['System.IterationPath'];
          const iterations = (sprintData.value || []).filter(sprint => sprint.path && (!sprint.attributes?.finishDate || Date.parse(sprint.attributes.finishDate) >= now || sprint.path === currentSprint));
          iterations.sort((a, b) => (Date.parse(a.attributes?.startDate || '') || 0) - (Date.parse(b.attributes?.startDate || '') || 0));
          if (!iterations.length) throw new Error('O time não possui sprint atual ou futura configurada.');
          const selectedSprint = iterations.find(sprint => sprint.path === currentSprint)?.path || iterations.find(sprint => sprint.attributes?.timeFrame?.toLowerCase() === 'current')?.path || iterations[0].path;
          sprintSelect.innerHTML = iterations.map(sprint => `<option value="${Utils.escapeHtml(sprint.path)}" ${sprint.path === selectedSprint ? 'selected' : ''}>${Utils.escapeHtml(sprint.name)}</option>`).join('');
          sprintSelect.dataset.team = team;
          if (note) note.textContent = `Destino: ${team}. A lista de áreas e sprints foi confirmada no Azure.`;
          await this.loadDevPlanningTeamMembers(project, team);
          await this.updateDevPlanningCapacity();
        } catch (err) {
          areaSelect.innerHTML = '<option value="">Área indisponível</option>';
          sprintSelect.innerHTML = '<option value="">Sprint indisponível</option>';
          areaSelect.dataset.team = '';
          sprintSelect.dataset.team = '';
          if (note) note.textContent = err.message;
          this.showToast(`Não foi possível confirmar o destino: ${err.message}`, 'error');
        }
      },

      async updateDevPlanningCapacity() {
        const item = this.devPlanningItem;
        const sprint = document.getElementById('dev-plan-sprint')?.value;
        const owner = document.getElementById('dev-plan-owner')?.value;
        const project = item?.fields?.['System.TeamProject'];
        const auth = this.getAzureAuthHeader();
        this.devExistingHours = null;
        this.updateDevEstimatePreview();
        if (!item || !sprint || !owner || !auth) return;
        try {
          const safeProject = project.replace(/'/g, "''");
          const safeSprint = sprint.replace(/'/g, "''");
          const safeOwner = owner.replace(/'/g, "''");
          const query = `SELECT [System.Id] FROM WorkItems WHERE [System.TeamProject] = '${safeProject}' AND [System.IterationPath] = '${safeSprint}' AND [System.AssignedTo] = '${safeOwner}' AND [System.WorkItemType] = 'Product Backlog Item'`;
          const org = 'https://dev.azure.com/cagecedev';
          const res = await fetch(`${org}/${encodeURIComponent(project)}/_apis/wit/wiql?api-version=7.0`, { method: 'POST', headers: { Authorization: auth, 'Content-Type': 'application/json' }, body: JSON.stringify({ query }) });
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const ids = ((await res.json()).workItems || []).map(entry => entry.id).filter(id => String(id) !== String(item.id));
          let hours = 0;
          for (let i = 0; i < ids.length; i += 100) {
            const cardsRes = await fetch(`${org}/_apis/wit/workitems?ids=${ids.slice(i, i + 100).join(',')}&fields=Microsoft.VSTS.Scheduling.OriginalEstimate&api-version=7.0`, { headers: { Authorization: auth, Accept: 'application/json' } });
            if (!cardsRes.ok) throw new Error(`HTTP ${cardsRes.status}`);
            hours += ((await cardsRes.json()).value || []).reduce((sum, card) => sum + (Number(card.fields?.['Microsoft.VSTS.Scheduling.OriginalEstimate']) || 0), 0);
          }
          if (item.id === this.devPlanningItem?.id && sprint === document.getElementById('dev-plan-sprint')?.value) {
            this.devExistingHours = hours;
            this.updateDevEstimatePreview();
          }
        } catch (err) {
          const note = document.getElementById('dev-eds-capacity-note');
          if (note) note.textContent = `Capacidade não consultada: ${err.message}`;
        }
      },

      updateDevEstimatePreview() {
        const ids = ['comp', 'diag', 'risk', 'val'];
        const values = Object.fromEntries(ids.map((id, index) => [['c', 'd', 'r', 'v'][index], Number(document.getElementById(`dev-eds-${id}`)?.value)]));
        const calc = this.calculateEdsEstimate(values);
        const result = document.getElementById('dev-eds-result');
        const effortInput = document.getElementById('dev-eds-effort');
        const hoursInput = document.getElementById('dev-eds-hours');
        if (calc && effortInput && hoursInput) {
          if (!effortInput.value || effortInput.value === effortInput.dataset.suggestion) effortInput.value = String(calc.effort);
          if (!hoursInput.value || hoursInput.value === hoursInput.dataset.suggestion) hoursInput.value = String(calc.hours);
          effortInput.dataset.suggestion = String(calc.effort);
          hoursInput.dataset.suggestion = String(calc.hours);
        }
        if (result) result.textContent = calc ? `${calc.score} pontos · ${calc.classification} · sugestão: ${calc.effort} SP / ${calc.hours}h` : 'Selecione os quatro critérios.';
        const extraSwitch = document.getElementById('dev-eds-extra');
        if (calc && extraSwitch && Number(hoursInput?.value) > calc.hours && !extraSwitch.checked) {
          extraSwitch.checked = true;
          document.getElementById('dev-eds-extra-box')?.classList.remove('hidden');
        }
        const breakdown = document.getElementById('dev-eds-breakdown');
        if (breakdown && calc) breakdown.innerHTML = [['Complexidade', calc.c, 2], ['Diagnóstico', calc.d, 2], ['Risco', calc.r, 2], ['Validação', calc.v, 1]].map(([name, value, weight]) => `<div class="rounded-lg border border-slate-200 bg-white p-3"><span class="font-semibold text-slate-800">${name}</span><span class="float-right font-mono font-bold text-blue-700">${value} × ${weight} = ${value * weight}</span></div>`).join('');
        const scale = document.getElementById('dev-eds-scale');
        if (scale && calc) scale.innerHTML = [[7, 8, 1, 2], [9, 11, 2, 4], [12, 14, 3, 6], [15, 18, 5, 10], [19, 22, 8, 18], [23, 25, 13, 32], [26, 28, 21, 48]].map(([start, end, sp, hrs]) => `<div class="rounded-lg border p-2 text-center ${calc.score >= start && calc.score <= end ? 'border-indigo-600 bg-indigo-600 text-white' : 'border-slate-200 bg-slate-50 text-slate-600'}"><strong class="block">${start}–${end} pts</strong><span>${sp} SP · ${hrs}h</span></div>`).join('');
        document.getElementById('dev-eds-split-alert')?.classList.toggle('hidden', (Number(hoursInput?.value) || 0) < 8);
        const note = document.getElementById('dev-eds-capacity-note');
        if (note && this.devExistingHours !== null && this.devExistingHours !== undefined) {
          const planned = this.devExistingHours + (Number(hoursInput?.value) || 0);
          const capacity = Number(document.getElementById('dev-eds-capacity')?.value) || 80;
          note.textContent = `Outros cards do desenvolvedor: ${this.devExistingHours}h · com esta demanda: ${planned}h / ${capacity}h${planned > capacity ? ' · capacidade excedida' : ''}`;
          note.className = `mt-2 ${planned > capacity ? 'font-semibold text-amber-800' : 'text-slate-600'}`;
        }
        return calc;
      },

      openPortalDemandByAzureItem(itemId, sgd = '') {
        const demand = State.db.demandas.find(d => !d.excluido && (String(d.azureItemId) === String(itemId) || (sgd && String(d.sgd) === String(sgd))));
        if (!demand) {
          this.showToast(`Não encontrei no Portal a demanda vinculada ao Work Item #${itemId}.`, 'warning');
          return;
        }
        this.openDemandaDetailModal(demand.id);
      },

      async openKanbanDevAction(demandaId) {
        const demand = State.db.demandas.find(d => d.id === demandaId && !d.excluido);
        if (!demand?.azureItemId) {
          this.showToast('Esta demanda ainda não está vinculada a um Work Item no Azure.', 'warning');
          return;
        }
        await this.openDevPlanning(demand.azureItemId);
      },

      async openDevAssignment(itemId) {
        await this.openDevPlanning(itemId);
        if (String(this.devPlanningItem?.id) === String(itemId) && !document.getElementById('app-modal-backdrop')?.classList.contains('hidden')) this.setDevPlanningStep(1);
      },

      async saveDevAssignment() {
        if (this.devPlanningSaving) return false;
        const item = this.devPlanningItem;
        const team = document.getElementById('dev-plan-team')?.value || '';
        const ownerSelect = document.getElementById('dev-plan-owner');
        const member = (this.devPlanningModalMembers || []).find(person => (person.uniqueName || person.displayName) === ownerSelect?.value);
        if (!item || !team || ownerSelect?.dataset.team !== team || !member?.displayName) {
          this.showToast('Escolha o time e o desenvolvedor responsável.', 'warning');
          return false;
        }
        const auth = this.getAzureAuthHeader();
        if (!auth) { this.showToast('Entre no Azure antes de atribuir a demanda.', 'error'); return false; }
        const button = document.getElementById('dev-plan-assign');
        this.devPlanningSaving = true;
        if (button) { button.disabled = true; button.textContent = 'Atribuindo...'; }
        try {
          const url = `https://dev.azure.com/cagecedev/_apis/wit/workitems/${encodeURIComponent(item.id)}?api-version=7.0`;
          const currentRes = await fetch(url, { headers: { Authorization: auth, Accept: 'application/json' } });
          if (!currentRes.ok) throw new Error(`Work Item HTTP ${currentRes.status}`);
          const current = await currentRes.json();
          if (current.rev !== item.rev) throw new Error('O Work Item foi alterado por outra pessoa. Feche e reabra para atribuí-lo.');
          const oldOwner = current.fields?.['System.AssignedTo'];
          const sameOwner = (oldOwner?.uniqueName && member.uniqueName && oldOwner.uniqueName.toLowerCase() === member.uniqueName.toLowerCase()) || this.normalizeDemoFieldValue(oldOwner?.displayName || oldOwner) === this.normalizeDemoFieldValue(member.displayName);
          if (!sameOwner) {
            const patch = [{ op: 'test', path: '/rev', value: current.rev }, { op: 'add', path: '/fields/System.AssignedTo', value: member.uniqueName?.includes('@') ? `${member.displayName} <${member.uniqueName}>` : member.displayName }];
            const headers = { Authorization: auth, 'Content-Type': 'application/json-patch+json' };
            const validate = await fetch(`${url}&validateOnly=true`, { method: 'PATCH', headers, body: JSON.stringify(patch) });
            if (!validate.ok) throw new Error(`O Azure recusou a atribuição: ${(await validate.text()).slice(0, 250)}`);
            const savedRes = await fetch(url, { method: 'PATCH', headers, body: JSON.stringify(patch) });
            if (!savedRes.ok) throw new Error(`Falha ao atribuir: ${(await savedRes.text()).slice(0, 250)}`);
            const saved = await savedRes.json();
            if (String(saved.id) !== String(item.id)) throw new Error('O Azure retornou um ID diferente do Work Item original.');
          }
          const demand = State.db.demandas.find(d => String(d.azureItemId) === String(item.id));
          if (demand) {
            demand.responsavel = member.displayName;
            demand.atualizadoEm = Utils.nowBR();
            this.persistLocalState();
            this.logAudit('DEMANDA', demand.id, 'Atribuição do desenvolvimento', `Work Item #${item.id} atribuído a ${member.displayName} no Azure.`, demand);
            this.syncWithGasBackend('UPSERT_DEMANDA', demand);
          }
          this.closeModal();
          this.lastDevPlanningRefreshAt = 0;
          await this.refreshDevPlanningQueue(true);
          if (this.devPlanningFilter?.owner || this.devPlanningFilter?.title || this.devPlanningFilter?.id) await this.searchDevPlanning();
          this.showToast(`Work Item #${item.id} atribuído a ${member.displayName}.`, 'success');
          return true;
        } catch (err) {
          this.showToast(err.message || 'Não foi possível atribuir o desenvolvedor.', 'error');
          return false;
        } finally {
          this.devPlanningSaving = false;
          if (button) { button.disabled = false; button.textContent = 'Salvar atribuição'; }
        }
      },

      async saveDevPlanning() {
        if (this.devPlanningSaving) return false;
        const opened = this.devPlanningItem;
        const auth = this.getAzureAuthHeader();
        if (!opened || !auth) { this.showToast('Abra uma demanda e entre no Azure antes de salvar.', 'error'); return false; }
        const project = opened.fields?.['System.TeamProject'];
        const teamSelect = document.getElementById('dev-plan-team');
        const areaSelect = document.getElementById('dev-plan-area');
        const sprintSelect = document.getElementById('dev-plan-sprint');
        const team = teamSelect?.value || '';
        const area = areaSelect?.value || '';
        const sprint = sprintSelect?.value || '';
        const ownerSelect = document.getElementById('dev-plan-owner');
        if (!team || !area || !sprint || !ownerSelect?.value || areaSelect.dataset.team !== team || sprintSelect.dataset.team !== team || ownerSelect.dataset.team !== team) {
          this.showToast('Selecione um time, sua área, uma sprint e o desenvolvedor responsável.', 'error');
          return false;
        }
        const calc = this.updateDevEstimatePreview();
        if (!calc) { this.showToast('Preencha os quatro critérios da estimativa EDS.', 'error'); return false; }
        const effort = Number(document.getElementById('dev-eds-effort')?.value);
        const hours = Number(document.getElementById('dev-eds-hours')?.value);
        const capacity = Number(document.getElementById('dev-eds-capacity')?.value);
        if (!Number.isInteger(effort) || effort < 1 || effort > 100 || !Number.isInteger(hours) || hours < 1 || hours > 240 || !Number.isInteger(capacity) || capacity < 1) {
          this.showToast('Informe Effort (1–100), horas (1–240) e capacidade válidos.', 'error');
          return false;
        }
        const planned = document.getElementById('dev-eds-planned')?.value || 'Sim';
        const justification = document.getElementById('dev-eds-justification')?.value.trim() || '';
        if (planned === 'Não' && !justification) { this.showToast('Justifique a inclusão de uma demanda não planejada.', 'error'); return false; }
        const extraEffort = !!document.getElementById('dev-eds-extra')?.checked || hours > calc.hours;
        const extraReason = document.getElementById('dev-eds-extra-reason')?.value.trim() || '';
        if (extraEffort && !extraReason) { this.showToast('Justifique o esforço extra antes de salvar.', 'error'); return false; }
        const generatesVersion = !!document.getElementById('dev-eds-version')?.checked;
        const selectedFeature = document.getElementById('dev-eds-feature')?.value || '';
        if (generatesVersion && !selectedFeature) { this.showToast('Selecione a Feature da versão antes de salvar.', 'error'); return false; }
        const identity = (this.devPlanningModalMembers || []).find(member => (member.uniqueName || member.displayName) === ownerSelect.value);
        if (!identity?.displayName) {
          this.showToast('Selecione um desenvolvedor válido do time no Azure.', 'error');
          return false;
        }
        const button = document.getElementById('dev-plan-save');
        this.devPlanningSaving = true;
        if (button) { button.disabled = true; button.textContent = 'Validando no Azure...'; }
        try {
          const org = 'https://dev.azure.com/cagecedev';
          const headers = { Authorization: auth, Accept: 'application/json' };
          const [itemRes, fieldsRes] = await Promise.all([
            fetch(`${org}/_apis/wit/workitems/${encodeURIComponent(opened.id)}?$expand=all&api-version=7.0`, { headers }),
            fetch(`${org}/${encodeURIComponent(project)}/_apis/wit/workitemtypes/Product%20Backlog%20Item/fields?$expand=all&api-version=7.0`, { headers })
          ]);
          if (!itemRes.ok || !fieldsRes.ok) throw new Error(`Consulta do card HTTP ${itemRes.status}; campos do PBI HTTP ${fieldsRes.status}.`);
          const current = await itemRes.json();
          const targetFields = (await fieldsRes.json()).value || [];
          if (current.rev !== opened.rev) throw new Error('O Work Item mudou desde que foi aberto. Feche e reabra para evitar sobrescrever alterações de outra pessoa.');
          const currentType = current.fields?.['System.WorkItemType'];
          if (!['PBI PO', 'Product Backlog Item'].includes(currentType)) throw new Error(`O tipo atual mudou para ${currentType}. Reabra a demanda.`);
          if (current.fields?.['System.TeamProject'] !== project) throw new Error('O projeto do Work Item mudou. Reabra a demanda.');
          const owner = current.fields?.['System.AssignedTo'];
          const ownerName = owner?.displayName || (typeof owner === 'string' ? owner : '');
          const sameOwner = ownerName && (this.normalizeDemoFieldValue(ownerName) === this.normalizeDemoFieldValue(identity.displayName) || (owner?.uniqueName && identity.uniqueName && owner.uniqueName.toLowerCase() === identity.uniqueName.toLowerCase()));
          const supported = new Set(targetFields.map(field => field.referenceName));
          const scoreRefs = ['Custom.26ea9776-8942-4ecb-9946-8ce50ba43ee2', 'Custom.bab3329d-61cf-4852-9a73-aa0538cd3a06', 'Custom.b7fdbae0-037f-474f-a680-ce1556ec3836', 'Custom.4ada04c0-52df-4761-a763-24f189bba138'];
          const essential = ['Microsoft.VSTS.Scheduling.Effort', 'Microsoft.VSTS.Scheduling.OriginalEstimate', ...scoreRefs];
          const missing = essential.filter(ref => !supported.has(ref));
          if (missing.length) throw new Error(`O Product Backlog Item deste projeto não possui os campos EDS necessários: ${missing.join(', ')}.`);
          const preserved = ['Custom.SGD', 'Custom.Sistema', 'Custom.TipoAtividade', 'Microsoft.VSTS.Common.AcceptanceCriteria'];
          const unavailable = preserved.filter(ref => current.fields?.[ref] != null && !supported.has(ref));
          if (unavailable.length) throw new Error(`A conversão ocultaria campos da análise do PO: ${unavailable.join(', ')}. Configure esses campos no Product Backlog Item antes de continuar.`);
          if (generatesVersion && !supported.has('Custom.91d044b6-5011-4264-9412-4c91612f2474')) throw new Error('O Product Backlog Item não possui o campo Gera Versão.');
          const chosen = ['comp', 'diag', 'risk', 'val'].map(id => Number(document.getElementById(`dev-eds-${id}`).value));
          const patch = [{ op: 'test', path: '/rev', value: current.rev }];
          const add = (field, value) => patch.push({ op: 'add', path: `/fields/${field}`, value });
          if (currentType === 'PBI PO') add('System.WorkItemType', 'Product Backlog Item');
          if (current.fields?.['System.AreaPath'] !== area) add('System.AreaPath', area);
          if (current.fields?.['System.IterationPath'] !== sprint) add('System.IterationPath', sprint);
          add('Microsoft.VSTS.Scheduling.Effort', effort);
          add('Microsoft.VSTS.Scheduling.OriginalEstimate', hours);
          scoreRefs.forEach((ref, index) => add(ref, chosen[index]));
          if (supported.has('Custom.Planejada')) add('Custom.Planejada', planned);
          if (supported.has('Custom.91d044b6-5011-4264-9412-4c91612f2474')) add('Custom.91d044b6-5011-4264-9412-4c91612f2474', generatesVersion);
          if (planned === 'Não' && supported.has('Custom.2a6b832b-d935-4216-9e71-72cc910f1e7e')) add('Custom.2a6b832b-d935-4216-9e71-72cc910f1e7e', justification);
          if (!sameOwner) add('System.AssignedTo', identity.uniqueName?.includes('@') ? `${identity.displayName} <${identity.uniqueName}>` : identity.displayName);
          const historyNotes = [];
          if (justification) historyNotes.push(`Planejamento EDS: ${justification}`);
          if (extraReason) historyNotes.push(`Demanda com esforço extra: ${extraReason}`);
          if (historyNotes.length && supported.has('System.History')) add('System.History', historyNotes.join('\n\n'));
          const parentIndex = (current.relations || []).findIndex(relation => relation.rel === 'System.LinkTypes.Hierarchy-Reverse');
          const parentId = parentIndex >= 0 ? current.relations[parentIndex].url?.match(/\/(\d+)$/)?.[1] || '' : '';
          if (parentIndex >= 0 && (!generatesVersion || parentId !== selectedFeature)) patch.push({ op: 'remove', path: `/relations/${parentIndex}` });
          if (generatesVersion && parentId !== selectedFeature) patch.push({ op: 'add', path: '/relations/-', value: { rel: 'System.LinkTypes.Hierarchy-Reverse', url: `${org}/_apis/wit/workItems/${selectedFeature}`, attributes: { comment: 'Feature da versão vinculada via Planejamento Dev' } } });
          const patchHeaders = { Authorization: auth, 'Content-Type': 'application/json-patch+json' };
          const url = `${org}/_apis/wit/workitems/${encodeURIComponent(opened.id)}?api-version=7.0`;
          const validation = await fetch(`${url}&validateOnly=true`, { method: 'PATCH', headers: patchHeaders, body: JSON.stringify(patch) });
          if (!validation.ok) {
            const detail = await validation.text();
            let parsed; try { parsed = JSON.parse(detail); } catch (_) {}
            throw new Error(`O Azure recusou o planejamento: ${parsed?.message || detail.slice(0, 250)}`);
          }
          if (button) button.textContent = 'Salvando no Azure...';
          const saveRes = await fetch(url, { method: 'PATCH', headers: patchHeaders, body: JSON.stringify(patch) });
          if (!saveRes.ok) {
            const detail = await saveRes.text();
            let parsed; try { parsed = JSON.parse(detail); } catch (_) {}
            throw new Error(`Falha ao salvar: ${parsed?.message || detail.slice(0, 250)}`);
          }
          const saved = await saveRes.json();
          if (String(saved.id) !== String(opened.id)) throw new Error('O Azure retornou um ID diferente do Work Item original.');
          const sgd = current.fields?.['Custom.SGD'] || '';
          let demand = State.db.demandas.find(d => !d.excluido && (String(d.azureItemId) === String(saved.id) || (sgd && d.sgd === sgd)));
          if (!demand) {
            const description = new DOMParser().parseFromString(current.fields?.['System.Description'] || '', 'text/html').body.textContent || '';
            const moduleName = new DOMParser().parseFromString(current.fields?.['System.Description'] || '', 'text/html').body.querySelector('p')?.textContent?.replace(/^Módulo da demanda:\s*/i, '').trim() || '';
            const module = State.db.modulos.find(m => this.normalizeDemoFieldValue(m.nome) === this.normalizeDemoFieldValue(moduleName)) || State.db.modulos[0];
            demand = { id: Utils.generateId('DEM'), sgd, titulo: current.fields?.['System.Title'] || '', descricao, moduloId: module?.id || '', prioridade: 'Média', solicitante: 'Azure DevOps', status: 'Aguardando direcionamento do Dev', dataAbertura: Utils.todayISO(), excluido: false, azureItemId: String(saved.id) };
            State.db.demandas.unshift(demand);
          }
          demand.azureProject = project;
          demand.azurePoAreaPath ||= current.fields?.['System.AreaPath'] || '';
          demand.azurePoIterationPath ||= current.fields?.['System.IterationPath'] || '';
          demand.azureTeam = team;
          demand.azureAreaPath = saved.fields?.['System.AreaPath'] || area;
          demand.azureIterationPath = saved.fields?.['System.IterationPath'] || sprint;
          demand.azureWorkItemType = saved.fields?.['System.WorkItemType'] || 'Product Backlog Item';
          demand.azureState = saved.fields?.['System.State'] || current.fields?.['System.State'] || 'New';
          demand.azureBoardColumn = saved.fields?.['System.BoardColumn'] || current.fields?.['System.BoardColumn'] || '';
          demand.responsavel = identity.displayName;
          demand.equipe = team;
          demand.devEffort = effort;
          demand.devEstimatedHours = hours;
          demand.devEdsScore = calc.score;
          demand.devPlanned = planned;
          demand.atualizadoEm = Utils.nowBR();
          this.logAudit('DEMANDA', demand.id, 'Planejamento EDS no Azure', `Work Item #${saved.id} direcionado a ${team}, ${area}, ${sprint}; ${calc.score} pontos, ${effort} SP e ${hours}h.`, demand);
          this.persistLocalState();
          this.syncWithGasBackend('UPSERT_DEMANDA', demand);
          sessionStorage.setItem('azure_sprint_total_hours', String(capacity));
          this.closeModal();
          this.showToast(`Work Item #${saved.id} planejado no Azure. O card segue New até o dev iniciar o atendimento no board.`, 'success');
          this.lastDevPlanningRefreshAt = 0;
          await this.refreshDevPlanningQueue(true);
          if (this.devPlanningFilter?.owner || this.devPlanningFilter?.title || this.devPlanningFilter?.id) await this.searchDevPlanning();
          return true;
        } catch (err) {
          this.showToast(err.message || 'Não foi possível salvar o planejamento.', 'error');
          return false;
        } finally {
          this.devPlanningSaving = false;
          if (button) { button.disabled = false; button.textContent = 'Salvar planejamento no Azure'; }
        }
      },

      async syncDemandaToAzure(demandaId) {
        if (!demandaId) {
          this.showToast('Salve a demanda primeiro para gerar o registro antes de sincronizar com o Azure Boards.', 'warning');
          return;
        }
        const d = State.db.demandas.find(x => x.id === demandaId);
        if (!d) return false;

        if (this.pendingDemandFiles?.length && this.currentEditingDemandaId === demandaId) {
          try {
            await this.savePendingDemandFiles(d);
            this.renderDemandAttachmentLists(demandaId);
          } catch (err) {
            this.showToast('Não foi possível guardar os anexos: ' + err.message, 'error');
            return false;
          }
        }

        const authHeader = this.getAzureAuthHeader();
        const orgUrl = 'https://dev.azure.com/cagecedev';
        const selectedProj = document.getElementById('dem-azure-project')?.value || d.azureProject || State.azureConfig?.project || sessionStorage.getItem('azure_project') || 'Administrativo';
        const selectedTeam = document.getElementById('dem-azure-team')?.value || d.azureTeam || State.azureConfig?.team || 'Sustentação Administrativo';
        const selectedWit = d.azureItemId ? (d.azureWorkItemType || 'PBI PO') : 'PBI PO';

        if (!authHeader) {
          this.showToast('Configure o PAT do PO nesta sessão antes de enviar ao Azure.', 'error');
          return false;
        }

        const areaSelect = document.getElementById('dem-azure-area-path');
        let selectedArea = '';
        if (areaSelect) {
          const areaLoaded = await this.loadAzureAreaPathsForPo(true);
          if (!areaLoaded || areaSelect.dataset.azureTeam !== selectedTeam || areaSelect.dataset.azureProject !== selectedProj) {
            this.showToast(`Não foi possível confirmar a Área do time "${selectedTeam}" no projeto "${selectedProj}". O Work Item não foi enviado para evitar criá-lo no backlog errado.`, 'error');
            return false;
          }
          selectedArea = areaSelect.value;
        } else {
          try {
            const areaUrl = `${orgUrl}/${encodeURIComponent(selectedProj)}/${encodeURIComponent(selectedTeam)}/_apis/work/teamsettings/teamfieldvalues?api-version=7.0`;
            const areaRes = await fetch(areaUrl, { headers: { Authorization: authHeader, Accept: 'application/json;api-version=7.0' } });
            if (!areaRes.ok) throw new Error(`HTTP ${areaRes.status}`);
            const areaData = await areaRes.json();
            const teamAreas = (areaData.values || []).map(item => item.value).filter(Boolean);
            const defaultArea = areaData.defaultValue || teamAreas[0] || '';
            selectedArea = d.azureTeam === selectedTeam && teamAreas.includes(d.azureAreaPath) ? d.azureAreaPath : defaultArea;
            if (!selectedArea) throw new Error('O Azure não retornou uma Área padrão para este time.');
          } catch (err) {
            this.showToast(`Não foi possível confirmar a Área do time "${selectedTeam}" no projeto "${selectedProj}" (${err.message}). O Work Item não foi enviado para evitar criá-lo no backlog errado.`, 'error');
            return false;
          }
        }

        d.azureProject = selectedProj;
        d.azureTeam = selectedTeam;
        d.azureWorkItemType = selectedWit;
        d.azureAreaPath = selectedArea;

        // 1. Se possuir Token PAT do PO ativo, envia ou atualiza o Work Item real no Azure DevOps REST API
        if (authHeader) {
          let azureWorkType = selectedWit;
          const areaPath = selectedArea;
          if (d.azureItemId) {
            try {
              const currentRes = await fetch(`${orgUrl}/_apis/wit/workitems/${encodeURIComponent(d.azureItemId)}?api-version=7.0`, {
                headers: { Authorization: authHeader, Accept: 'application/json;api-version=7.0' }
              });
              if (!currentRes.ok) throw new Error(`HTTP ${currentRes.status}`);
              const currentItem = await currentRes.json();
              azureWorkType = currentItem.fields?.['System.WorkItemType'] || selectedWit;
              d.azureWorkItemType = azureWorkType;
            } catch (err) {
              this.showToast(`Não foi possível confirmar o tipo atual do Work Item #${d.azureItemId}: ${err.message}`, 'error');
              return false;
            }
          }
          let typeFieldsRes;
          try {
            typeFieldsRes = await fetch(`${orgUrl}/${encodeURIComponent(selectedProj)}/_apis/wit/workitemtypes/${encodeURIComponent(azureWorkType)}/fields?$expand=all&api-version=7.0`, {
            headers: { Authorization: authHeader, Accept: 'application/json;api-version=7.0' }
            });
          } catch (err) {
            this.showToast(`Falha ao consultar campos do tipo "${azureWorkType}": ${err.message}.`, 'error');
            return false;
          }
          if (!typeFieldsRes.ok) {
            const detail = (await typeFieldsRes.text().catch(() => '')).slice(0, 220);
            this.showToast(`Não foi possível validar o tipo "${azureWorkType}" no projeto (HTTP ${typeFieldsRes.status}). ${detail}`, 'error');
            return false;
          }
          const typeFieldsData = await typeFieldsRes.json();
          const supportedFields = new Set((typeFieldsData.value || []).map(field => field.referenceName));

          // Mantém os critérios separados da descrição da demanda no Work Item.
          const criterios = (State.db.criteriosAceitacao || []).filter(c => c.demandaId === d.id);
          let criteriosHtml = '';
          if (criterios.length > 0) {
            criteriosHtml = `<ul>` +
              criterios.map(c => `<li><strong>${Utils.escapeHtml(c.cenario || 'Critério')}:</strong> DADO ${Utils.escapeHtml(c.dado || '')} QUANDO ${Utils.escapeHtml(c.quando || '')} ENTÃO ${Utils.escapeHtml(c.entao || '')}</li>`).join('') +
              `</ul>`;
          }

          const selectedModuleId = document.getElementById('dem-modulo')?.value || d.moduloId;
          const moduleName = this.getModuleName(selectedModuleId);
          const descriptionHtml = `<div><p><strong>Módulo da demanda:</strong> ${Utils.escapeHtml(moduleName)}</p><p>${Utils.escapeHtml(d.descricao || '')}</p>${d.problema ? `<p><strong>Problema / Motivação:</strong> ${Utils.escapeHtml(d.problema)}</p>` : ''}${d.resultadoEsperado ? `<p><strong>Resultado Esperado:</strong> ${Utils.escapeHtml(d.resultadoEsperado)}</p>` : ''}</div>`;

          const fieldValues = {
            'System.Title': `[SGD ${d.sgd}] - ${d.titulo}`.slice(0, 255),
            'System.Description': descriptionHtml,
            'Custom.SGD': d.sgd,
            'System.AreaPath': areaPath,
            'Microsoft.VSTS.Common.Priority': d.prioridade === 'Crítica' ? 1 : d.prioridade === 'Alta' ? 2 : d.prioridade === 'Média' ? 3 : 4
          };
          if (d.azureItemId && ['Aguardando direcionamento do Dev', 'Em atendimento', 'Em homologação', 'Concluída'].includes(d.status)) {
            delete fieldValues['System.AreaPath'];
          }
          const normalizeFieldName = value => this.normalizeDemoFieldValue(value);
          const fieldByDisplayName = displayName => (typeFieldsData.value || []).find(field => normalizeFieldName(field.name) === normalizeFieldName(displayName));
          const acceptanceField = (typeFieldsData.value || []).find(field => field.referenceName === 'Microsoft.VSTS.Common.AcceptanceCriteria') ||
            (typeFieldsData.value || []).find(field => ['criteriosdeaceite', 'criteriosdeaceitacao', 'acceptancecriteria'].includes(normalizeFieldName(field.name)));
          if (criteriosHtml) {
            if (!acceptanceField?.referenceName) {
              this.showToast(`O tipo "${azureWorkType}" não possui um campo de Critérios de Aceite no Azure. Configure esse campo antes de enviar a demanda.`, 'error');
              return false;
            }
            fieldValues[acceptanceField.referenceName] = criteriosHtml;
          }
          const sistemaField = fieldByDisplayName('Sistema');
          const activityField = fieldByDisplayName('Tipo Atividade');
          const blockedField = fieldByDisplayName('Blocked');
          if (azureWorkType === 'PBI PO' && (!sistemaField?.referenceName || !activityField?.referenceName)) {
            this.showToast('O PBI PO do Azure não retornou Sistema ou Tipo de Atividade. O Work Item não foi enviado.', 'error');
            return false;
          }
          if (sistemaField?.referenceName) {
            const requestedSystem = document.getElementById('dem-azure-system')?.value || d.azureSystem || '';
            const allowed = Array.isArray(sistemaField.allowedValues) ? sistemaField.allowedValues.map(String) : [];
            const matched = allowed.find(value => normalizeFieldName(value) === normalizeFieldName(requestedSystem));
            if (allowed.length && !matched) {
              this.showToast(`Sistema "${requestedSystem}" não está permitido no Azure para ${azureWorkType}. Selecione um valor da lista validada pelo PO.`, 'error');
              return false;
            }
            fieldValues[sistemaField.referenceName] = matched || requestedSystem;
          }
          if (activityField?.referenceName) {
            const requestedActivity = document.getElementById('dem-azure-activity-type')?.value || d.azureActivityType || '';
            const allowed = Array.isArray(activityField.allowedValues) ? activityField.allowedValues.map(String) : [];
            let matched = allowed.find(value => normalizeFieldName(value) === normalizeFieldName(requestedActivity));
            if (!matched && allowed.length && this.normalizeDemoFieldValue(requestedActivity).includes('novafunc')) {
              matched = allowed.find(value => normalizeFieldName(value) === normalizeFieldName('Alteração'));
            }
            if (allowed.length && !matched) {
              this.showToast(`Tipo de Atividade "${requestedActivity}" não está permitido no Azure para ${azureWorkType}. Confira as opções com o PO.`, 'error');
              return false;
            }
            fieldValues[activityField.referenceName] = matched || requestedActivity;
          }
          if (blockedField?.referenceName && !d.azureItemId) {
            let blockedValue = String(d.azureBlocked ?? blockedField.defaultValue ?? 'false');
            const allowedBlockedValues = Array.isArray(blockedField.allowedValues) ? blockedField.allowedValues.map(String) : [];
            const blockedMeaning = value => {
              const normalized = normalizeFieldName(value);
              if (['false', 'no', 'nao', '0', 'unblocked', 'notblocked'].includes(normalized) || normalized.startsWith('nao') || normalized.startsWith('not') || normalized.startsWith('un')) return false;
              if (['true', 'yes', 'sim', '1', 'blocked'].includes(normalized) || normalized.includes('blocked') || normalized.startsWith('sim')) return true;
              return null;
            };
            if (allowedBlockedValues.length && !allowedBlockedValues.includes(blockedValue)) {
              const meaning = typeof d.azureBlocked === 'boolean' ? d.azureBlocked : blockedMeaning(blockedValue);
              blockedValue = allowedBlockedValues.find(value => meaning != null && blockedMeaning(value) === meaning) || (allowedBlockedValues.includes(String(blockedField.defaultValue)) ? String(blockedField.defaultValue) : allowedBlockedValues[0]);
            }
            const isBooleanField = String(blockedField.type || '').toLowerCase() === 'boolean';
            fieldValues[blockedField.referenceName] = isBooleanField ? blockedMeaning(blockedValue) === true : blockedValue;
          }
          const patchDoc = Object.entries(fieldValues)
            .filter(([referenceName, value]) => supportedFields.has(referenceName) && value !== '')
            .map(([referenceName, value]) => ({ op: 'add', path: `/fields/${referenceName}`, value }));
          const includedFields = new Set(patchDoc.map(op => op.path.replace('/fields/', '')));
          const requiredFieldAliases = { 'System.AreaId': 'System.AreaPath', 'System.IterationId': 'System.IterationPath' };
          const missingRequired = (typeFieldsData.value || [])
            .filter(field => {
              const name = normalizeFieldName(field.name);
              const pathAlias = requiredFieldAliases[field.referenceName] || (name === 'areaid' ? 'System.AreaPath' : name === 'iterationid' ? 'System.IterationPath' : '');
              if (!includedFields.has(pathAlias) && (field.referenceName === 'System.IterationId' || name === 'iterationid')) return false;
              return !d.azureItemId && field.alwaysRequired && field.defaultValue == null && !includedFields.has(field.referenceName) && !includedFields.has(pathAlias);
            })
            .map(field => field.name || field.referenceName);
          if (missingRequired.length) {
            this.showToast(`O tipo "${azureWorkType}" exige campos que a demanda ainda não preenche: ${missingRequired.join(', ')}.`, 'error');
            return false;
          }

          try {
            let res = null;
            if (d.azureItemId) {
              // Atualiza Work Item existente
              res = await fetch(`${orgUrl}/${encodeURIComponent(selectedProj)}/_apis/wit/workitems/${d.azureItemId}?api-version=7.0`, {
                method: 'PATCH',
                headers: {
                  'Authorization': authHeader,
                  'Content-Type': 'application/json-patch+json'
                },
                body: JSON.stringify(patchDoc)
              });
            } else {
              // Cria novo Work Item
              res = await fetch(`${orgUrl}/${encodeURIComponent(selectedProj)}/_apis/wit/workitems/$${encodeURIComponent(azureWorkType)}?api-version=7.0`, {
                method: 'POST',
                headers: {
                  'Authorization': authHeader,
                  'Content-Type': 'application/json-patch+json'
                },
                body: JSON.stringify(patchDoc)
              });
            }

            if (res.ok) {
              const resData = await res.json();
              d.azureItemId = String(resData.id);
              d.moduloId = document.getElementById('dem-modulo')?.value || d.moduloId;
              d.azureWorkItemType = resData.fields?.['System.WorkItemType'] || azureWorkType;
              d.azureItemUrl = `${orgUrl}/${encodeURIComponent(selectedProj)}/_workitems/edit/${d.azureItemId}`;
              d.azureAreaPath = resData.fields?.['System.AreaPath'] || areaPath;
              d.azureIterationPath = resData.fields?.['System.IterationPath'] || d.azureIterationPath || '';
              if (!d.azurePoAreaPath) d.azurePoAreaPath = d.azureAreaPath;
              if (!d.azurePoIterationPath) d.azurePoIterationPath = d.azureIterationPath;
              if (['Aberta', 'Aguardando análise do PO'].includes(d.status)) d.status = 'Aguardando direcionamento do Dev';
              d.azureState = resData.fields?.['System.State'] || d.azureState || 'New';
              d.atualizadoEm = Utils.nowBR();
              this.persistLocalState();
              this.logAudit('DEMANDA', d.id, 'Sincronização com Azure Boards', `Work Item #${d.azureItemId} criado/atualizado no Azure DevOps (${azureWorkType} • Projeto: ${selectedProj} • Time selecionado no Portal: ${selectedTeam})`);
              const failedAttachments = await this.syncDemandAttachmentsToAzure(d, authHeader);
              if (failedAttachments.length) this.showToast(`Work Item #${d.azureItemId} salvo, mas há anexos pendentes: ${failedAttachments.join('; ').slice(0, 180)}`, 'warning');
              else this.showToast(`Work Item #${d.azureItemId} salvo no projeto "${selectedProj}" com os anexos.`, 'success');
              
              const pTag = document.getElementById('dem-azure-badge-text');
              if (pTag) {
                pTag.innerHTML = `Vinculado ao Azure Work Item <a href="${Utils.escapeHtml(d.azureItemUrl)}" target="_blank" rel="noopener" class="font-bold text-blue-700 underline">#${Utils.escapeHtml(d.azureItemId)} ↗</a> (${azureWorkType} • ${Utils.escapeHtml(selectedProj)})`;
              }
              const azureInput = document.getElementById('dem-azureItemId');
              if (azureInput) azureInput.value = d.azureItemId;
              const azureStateInput = document.getElementById('dem-azureState');
              if (azureStateInput) azureStateInput.value = d.azureState;
              this.renderCurrentView();
              return true;
            } else {
              const errTxt = await res.text().catch(() => '');
              let azureMessage = errTxt;
              try { azureMessage = JSON.parse(errTxt).message || errTxt; } catch (_) {}
              console.warn('Erro ao sincronizar com Azure REST API:', res.status, errTxt);
              this.showToast('Azure recusou o Work Item: ' + azureMessage.slice(0, 220), 'error');
              return false;
            }
          } catch (netErr) {
            console.warn('Falha de rede/CORS ao conectar com Azure:', netErr);
            this.showToast('Falha de rede ao acessar o Azure. Verifique a conexão e tente novamente.', 'error');
            return false;
          }
        }

        this.showToast('Falha ao enviar ao Azure. Confira a configuração do Work Item e tente novamente.', 'error');
        return false;
      },

      syncAllDemandasToAzure() {
        this.showToast('A sincronização em lote está desativada no piloto para evitar criação acidental de itens.', 'warning');
      },

      async refreshAzureRouting(silent = false) {
        const authHeader = this.getAzureAuthHeader();
        if (!authHeader) {
          if (!silent) this.showToast('Configure o PAT para consultar o direcionamento no Azure.', 'warning');
          return false;
        }
        if (this.azureRoutingRefreshInProgress) return false;
        if (silent && Date.now() - (this.lastAzureRoutingRefreshAt || 0) < 60000) return false;
        const pending = State.db.demandas.filter(d => !d.excluido && ['Aguardando direcionamento do Dev', 'Em atendimento'].includes(d.status) && d.azureItemId);
        if (!pending.length) return false;
        this.azureRoutingRefreshInProgress = true;
        this.lastAzureRoutingRefreshAt = Date.now();
        let moved = 0;
        let sentToHomologation = 0;
        let failures = 0;
        try {
          for (const d of pending) {
            try {
              const url = `https://dev.azure.com/cagecedev/_apis/wit/workitems/${encodeURIComponent(d.azureItemId)}?api-version=7.0`;
              const res = await fetch(url, { headers: { Authorization: authHeader, Accept: 'application/json;api-version=7.0' } });
              if (!res.ok) throw new Error(`HTTP ${res.status}`);
              const item = await res.json();
              const area = item.fields?.['System.AreaPath'] || '';
              const iteration = item.fields?.['System.IterationPath'] || '';
              const workItemType = item.fields?.['System.WorkItemType'] || '';
              const boardColumn = String(item.fields?.['System.BoardColumn'] || '');
              const azureState = String(item.fields?.['System.State'] || '');
              const azureStep = (boardColumn || azureState).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[^a-z0-9]/g, '');
              const isActive = ['ematendimento', 'inprogress', 'active', 'committed'].includes(azureStep);
              const isDone = ['done', 'closed', 'completed', 'concluido', 'concluida'].includes(azureStep);
              const poArea = d.azurePoAreaPath || d.azureAreaPath || '';
              const poIteration = d.azurePoIterationPath || d.azureIterationPath || '';
              const owner = item.fields?.['System.AssignedTo'];
              const ownerName = owner?.displayName || (typeof owner === 'string' ? owner : '');
              const effort = item.fields?.['Microsoft.VSTS.Scheduling.Effort'];
              const estimatedHours = item.fields?.['Microsoft.VSTS.Scheduling.OriginalEstimate'];
              const routed = area && iteration && area !== poArea && iteration !== poIteration && iteration.includes('\\');
              if ((workItemType && d.azureWorkItemType !== workItemType) || (boardColumn && d.azureBoardColumn !== boardColumn) || (azureState && d.azureState !== azureState) || (routed && (d.azureAreaPath !== area || d.azureIterationPath !== iteration)) || (ownerName && d.responsavel !== ownerName) || (effort != null && d.devEffort !== effort) || (estimatedHours != null && d.devEstimatedHours !== estimatedHours)) {
                d.azureWorkItemType = workItemType;
                d.azureBoardColumn = boardColumn;
                d.azureState = azureState;
                if (routed) {
                  d.azurePoAreaPath = poArea;
                  d.azurePoIterationPath = poIteration;
                  d.azureAreaPath = area;
                  d.azureIterationPath = iteration;
                }
                if (ownerName) d.responsavel = ownerName;
                if (effort != null) d.devEffort = effort;
                if (estimatedHours != null) d.devEstimatedHours = estimatedHours;
                d.atualizadoEm = Utils.nowBR();
                this.persistLocalState();
                this.syncWithGasBackend('UPSERT_DEMANDA', d);
              }
              if (d.status === 'Aguardando direcionamento do Dev' && workItemType === 'Product Backlog Item' && routed && (isActive || isDone)) {
                d.azurePoAreaPath = poArea;
                d.azurePoIterationPath = poIteration;
                d.azureAreaPath = area;
                d.azureIterationPath = iteration;
                d.status = isDone ? 'Em homologação' : 'Em atendimento';
                d.dataInicio = d.dataInicio || Utils.todayISO();
                d.atualizadoEm = Utils.nowBR();
                this.logAudit('DEMANDA', d.id, 'Etapa confirmada no Azure', `Work Item #${d.azureItemId}: coluna ${boardColumn || azureState}, área ${area}, Sprint ${iteration}.`, d);
                this.syncWithGasBackend('UPSERT_DEMANDA', d);
                moved++;
                if (isDone) sentToHomologation++;
              } else if (d.status === 'Em atendimento' && workItemType === 'Product Backlog Item' && isDone) {
                d.status = 'Em homologação';
                d.azureAreaPath = area || d.azureAreaPath;
                d.azureIterationPath = iteration || d.azureIterationPath;
                d.atualizadoEm = Utils.nowBR();
                this.logAudit('DEMANDA', d.id, 'Desenvolvimento concluído no Azure', `Work Item #${d.azureItemId} chegou à coluna ${boardColumn || azureState}; aguardando homologação no Portal.`, d);
                this.syncWithGasBackend('UPSERT_DEMANDA', d);
                moved++;
                sentToHomologation++;
              }
            } catch (err) {
              failures++;
              console.warn('[Azure] Falha ao verificar direcionamento:', d.azureItemId, err);
            }
          }
          if (moved) {
            this.persistLocalState();
            this.renderCurrentView();
            this.showToast(`${moved - sentToHomologation} demanda(s) em atendimento e ${sentToHomologation} em homologação após atualização do Azure.`, 'success');
          } else if (!silent) {
            this.showToast(failures ? `Não foi possível consultar ${failures} Work Item(s) no Azure.` : 'Nenhuma mudança de coluna no Azure exige atualização do Portal agora.', failures ? 'error' : 'info');
          }
          return moved > 0;
        } finally {
          this.azureRoutingRefreshInProgress = false;
        }
      },

    /*************************************************************************

    const Views = {
      // 6.1 DASHBOARD PRINCIPAL COM COMPONENTES DO DESIGN SYSTEM (Page Header, Barra #E7F3FF, Card de Filtros, StatCards border-l-[5px] e 13 Módulos)
      quickFilter(prefix, items) {

      },
      filterQuick(items, prefix) {

        return items.filter(x => { const linked = x.moduloId || State.db.demandas.find(d => d.id === x.entidadeId)?.moduloId || State.db.funcionalidades.find(r => r.id === x.entidadeId)?.moduloId || State.db.alteracoes.find(a => a.id === x.entidadeId)?.moduloId || State.db.historiasUsuario.find(h => h.id === x.entidadeId)?.moduloId; return (!f.module || f.module === 'TODOS' || linked === f.module) && (!f.status || f.status === 'TODOS' || (x.status || x.situacao || x.tipoEvento) === f.status) && (!q || JSON.stringify(x).toLowerCase().includes(q)); });

        const modulosAtivos = State.db.modulos.filter(m => m.ativo);

        const scopeModObj = modFilter !== 'TODOS' ? State.db.modulos.find(m => m.id === modFilter) : null;
        const defaultModId = scopeModObj ? scopeModObj.id : (State.selectedModuleId || (modulosAtivos[0] ? modulosAtivos[0].id : ''));

        const statusFilter = State.filters.status === 'Aberta' ? 'Aguardando análise do PO' : (State.filters.status || 'TODOS');

        const dtInicio = State.filters.periodoInicio || '';
        const dtFim = State.filters.periodoFim || '';
        const hasActiveFilter = modFilter !== 'TODOS' || statusFilter !== 'TODOS' || prioFilter !== 'TODOS' || Boolean(buscaTexto) || Boolean(dtInicio) || Boolean(dtFim);

        const filterFn = (item) => {

        const matchDemandFilter = (d) => {

          if (prioFilter !== 'TODOS' && d.prioridade !== prioFilter) return false;
          if (dtInicio && d.dataAbertura && d.dataAbertura < dtInicio) return false;

          if (buscaTexto) {

        const funcs = State.db.funcionalidades.filter(f => !f.excluido && filterFn(f));

        // Geometria do Donut SVG (r = 15.9155 => circunferência = 100)

        const offsetDef = 100 - dashDisp;

        // Top módulos por volume de funcionalidades + demandas

        const concluidas = dems.filter(d => d.status === 'Concluída').length;
        const canceladas = dems.filter(d => d.status === 'Não atendida / Cancelada').length;
        const totalDemsSafe = dems.length || 1;
        const taxaConclusao = dems.length > 0 ? Math.round((concluidas / dems.length) * 100) : 0;

        const prioCritica = dems.filter(d => d.prioridade === 'Crítica').length;
        const prioAlta = dems.filter(d => d.prioridade === 'Alta').length;
        const prioMedia = dems.filter(d => !d.prioridade || d.prioridade === 'Média').length;
        const prioBaixa = dems.filter(d => d.prioridade === 'Baixa').length;

        const storiesImplementadas = stories.filter(h => h.status === 'Implementada' || h.status === 'Aprovada para Dev').length;

        return `
          <!-- 1. CABEÇALHO DA PÁGINA -->

                </span>

            <!-- BLOCO 1: ACOMPANHAMENTO DE DEMANDAS SGD (2/3 LARGURA) + DOIS QUADRANTES GRÁFICOS EMPILHADOS AO LADO (1/3 LARGURA) -->

              <!-- Esquerda (2/3): Acompanhamento de Demandas SGD -->

                <header class="p-3.5 px-4 border-b border-slate-200 bg-white flex flex-wrap justify-between items-center gap-2 shadow-2xs z-10">

                      <span class="bg-[#E7F3FF] text-[#1976d2] w-6 h-6 flex items-center justify-center rounded-md shadow-2xs">
                        <i data-lucide="ticket" class="w-3.5 h-3.5"></i>
                      </span>
                      <span>Acompanhamento de Demandas (SGD)</span>
                      <span class="bg-slate-100 border border-slate-200 text-slate-700 px-1.5 py-0.2 rounded text-[11px] font-bold font-mono">${dems.length}</span>

                  ` : `
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-3 content-start">

          const isConcluida = d.status === 'Concluída';
          const isCancelada = d.status === 'Não atendida / Cancelada';
          const dotColor = isConcluida ? 'bg-emerald-500' : isCancelada ? 'bg-rose-500' : 'bg-amber-500';
          const statusText = isConcluida ? 'text-emerald-700' : isCancelada ? 'text-rose-700' : 'text-amber-700';
          const leftAccent = isConcluida ? 'border-l-emerald-500' : isCancelada ? 'border-l-rose-500' : 'border-l-amber-500';
          return `
                          <article onclick="App.openDemandaDetailModal('${d.id}')" class="cursor-pointer p-3.5 rounded-xl border border-slate-200/95 border-l-[3px] ${leftAccent} bg-white shadow-rh-item hover:shadow-rh-hover hover:-translate-y-0.5 hover:border-[#2196f3] transition-all flex flex-col justify-between gap-2 group">

            const isSelectedPrio = prioFilter === p.key;

                          <button type="button" onclick="State.filters.prioridade = State.filters.prioridade === '${p.key}' ? 'TODOS' : '${p.key}'; App.renderCurrentView();" class="p-2 rounded-lg border ${p.box} transition flex flex-col items-center justify-between gap-1 ${isSelectedPrio ? 'ring-2 ring-[#2196f3]' : ''}" title="Clique para filtrar por prioridade ${p.key}">
                            <div class="text-sm font-bold ${p.num} font-mono leading-none">${p.val}</div>

                            <div class="w-full h-1 bg-white/80 rounded-full overflow-hidden mt-0.5">

                            </div>
                          </button>
                        `;
          }).join('')}
                    </div>
                  </div>
                </aside>

                <!-- Subquadrante Gráfico Inferior: Funil & Situação SGD -->

                          ${concluidas > 0 ? `<div class="h-full bg-emerald-500" style="width: ${(concluidas / totalDemsSafe) * 100}%" title="Concluídas: ${concluidas}"></div>` : ''}
                          ${canceladas > 0 ? `<div class="h-full bg-rose-500 rounded-r-full" style="width: ${(canceladas / totalDemsSafe) * 100}%" title="Canceladas: ${canceladas}"></div>` : ''}

                            </div>

            <!-- BLOCO 2: CATÁLOGO DE FUNCIONALIDADES (2/3 LARGURA) + DOIS QUADRANTES GRÁFICOS EMPILHADOS AO LADO (1/3 LARGURA) -->
